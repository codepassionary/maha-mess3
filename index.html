<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VetTrack Luxe | Premier</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            /* Dark Theme (Default) Variables */
            --p: #FF8C00; --p-glow: rgba(255, 140, 0, 0.4);
            --bg: #0B0F1A; --card: rgba(30, 41, 59, 0.7); --surface: rgba(51, 65, 85, 0.5);
            --text: #FFFFFF; --sub: #94A3B8; --inv-text: #000000;
        }

        body.light-theme {
            /* Light Theme Variables */
            --bg: #F8FAFC; --card: rgba(255, 255, 255, 0.8); --surface: rgba(203, 213, 225, 0.8);
            --text: #0F172A; --sub: #64748B; --inv-text: #FFFFFF;
            background-image: radial-gradient(circle at 0% 0%, #e2e8f0 0%, transparent 40%),
                              radial-gradient(circle at 100% 100%, #cbd5e1 0%, transparent 40%);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding-bottom: 40px; padding-top: env(safe-area-inset-top);
            background-image: radial-gradient(circle at 0% 0%, #1e293b 0%, transparent 40%),
                              radial-gradient(circle at 100% 100%, #0f172a 0%, transparent 40%);
            background-attachment: fixed;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .container { max-width: 480px; margin: 0 auto; padding: 25px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        #greetLabel { margin: 0; font-size: 11px; color: var(--p); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        #userLabel { font-family: 'Outfit'; font-size: 34px; margin: 0; font-weight: 800; letter-spacing: -1.5px; }
        
        .theme-toggle-container { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 15px 20px; border-radius: 20px; border: 1px solid var(--surface); margin-bottom: 20px; }
        .theme-toggle-label { font-size: 13px; font-weight: 700; color: var(--text); }
        .theme-toggle { background: var(--surface); border: none; font-size: 20px; width: 44px; height: 44px; border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        
        .pfp-wrap { position: relative; padding: 3px; border-radius: 20px; background: linear-gradient(135deg, var(--p), transparent); }
        .pfp { width: 50px; height: 50px; border-radius: 16px; cursor: pointer; object-fit: cover; display: block; border: 2px solid var(--bg); }

        .stat-card {
            background: linear-gradient(135deg, #FF8C00 0%, #FF5F1F 100%);
            padding: 30px; border-radius: 35px; margin-bottom: 30px;
            box-shadow: 0 20px 40px -10px var(--p-glow);
            position: relative; overflow: hidden;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.9); margin-bottom: 5px; }
        .total-val { font-family: 'Outfit'; font-size: 50px; font-weight: 900; color: white; letter-spacing: -2px; line-height: 0.9; }
        
        .quick-log-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.4);
            color: white; padding: 14px; border-radius: 24px;
            display: flex; flex-direction: column; align-items: center;
            font-weight: 800; font-size: 11px; cursor: pointer; transition: 0.3s;
            z-index: 2; min-width: 110px;
        }
        .quick-log-btn.done { background: white; color: var(--p); border-color: white; }
        .quick-log-btn.disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        .quick-log-btn i { font-style: normal; font-size: 22px; margin-bottom: 4px; }

        .nav-pill { 
            display: flex; align-items: center; background: var(--card); padding: 8px; 
            border-radius: 24px; border: 1px solid var(--surface); margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }
        .nav-pill button { border: none; background: var(--surface); color: var(--text); width: 42px; height: 42px; border-radius: 16px; cursor: pointer; font-size: 18px; }
        .nav-pill button.nav-hidden { visibility: hidden; pointer-events: none; }
        .nav-pill span { flex: 1; text-align: center; font-weight: 800; font-size: 15px; color: var(--text); }

        .tools-row { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn-pdf { background: var(--card); color: var(--text); flex: 1; padding: 12px; border-radius: 20px; border: 1px solid var(--surface); font-weight: 800; font-size: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; backdrop-filter: blur(10px); transition: 0.2s;}
        .btn-pdf:hover { background: var(--surface); }

        .view-only-badge { text-align: center; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; font-size: 10px; font-weight: 900; padding: 8px; border-radius: 12px; margin-bottom: 20px; display: none; text-transform: uppercase; }

        .day-item { 
            display: grid; grid-template-columns: 70px 1fr 1fr 1fr; gap: 12px; align-items: center; 
            padding: 18px; background: var(--card); border-radius: 30px; margin-bottom: 16px;
            border: 1px solid var(--surface); backdrop-filter: blur(10px);
            user-select: none; transition: background 0.3s;
        }
        .day-item.is-today { border-color: var(--p); background: rgba(255,140,0,0.05); }
        .day-item.locked { opacity: 0.6; }
        
        .date-circ .n { font-family: 'Outfit'; font-size: 28px; font-weight: 800; color: var(--p); display: block; line-height: 1; }
        .date-circ .d { font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase; }

        .item-pill { 
            height: 58px; border-radius: 22px; border: 1px solid var(--surface); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(150, 150, 150, 0.05); cursor: pointer; transition: 0.3s; color: var(--text);
        }
        .item-pill.active { background: var(--p); border-color: var(--p); color: white; box-shadow: 0 10px 20px -5px var(--p-glow); }
        .item-pill.disabled { cursor: not-allowed; opacity: 0.4; background: rgba(0,0,0,0.08); border-color: transparent;}
        .item-pill span { font-size: 10px; font-weight: 800; text-transform: uppercase; margin-top: 3px; }

        .note-tag { grid-column: span 4; background: var(--surface); padding: 10px 15px; border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--text); display: flex; gap: 8px; align-items: center;}

        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 2000; display: none; align-items: flex-end; }
        .sheet { background: var(--bg); width: 100%; border-radius: 45px 45px 0 0; padding: 40px; border-top: 1px solid var(--surface); transform: translateY(100%); transition: 0.5s cubic-bezier(0.32, 0.72, 0, 1); max-height: 90vh; overflow-y: auto; }
        .sheet.up { transform: translateY(0); }
        .form-group label { display: block; font-size: 11px; font-weight: 800; color: var(--p); margin-bottom: 10px; text-transform: uppercase; }
        .form-group input, textarea { width: 100%; padding: 18px; background: var(--card); border: 1px solid var(--surface); border-radius: 20px; color: var(--text); font-size: 16px; margin-bottom: 20px; font-family: inherit; }
        .btn-prime { background: var(--p); color: white; padding: 22px; border-radius: 25px; border: none; font-weight: 800; width: 100%; cursor: pointer; font-size: 15px;}
        
        #welcomeScreen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* Hidden PDF Container Styles */
        #pdf-render-zone { display: none; }
    </style>
</head>
<body>

<div id="welcomeScreen">
    <h1 style="font-family:'Outfit'; font-size:50px; font-weight:900;">VetTrack<span style="color:var(--p)">.</span></h1>
    <button class="btn-prime" onclick="login()" style="width: 220px; border-radius: 50px;">Enter Luxe</button>
</div>

<div class="sheet-overlay" id="settingsOverlay" onclick="closeSettings()">
    <div class="sheet" id="settingsSheet" onclick="event.stopPropagation()">
        <h2 style="font-family:'Outfit'; margin-top:0;">Profile Settings</h2>
        
        <div class="theme-toggle-container">
            <span class="theme-toggle-label">Interface Theme</span>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeIcon">🌙</button>
        </div>

        <div class="form-group"><label>Display Name</label><input type="text" id="setUserName"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group"><label>Meal (₹)</label><input type="number" id="setMealPrice"></div>
            <div class="form-group"><label>Water (₹)</label><input type="number" id="setWaterPrice"></div>
        </div>
        <button class="btn-prime" onclick="saveSettings()">Save Luxe Profile</button>
        <button onclick="logout()" style="background:none; border:none; color:#ff4757; width:100%; margin-top:20px; font-weight:800; font-size:12px; text-transform: uppercase;">Sign Out</button>
    </div>
</div>

<div class="sheet-overlay" id="noteOverlay" onclick="closeNote()">
    <div class="sheet" id="noteSheet" onclick="event.stopPropagation()">
        <h2 id="noteTitle" style="font-family:'Outfit'; margin-top:0;">Log Details</h2>
        <textarea id="noteInput" rows="4" placeholder="Guests or special notes..."></textarea>
        <button id="noteBtn" class="btn-prime" onclick="saveNote()">Save Note</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <div><p id="greetLabel">Welcome</p><h1 id="userLabel">Diner</h1></div>
        <div class="header-actions">
            <div class="pfp-wrap"><img id="userPfp" class="pfp" onclick="openSettings()"></div>
        </div>
    </div>

    <div class="stat-card">
        <div class="stat-left">
            <div class="label">Total Bill</div>
            <div class="total-val" id="totalValue">₹0</div>
            <div id="statsSub" style="font-size:12px; font-weight:700; opacity:0.9; margin-top: 8px;">0 Units</div>
        </div>
        <div id="quickBtn" class="quick-log-btn" onclick="quickLog()">
            <i id="quickIcon">⚡</i>
            <span id="quickText">Loading...</span>
        </div>
    </div>

    <div class="nav-pill">
        <button id="prevMonthBtn" onclick="changeMonth(-1)">‹</button>
        <span id="monthLabel">Current</span>
        <button id="nextMonthBtn" onclick="changeMonth(1)">›</button>
    </div>
    
    <div class="tools-row">
        <button class="btn-pdf" onclick="generateBillPDF()">📄 Generate Month Bill (PDF)</button>
    </div>

    <div id="lockBadge" class="view-only-badge">Past Days Locked. Rolling 4-Day Edit Window Active.</div>

    <div id="logsGrid"></div>
</div>

<div id="pdf-render-zone"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", 
        messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" 
    };

    const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app), provider = new GoogleAuthProvider();
    let user = null, logs = {}, viewDate = new Date(), todayDate = new Date(), activeDayId = null;
    let config = { name: "", mealPrice: 50, waterPrice: 30 };
    
    let longPressTimer;
    let startY = 0;
    let isScrolling = false;

    if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');
    updateThemeIcon();

    window.login = () => setPersistence(auth, browserLocalPersistence).then(() => signInWithPopup(auth, provider));
    window.logout = () => signOut(auth).then(() => location.reload());

    window.toggleTheme = () => {
        document.body.classList.toggle('light-theme');
        localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        updateThemeIcon();
    }
    function updateThemeIcon() {
        document.getElementById('themeIcon').innerText = document.body.classList.contains('light-theme') ? '🌙' : '☀️';
    }

    onAuthStateChanged(auth, async (u) => {
        if (u) { 
            user = u; document.getElementById('welcomeScreen').style.display = 'none'; 
            document.getElementById('userPfp').src = u.photoURL;
            const userDoc = await getDoc(doc(db, "users", u.uid));
            if (userDoc.exists()) config = { ...config, ...userDoc.data() };
            else { config.name = u.displayName; await setDoc(doc(db, "users", u.uid), config); }
            document.getElementById('userLabel').innerText = config.name;
            updateGreet(); syncData(); 
        } else { document.getElementById('welcomeScreen').style.display = 'flex'; }
    });

    function updateGreet() {
        const h = new Date().getHours();
        const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const dayName = days[new Date().getDay()];
        let greeting = h < 12 ? "Good Morning 🌅" : h < 17 ? "Good Afternoon ☀️" : h < 21 ? "Good Evening 🌇" : "Good Night 🌙";
        document.getElementById('greetLabel').innerText = `${greeting} • ${dayName}`;
    }

    // Comprehensive advanced dynamic editing window computation
    function isEditable(year, month, day) {
        const realToday = new Date();
        realToday.setHours(0,0,0,0);
        
        const targetDate = new Date(year, month, day);
        targetDate.setHours(0,0,0,0);
        
        const currentRealDay = realToday.getDate();
        
        // Block logging entirely if target date resides in future months
        if (targetDate > realToday) {
            return false;
        }

        // Special Scenario: If real today is Day 1 of the new month
        if (currentRealDay === 1) {
            // Permit editing within current month's day 1
            if (targetDate.getTime() === realToday.getTime()) return true;
            
            // Check for previous month's final 2 days
            const prevMonthLastDay = new Date(realToday.getFullYear(), realToday.getMonth(), 0);
            const prevMonthSecondLastDay = new Date(realToday.getFullYear(), realToday.getMonth(), -1);
            prevMonthLastDay.setHours(0,0,0,0);
            prevMonthSecondLastDay.setHours(0,0,0,0);
            
            if (targetDate.getTime() === prevMonthLastDay.getTime() || targetDate.getTime() === prevMonthSecondLastDay.getTime()) {
                return true;
            }
            return false;
        }
        
        // Scenario: Real day is Day 2 or beyond of the current month
        if (currentRealDay >= 2) {
            // Explicitly verify if targeted operation is looking at any past month record
            if (year < realToday.getFullYear() || (year === realToday.getFullYear() && month < realToday.getMonth())) {
                return false; // Complete Lockdown: Convert to download-only view immediately
            }
            
            // For the current month: apply rolling 4 days back including today calculation window
            const differenceInTime = realToday.getTime() - targetDate.getTime();
            const differenceInDays = Math.floor(differenceInTime / (1000 * 30 * 60 * 60 * 24));
            return (differenceInDays >= 0 && differenceInDays < 4);
        }

        return false;
    }

    function canQuickLog() {
        return isEditable(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate()) && 
               viewDate.getMonth() === todayDate.getMonth() && 
               viewDate.getFullYear() === todayDate.getFullYear();
    }

    function syncData() {
        onSnapshot(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), (d) => {
            logs = d.data() || {}; renderGrid();
        });
    }

    window.quickLog = async () => {
        if (!canQuickLog()) return;
        const day = todayDate.getDate(), type = todayDate.getHours() < 16 ? 'l' : 'd';
        const obj = logs[day] || { l: 0, d: 0, w: 0, n: "" };
        if(obj[type] === 1) return;
        obj[type] = 1;
        await setDoc(doc(db, "users", user.uid, "logs", `${todayDate.getFullYear()}_${todayDate.getMonth()}`), { [day]: obj }, { merge: true });
    };

    function renderGrid() {
        const currentYear = todayDate.getFullYear();
        const currentMonth = todayDate.getMonth();
        const viewYear = viewDate.getFullYear();
        const viewMonth = viewDate.getMonth();

        // Control Visibility of Next Month Arrow (Remove if viewing current/future real-time month)
        const nextBtn = document.getElementById('nextMonthBtn');
        if (viewYear > currentYear || (viewYear === currentYear && viewMonth >= currentMonth)) {
            nextBtn.classList.add('nav-hidden');
        } else {
            nextBtn.classList.remove('nav-hidden');
        }

        document.getElementById('monthLabel').innerText = viewDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        
        let containsLockedDates = false;
        const grid = document.getElementById('logsGrid'); grid.innerHTML = '';
        const daysCount = new Date(viewYear, viewMonth + 1, 0).getDate();

        const type = todayDate.getHours() < 16 ? 'l' : 'd';
        const isMarked = logs[todayDate.getDate()] && logs[todayDate.getDate()][type] === 1;
        
        if (canQuickLog()) {
            document.getElementById('quickIcon').innerText = isMarked ? '✅' : '⚡';
            document.getElementById('quickText').innerText = isMarked ? 'Marked' : `Mark ${type==='l'?'Lunch':'Dinner'}`;
            document.getElementById('quickBtn').className = `quick-log-btn ${isMarked ? 'done' : ''}`;
        } else {
            document.getElementById('quickIcon').innerText = '🔒';
            document.getElementById('quickText').innerText = 'Locked';
            document.getElementById('quickBtn').className = `quick-log-btn disabled`;
        }

        for (let i = 1; i <= daysCount; i++) {
            const d = logs[i] || { l: 0, d: 0, w: 0, n: "" };
            const editable = isEditable(viewYear, viewMonth, i);
            if (!editable) containsLockedDates = true;

            const card = document.createElement('div');
            const isToday = (i === todayDate.getDate() && viewMonth === currentMonth && viewYear === currentYear);
            card.className = `day-item ${isToday ? 'is-today' : ''} ${!editable ? 'locked' : ''}`;
            
            if (editable) {
                card.addEventListener('touchstart', (e) => {
                    startY = e.touches[0].clientY;
                    isScrolling = false;
                    longPressTimer = setTimeout(() => {
                        if (!isScrolling) openNote(i);
                    }, 650);
                }, { passive: true });

                card.addEventListener('touchmove', (e) => {
                    let moveY = e.touches[0].clientY;
                    if (Math.abs(moveY - startY) > 10) { isScrolling = true; clearTimeout(longPressTimer); }
                }, { passive: true });

                card.addEventListener('touchend', () => clearTimeout(longPressTimer));
            }

            card.innerHTML = `
                <div class="date-circ"><span class="n">${i}</span><span class="d">${new Date(viewYear, viewMonth, i).toLocaleDateString('en-IN',{weekday:'short'})}</span></div>
                <div class="item-pill ${d.l?'active':''} ${!editable?'disabled':''}" ${editable?`onclick="toggle(${i},'l')"`:''}><span>Lunch</span></div>
                <div class="item-pill ${d.d?'active':''} ${!editable?'disabled':''}" ${editable?`onclick="toggle(${i},'d')"`:''}><span>Dinner</span></div>
                <div class="item-pill ${d.w?'active':''} ${!editable?'disabled':''}" ${editable?`onclick="toggle(${i},'w')"`:''}><span>Water</span></div>
                ${d.n ? `<div class="note-tag">📝 ${d.n}</div>` : ''}
            `;
            grid.appendChild(card);
        }
        
        document.getElementById('lockBadge').style.display = containsLockedDates ? 'block' : 'none';
        calculate();
    }

    window.toggle = async (day, type) => {
        if (!isEditable(viewDate.getFullYear(), viewDate.getMonth(), day)) return;
        const obj = logs[day] || { l: 0, d: 0, w: 0, n: "" };
        obj[type] = obj[type] ? 0 : 1;
        await setDoc(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), { [day]: obj }, { merge: true });
    };

    window.openNote = (day) => {
        activeDayId = day;
        document.getElementById('noteTitle').innerText = `Day ${day} Notes`;
        document.getElementById('noteInput').value = logs[day]?.n || "";
        document.getElementById('noteOverlay').style.display = 'flex';
        setTimeout(() => document.getElementById('noteSheet').classList.add('up'), 10);
    };
    window.closeNote = () => { document.getElementById('noteSheet').classList.remove('up'); setTimeout(() => document.getElementById('noteOverlay').style.display = 'none', 400); };
    window.saveNote = async () => {
        const obj = logs[activeDayId] || { l: 0, d: 0, w: 0, n: "" };
        obj.n = document.getElementById('noteInput').value;
        await setDoc(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), { [activeDayId]: obj }, { merge: true });
        closeNote();
    };

    window.openSettings = () => {
        document.getElementById('setUserName').value = config.name;
        document.getElementById('setMealPrice').value = config.mealPrice;
        document.getElementById('setWaterPrice').value = config.waterPrice;
        document.getElementById('settingsOverlay').style.display = 'flex';
        setTimeout(() => document.getElementById('settingsSheet').classList.add('up'), 10);
    };
    window.closeSettings = () => { document.getElementById('settingsSheet').classList.remove('up'); setTimeout(() => document.getElementById('settingsOverlay').style.display = 'none', 400); };
    window.saveSettings = async () => {
        config.name = document.getElementById('setUserName').value;
        config.mealPrice = parseInt(document.getElementById('setMealPrice').value);
        config.waterPrice = parseInt(document.getElementById('setWaterPrice').value);
        await setDoc(doc(db, "users", user.uid), config, { merge: true });
        document.getElementById('userLabel').innerText = config.name;
        calculate(); closeSettings();
    };

    function calculate() {
        let m=0, w=0; Object.values(logs).forEach(v => { if(v.l) m++; if(v.d) m++; if(v.w) w++; });
        document.getElementById('totalValue').innerText = `₹${(m * config.mealPrice + w * config.waterPrice).toLocaleString('en-IN')}`;
        document.getElementById('statsSub').innerText = `${m} Meals • ${w} Water Units`;
    }

    window.changeMonth = (dir) => { 
        viewDate.setMonth(viewDate.getMonth() + dir); 
        syncData(); 
    };

    // --- PDF GENERATION WITH LIVE STAMP LOGIC ---
    window.generateBillPDF = () => {
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();
        const monthName = viewDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDayIndex = new Date(year, month, 1).getDay();

        // Capture live system generation timestamp
        const now = new Date();
        const stampedDate = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        const stampedTime = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });

        let mCount = 0, wCount = 0;
        let htmlContent = `
            <div style="font-family:'Plus Jakarta Sans', sans-serif; background:#fff; color:#000; padding:35px; width:800px; box-sizing:border-box; position:relative;">
                <div style="text-align:center; border-bottom:2px solid #000; padding-bottom:15px; margin-bottom:20px;">
                    <h1 style="margin:0; font-family:'Outfit'; font-size:32px; letter-spacing:-1px;">VetTrack Luxe</h1>
                    <h2 style="margin:5px 0 0 0; font-size:18px; color:#444; text-transform:uppercase; letter-spacing:1px;">Official Meal Receipt • ${monthName}</h2>
                    <p style="margin:8px 0 0 0; font-size:15px;"><strong>Diner Profile:</strong> ${config.name}</p>
                    <p style="margin:4px 0 0 0; font-size:11px; color:#555; font-style:italic;">Generated on: ${stampedDate} at ${stampedTime}</p>
                </div>
                
                <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; margin-bottom:25px;">
                    <div style="font-weight:800; font-size:11px; text-transform:uppercase; text-align:center; background:#f1f5f9; padding:8px; border:1px solid #cbd5e1;">Sun</div>
                    <div style="font-weight:800; font-size:11px; text-transform:uppercase; text-align:center; background:#f1f5f9; padding:8px; border:1px solid #cbd5e1;">Mon</div>
                    <div style="font-weight:800; font-size:11px; text-transform:uppercase; text-align:center; background:#f1f5f9; padding:8px; border:1px solid #cbd5e1;">Tue</div>
                    <div style="font-weight:800; font-size:11px; text-transform:uppercase; text-align:center; background:#f1f5f9; padding:8px; border:1px solid #cbd5e1;">Wed</div>
                    <div style="font-weight:800; font-size:11px; text-transform:uppercase; text-align:center; background:#f1f5f9; padding:8px; border:1px solid #cbd5e1;">Thu</div>
                    <div style="font-weight:800; font-size:11px; text-transform:uppercase; text-align:center; background:#f1f5f9; padding:8px; border:1px solid #cbd5e1;">Fri</div>
                    <div style="font-weight:800; font-size:11px; text-transform:uppercase; text-align:center; background:#f1f5f9; padding:8px; border:1px solid #cbd5e1;">Sat</div>
        `;

        for(let j = 0; j < firstDayIndex; j++) {
            htmlContent += `<div style="border:1px solid #e2e8f0; background:#f8fafc; height:75px;"></div>`;
        }

        let notesHTML = "";
        for (let i = 1; i <= daysInMonth; i++) {
            const d = logs[i] || { l: 0, d: 0, w: 0, n: "" };
            let unitTags = "";
            if(d.l) { unitTags += `<span style="background:#FF8C00; color:#fff; padding:1px 4px; border-radius:4px; font-size:8px; font-weight:800; margin-bottom:2px; display:inline-block;">LUNCH</span> `; mCount++; }
            if(d.d) { unitTags += `<span style="background:#FF5F1F; color:#fff; padding:1px 4px; border-radius:4px; font-size:8px; font-weight:800; margin-bottom:2px; display:inline-block;">DINNER</span> `; mCount++; }
            if(d.w) { unitTags += `<span style="background:#3b82f6; color:#fff; padding:1px 4px; border-radius:4px; font-size:8px; font-weight:800; margin-bottom:2px; display:inline-block;">WATER</span>`; wCount++; }
            
            if(d.n) notesHTML += `<div style="margin-bottom:6px; font-size:12px; border-bottom:1px solid #f1f5f9; padding-bottom:4px;"><strong>Day ${i}:</strong> ${d.n}</div>`;

            htmlContent += `
                <div style="border:1px solid #cbd5e1; padding:6px; height:75px; display:flex; flex-direction:column; justify-content:space-between;">
                    <span style="font-weight:800; font-size:12px; color:#0f172a;">${i}</span>
                    <div style="line-height:1.1;">${unitTags}</div>
                </div>
            `;
        }
        
        htmlContent += `</div>`;

        const totalCalculatedCost = (mCount * config.mealPrice) + (wCount * config.waterPrice);

        htmlContent += `
            <div style="margin-top:15px; background:#f8fafc; border:1px solid #e2e8f0; padding:20px; border-radius:15px; display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:13px; line-height:1.6;">
                    <strong>Total Meals Registered:</strong> ${mCount} (at ₹${config.mealPrice}/unit)<br>
                    <strong>Total Water Registered:</strong> ${wCount} (at ₹${config.waterPrice}/unit)
                </div>
                <div style="text-align:right;">
                    <span style="font-size:11px; font-weight:800; text-transform:uppercase; color:#64748b; display:block;">Total Payable Balance</span>
                    <span style="font-family:'Outfit'; font-size:32px; font-weight:900; color:#0f172a;">₹${totalCalculatedCost.toLocaleString('en-IN')}</span>
                </div>
            </div>
        `;

        if(notesHTML) {
            htmlContent += `
                <div style="margin-top:25px; border-top:1px solid #000; padding-top:15px;">
                    <h4 style="margin:0 0 10px 0; font-size:14px; text-transform:uppercase; letter-spacing:0.5px;">Log Notes Archive</h4>
                    <div style="background:#fafafa; padding:15px; border-radius:12px; border:1px dashed #cbd5e1;">${notesHTML}</div>
                </div>
            `;
        }

        htmlContent += `</div>`;

        const renderZone = document.getElementById('pdf-render-zone');
        renderZone.innerHTML = htmlContent;

        const opt = {
            margin:       0.25,
            filename:     `VetTrack_Bill_${monthName.replace(" ", "_")}.pdf`,
            image:        { type: 'jpeg', quality: 1.0 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(renderZone.firstElementChild).save().then(() => {
            renderZone.innerHTML = '';
        });
    }
</script>
</body>
</html>

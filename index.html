<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TravelLuxe | Trip Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Outfit:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #FF8C00; --bg: #0B0F1A; --card: rgba(30, 41, 59, 0.7); --text: #FFFFFF; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 25px; }
        
        .glass-card { 
            background: var(--card); backdrop-filter: blur(15px); border-radius: 30px; 
            padding: 30px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;
        }
        
        .pulse-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin: 15px 0; }
        #fill { height: 100%; width: 0%; background: var(--p); transition: 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .input-group { display: flex; gap: 10px; margin-top: 20px; }
        input { flex: 1; padding: 15px; border-radius: 15px; border: none; background: rgba(0,0,0,0.3); color: white; }
        .btn { padding: 15px 25px; border-radius: 15px; border: none; background: var(--p); color: white; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

    <header style="margin-bottom: 30px;">
        <h1 style="font-family:'Outfit'; margin:0; font-size:28px;">Trip<span>Pulse.</span></h1>
        <p style="color:#94A3B8; font-size:14px; margin-top:5px;">May 7 – May 13 Expedition</p>
    </header>

    <div class="glass-card">
        <div style="font-size:12px; font-weight:800; color:var(--p); letter-spacing:1px;">TOTAL EXPENSES</div>
        <div id="total" style="font-size:42px; font-weight:800; margin:10px 0;">₹0</div>
        <div class="pulse-bar"><div id="fill"></div></div>
        <div style="font-size:11px; color:#94A3B8;">Budget Utilization: <span id="percent">0%</span></div>
    </div>

    <div class="input-group">
        <input type="number" id="amount" placeholder="Enter Amount (₹)">
        <button class="btn" onclick="addExpense()">ADD</button>
    </div>

    <div id="log" style="margin-top:30px; font-size:12px; color:#94A3B8;"></div>

<script>
    let total = 0;
    const BUDGET = 5000; // Set your trip budget

    function addExpense() {
        const amt = parseFloat(document.getElementById('amount').value);
        if (!amt) return;

        total += amt;
        const percent = Math.min((total / BUDGET) * 100, 100);
        
        document.getElementById('total').innerText = `₹${total}`;
        document.getElementById('fill').style.width = `${percent}%`;
        document.getElementById('percent').innerText = `${Math.round(percent)}%`;
        
        // Luxe Haptic Feedback
        if (window.navigator.vibrate) window.navigator.vibrate(50);
        
        const log = document.getElementById('log');
        log.innerHTML = `<div>• Added ₹${amt} at ${new Date().toLocaleTimeString()}</div>` + log.innerHTML;
        document.getElementById('amount').value = '';
    }
</script>
</body>
</html>

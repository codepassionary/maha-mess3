<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Birds-Eye Telemetry Core</title>
    <!-- CesiumJS Infrastructure Streams -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #020408;
            --surface: #090d16;
            --border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #475569;
            --brand-prime: #6366f1;
            --state-active: #10b981;
            --font-mono: "SF Mono", Monaco, Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: grid;
            grid-template-columns: 360px 1fr;
            overflow: hidden;
        }

        /* Side Control Panel */
        .control-panel {
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            box-shadow: 10px 0 30px rgba(0,0,0,0.6);
        }

        .brand-header h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; }
        .brand-header p { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px; }

        .btn-action {
            width: 100%;
            background: var(--brand-prime);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }
        .btn-action:hover { background: #4f46e5; }

        .telemetry-data {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }
        .telemetry-data label { display: block; font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
        .telemetry-data div { font-size: 15px; font-weight: 700; font-family: var(--font-mono); }

        .terminal-log {
            flex-grow: 1;
            background: #010204;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: #4b5563;
            overflow-y: auto;
            line-height: 1.5;
        }

        /* Full Screen 3D Earth Viewport */
        #cesiumContainer {
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* Clean UI bypass for Cesium credits */
        .cesium-viewer-bottom { display: none !important; }
    </style>
</head>
<body>

    <!-- Control Interface Layout -->
    <div class="control-panel">
        <div class="brand-header">
            <h1>3D Birds-Eye Core</h1>
            <p>Dimensional Vector Tracker</p>
        </div>

        <button class="btn-action" onclick="simulateCampusFlightPath()">Simulate Birds-Eye View Flight</button>

        <div class="telemetry-data">
            <label>Current Flight Anchor</label>
            <div id="geoPulse">Awaiting Initialization...</div>
        </div>

        <div id="consoleLog" class="terminal-log">
            <div>[SYSTEM] 3D Globular Canvas initialized. Ready for coordinate stream vector injection...</div>
        </div>
    </div>

    <!-- WebGL Viewport Map Workframe -->
    <div id="cesiumContainer"></div>

    <script>
        'use strict';

        let viewer;
        let flightPathEntity;
        // Mock historical data array representing a physical movement run through a campus space
        const RUNTIME_COORDS = [
            { lat: 24.5360, lng: 81.3030, alt: 5.0 },
            { lat: 24.5365, lng: 81.3035, alt: 8.0 },
            { lat: 24.5370, lng: 81.3038, alt: 12.0 },
            { lat: 24.5375, lng: 81.3042, alt: 15.0 },
            { lat: 24.5380, lng: 81.3048, alt: 18.0 },
            { lat: 24.5385, lng: 81.3055, alt: 22.0 }
        ];

        // Self-Executing WebGL Globe Setup Routine
        (function bootCesiumViewport() {
            // Instantiate the 3D globe with standard navigation widgets hidden for a minimal look
            viewer = new Cesium.Viewer('cesiumContainer', {
                terrainProvider: Cesium.createWorldTerrain(),
                animation: false,
                timeline: false,
                sceneModePicker: false,
                baseLayerPicker: false,
                navigationHelpButton: false,
                geocoder: false,
                homeButton: false,
                fullscreenButton: false
            });

            // Set scene rendering to use dark atmospheric and space configurations
            viewer.scene.skyAtmosphere.show = true;
            viewer.scene.globe.enableLighting = true;
        })();

        function printLog(msg) {
            const container = document.getElementById('consoleLog');
            const element = document.createElement('div');
            element.textContent = `[${new Date().toISOString().slice(11, 19)}] > ${msg}`;
            container.appendChild(element);
            container.scrollTop = container.scrollHeight;
        }

        function simulateCampusFlightPath() {
            printLog("Parsing raw 2D geolocation stream into Cartesian spatial profiles...");
            
            // Map our array of degrees to Cesium's internal Cartesian3 linear distance coordinates
            const cartesianPositions = [];
            RUNTIME_COORDS.forEach(node => {
                cartesianPositions.push(Cesium.Cartesian3.fromDegrees(node.lng, node.lat, node.alt));
            });

            // If an older route trail exists, clean it out of the geometry pool
            if (flightPathEntity) {
                viewer.entities.remove(flightPathEntity);
            }

            // Create a 3D vector polyline path suspended above the globe terrain
            flightPathEntity = viewer.entities.add({
                polyline: {
                    positions: cartesianPositions,
                    width: 6,
                    material: new Cesium.PolylineGlowMaterialProperty({
                        glowPower: 0.25,
                        taperPower: 1.0,
                        color: Cesium.Color.fromCssString('#6366f1')
                    }),
                    clampToGround: false // Elevated trail to track altitude differences
                }
            });

            printLog("3D Path rendered. Triggering Google Earth style kinematic fly-to sequence...");
            executeBirdsEyeCameraFly(RUNTIME_COORDS[0]);
        }

        function executeBirdsEyeCameraFly(startNode) {
            // Calculate a bird's-eye camera view matrix looking down at a tilt
            const targetDestination = Cesium.Cartesian3.fromDegrees(
                startNode.lng, 
                startNode.lat - 0.003, // Offset camera latitude slightly backward to get an angled view
                startNode.alt + 250.0   // Elevate camera to 250m above position for the birds-eye look
            );

            document.getElementById('geoPulse').textContent = `${startNode.lat.toFixed(4)}°, ${startNode.lng.toFixed(4)}°`;

            viewer.camera.flyTo({
                destination: targetDestination,
                orientation: {
                    heading: Cesium.Math.toRadians(0.0),   // Point direct North
                    pitch: Cesium.Math.toRadians(-35.0),  // Tilt downward at a 35-degree angle
                    roll: 0.0
                },
                duration: 3.5, // 3.5-second fly-to camera interpolation duration
                complete: () => {
                    printLog("Camera locked into active tracking vector.");
                    animateCameraAlongPath();
                }
            });
        }

        function animateCameraAlongPath() {
            let step = 0;
            // Iterate down the path array to simulate moving along the route
            const pathInterval = setInterval(() => {
                if (step >= RUNTIME_COORDS.length) {
                    clearInterval(pathInterval);
                    printLog("Flight animation finalized. Target route archived.");
                    return;
                }

                const currentNode = RUNTIME_COORDS[step];
                document.getElementById('geoPulse').textContent = `${currentNode.lat.toFixed(4)}°, ${currentNode.lng.toFixed(4)}°`;
                
                // Adjust camera position in real time as the path progresses
                viewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(currentNode.lng, currentNode.lat - 0.002, currentNode.alt + 180.0),
                    orientation: {
                        heading: Cesium.Math.toRadians(0.0),
                        pitch: Cesium.Math.toRadians(-30.0),
                        roll: 0.0
                    }
                });

                step++;
            }, 1000); // Progress to the next waypoint every second
        }
    </script>
</body>
</html>

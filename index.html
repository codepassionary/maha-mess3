<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biometric Geo Attendance System</title>

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:420px;
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:16px;
text-align:center;
backdrop-filter:blur(10px);
}

video{
width:100%;
border-radius:12px;
margin-top:10px;
}

button{
width:100%;
margin-top:10px;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.register{background:#3b82f6;color:white;}
.attend{background:#22c55e;color:white;}

.status{
margin-top:15px;
padding:10px;
background:#1e293b;
border-radius:10px;
}

.success{color:#22c55e;}
.error{color:#ef4444;}
</style>
</head>

<body>

<div class="card">
<h2>Geo Attendance</h2>

<video id="video" autoplay muted></video>

<button class="register" onclick="registerFace()">Register Face</button>
<button class="attend" onclick="markAttendance()">Mark Attendance</button>

<div id="status" class="status">Initializing...</div>
</div>

<script>

const video = document.getElementById("video");
const statusBox = document.getElementById("status");

const OFFICE_LAT = 25.3176;
const OFFICE_LNG = 82.9739;
const GEOFENCE_RADIUS = 50;

function status(msg, error=false){
statusBox.innerText = msg;
statusBox.className = "status " + (error ? "error":"success");
}

async function startCamera(){
const stream = await navigator.mediaDevices.getUserMedia({video:true});
video.srcObject = stream;
}

async function loadModels(){
status("Loading models...");
await faceapi.nets.tinyFaceDetector.loadFromUri('./models');
await faceapi.nets.faceLandmark68Net.loadFromUri('./models');
await faceapi.nets.faceRecognitionNet.loadFromUri('./models');
status("Models loaded");
}

function getDistance(lat1, lon1, lat2, lon2){
const R = 6371000;
const dLat = (lat2-lat1)*Math.PI/180;
const dLon = (lon2-lon1)*Math.PI/180;

const a =
Math.sin(dLat/2)*Math.sin(dLat/2) +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLon/2)*Math.sin(dLon/2);

const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
return R*c;
}

async function registerFace(){

status("Registering face...");

const detection = await faceapi
.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
.withFaceLandmarks()
.withFaceDescriptor();

if(!detection){
status("No face detected", true);
return;
}

localStorage.setItem(
"face",
JSON.stringify(Array.from(detection.descriptor))
);

status("Face registered successfully");
}

async function verifyFace(){

const saved = localStorage.getItem("face");
if(!saved){
status("No registered face found", true);
return false;
}

const savedDesc = new Float32Array(JSON.parse(saved));

const detection = await faceapi
.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
.withFaceLandmarks()
.withFaceDescriptor();

if(!detection){
status("No face detected", true);
return false;
}

const distance = faceapi.euclideanDistance(
savedDesc,
detection.descriptor
);

return distance < 0.55;
}

function getLocation(){
return new Promise((resolve, reject)=>{
navigator.geolocation.getCurrentPosition(resolve, reject, {
enableHighAccuracy:true,
timeout:10000
});
});
}

async function markAttendance(){

status("Verifying face...");

const faceOk = await verifyFace();
if(!faceOk){
status("Face verification failed", true);
return;
}

status("Checking location...");

try{
const pos = await getLocation();

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

const dist = getDistance(lat,lng,OFFICE_LAT,OFFICE_LNG);

if(dist > GEOFENCE_RADIUS){
status("Outside geofence ("+Math.round(dist)+"m)", true);
return;
}

const record = {
time:new Date().toLocaleString(),
lat,
lng
};

localStorage.setItem("attendance", JSON.stringify(record));

status("Attendance marked successfully");

}catch(e){
status("Location error", true);
}
}

async function init(){
await loadModels();
await startCamera();
status("Ready");
}

init();

</script>

</body>
</html>

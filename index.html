<body>

<div class="container">

            <div id="statsSub" style="font-size:12px; font-weight:700; opacity:0.9;">0 Meals • 0 Water Units</div>
            
            <!-- Replaced EOM with Visual Expense Bar -->
            <div class="expense-bar-wrap">

            </div>

        <div id="quickBtn" class="quick-log-btn" onclick="quickLog()">

    </div>

    <div class="nav-pill">
        <button onclick="changeMonth(-1)">‹</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", 
        messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" 
    };

    const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app), provider = new GoogleAuthProvider();
    let user = null, logs = {}, viewDate = new Date(), todayDate = new Date(), activeDayId = null;
    let config = { name: "", mealPrice: 50, waterPrice: 30 };

    window.login = () => setPersistence(auth, browserLocalPersistence).then(() => signInWithPopup(auth, provider));
    window.logout = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, async (u) => {
        if (u) { 
            user = u; document.getElementById('welcomeScreen').style.display = 'none'; 
            document.getElementById('userPfp').src = u.photoURL;
            const userDoc = await getDoc(doc(db, "users", u.uid));
            if (userDoc.exists()) config = { ...config, ...userDoc.data() };
            else { config.name = u.displayName; await setDoc(doc(db, "users", u.uid), config); }
            document.getElementById('userLabel').innerText = config.name;
            updateGreet(); syncData(); 
        } else { document.getElementById('welcomeScreen').style.display = 'flex'; }
    });

    function isCurrentMonth() {
        return viewDate.getMonth() === todayDate.getMonth() && viewDate.getFullYear() === todayDate.getFullYear();
    }

    function updateGreet() {
        const h = new Date().getHours();
        document.getElementById('greetLabel').innerText = h < 12 ? "Good Morning 🌅" : h < 17 ? "Good Afternoon ☀️" : "Good Evening 🌇";
    }

    function syncData() {
        onSnapshot(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), (d) => {
            logs = d.data() || {}; renderGrid();
        });
    }

    window.quickLog = async () => {
        if (!isCurrentMonth()) return;
        if (navigator.vibrate) navigator.vibrate(50); // Haptic feedback
        
        const day = todayDate.getDate(), type = todayDate.getHours() < 16 ? 'l' : 'd';
        const obj = logs[day] || { l: 0, d: 0, w: 0, n: "" };
        if(obj[type] === 1) return;
        obj[type] = 1;
        await setDoc(doc(db, "users", user.uid, "logs", `${todayDate.getFullYear()}_${todayDate.getMonth()}`), { [day]: obj }, { merge: true });
    };

    function renderGrid() {
        const current = isCurrentMonth();
        document.getElementById('lockBadge').style.display = current ? 'none' : 'block';
        document.getElementById('quickBtn').className = `quick-log-btn ${!current ? 'disabled' : ''}`;
        document.getElementById('monthLabel').innerText = viewDate.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });
        
        const grid = document.getElementById('logsGrid'); grid.innerHTML = '';
        const daysCount = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();

        const type = todayDate.getHours() < 16 ? 'l' : 'd';
        const isMarked = logs[todayDate.getDate()] && logs[todayDate.getDate()][type] === 1;
        
        if (current) {
            document.getElementById('quickIcon').innerText = isMarked ? '✅' : '⚡';
            document.getElementById('quickText').innerText = isMarked ? 'Marked' : `Mark ${type==='l'?'Lunch':'Dinner'}`;
            if(isMarked) document.getElementById('quickBtn').classList.add('done');
            else document.getElementById('quickBtn').classList.remove('done');
        } else {
            document.getElementById('quickIcon').innerText = '🔒';
            document.getElementById('quickText').innerText = 'Archived';
        }

        // Generate Card Elements
        for (let i = 1; i <= daysCount; i++) {
            const d = logs[i] || { l: 0, d: 0, w: 0, n: "" };
            const card = document.createElement('div');
            card.className = `day-item ${current && i === todayDate.getDate() ? 'is-today' : ''}`;
            
            // Explicit SVG Note button replaces complex touch/long-press logic
            const noteBtnHTML = current ? `
                <div class="add-note-btn" onclick="openNote(${i})" title="Add Note">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                </div>
            ` : '';

            card.innerHTML = `
                <div class="date-circ">
                    <span class="n">${i}</span>
                    <span class="d">${new Date(viewDate.getFullYear(), viewDate.getMonth(), i).toLocaleDateString('en-IN',{weekday:'short'})}</span>
                    ${noteBtnHTML}
                </div>
                <div class="item-pill ${d.l?'active':''} ${!current?'disabled':''}" onclick="toggle(event, ${i}, 'l')"><span>Lunch</span></div>
                <div class="item-pill ${d.d?'active':''} ${!current?'disabled':''}" onclick="toggle(event, ${i}, 'd')"><span>Dinner</span></div>
                <div class="item-pill ${d.w?'active':''} ${!current?'disabled':''}" onclick="toggle(event, ${i}, 'w')"><span>Water</span></div>
                ${d.n ? `<div class="note-tag">📝 ${d.n}</div>` : ''}
            `;
            grid.appendChild(card);
        }
        calculate();
    }

    window.toggle = async (event, day, type) => {
        if (!isCurrentMonth()) return;
        if (navigator.vibrate) navigator.vibrate(20); 

        const obj = logs[day] || { l: 0, d: 0, w: 0, n: "" };
        obj[type] = obj[type] ? 0 : 1;
        await setDoc(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), { [day]: obj }, { merge: true });
    };

    window.openNote = (day) => {
        if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
        activeDayId = day;
        document.getElementById('noteTitle').innerText = `Day ${day} Notes`;
        document.getElementById('noteInput').value = logs[day]?.n || "";
        
        const overlay = document.getElementById('noteOverlay');
        const sheet = document.getElementById('noteSheet');
        overlay.style.display = 'flex';
        // Tiny delay to allow display:flex to apply before adding transition classes
        setTimeout(() => { overlay.classList.add('show'); sheet.classList.add('up'); }, 10); 
    };
    
    window.closeNote = () => { 
        document.getElementById('noteSheet').classList.remove('up'); 
        document.getElementById('noteOverlay').classList.remove('show');
        setTimeout(() => document.getElementById('noteOverlay').style.display = 'none', 400); 
    };
    
    window.saveNote = async () => {
        const obj = logs[activeDayId] || { l: 0, d: 0, w: 0, n: "" };
        obj.n = document.getElementById('noteInput').value.trim();
        await setDoc(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), { [activeDayId]: obj }, { merge: true });
        closeNote();
    };

    window.openSettings = () => {
        document.getElementById('setUserName').value = config.name;
        document.getElementById('setMealPrice').value = config.mealPrice;
        document.getElementById('setWaterPrice').value = config.waterPrice;
        
        const overlay = document.getElementById('settingsOverlay');
        const sheet = document.getElementById('settingsSheet');
        overlay.style.display = 'flex';
        setTimeout(() => { overlay.classList.add('show'); sheet.classList.add('up'); }, 10);
    };
    
    window.closeSettings = () => { 
        document.getElementById('settingsSheet').classList.remove('up'); 
        document.getElementById('settingsOverlay').classList.remove('show');
        setTimeout(() => document.getElementById('settingsOverlay').style.display = 'none', 400); 
    };
    
    window.saveSettings = async () => {
        config.name = document.getElementById('setUserName').value;
        config.mealPrice = parseInt(document.getElementById('setMealPrice').value);
        config.waterPrice = parseInt(document.getElementById('setWaterPrice').value);
        await setDoc(doc(db, "users", user.uid), config, { merge: true });
        document.getElementById('userLabel').innerText = config.name;
        calculate(); closeSettings();
    };

    function calculate() {
        let m = 0, w = 0; 
        Object.values(logs).forEach(v => { 
            if(v.l) m++; 
            if(v.d) m++; 
            if(v.w) w++; 
        });

        const mealCost = m * config.mealPrice;
        const waterCost = w * config.waterPrice;
        const currentTotal = mealCost + waterCost;
        
        // Update Stats UI
        document.getElementById('totalValue').innerText = `₹${currentTotal.toLocaleString('en-IN')}`;
        document.getElementById('statsSub').innerText = `${m} Meals • ${w} Water Units`;
        
        // Update Visual Expense Bar
        if (currentTotal > 0) {
            document.getElementById('mealBar').style.width = `${(mealCost / currentTotal) * 100}%`;
            document.getElementById('waterBar').style.width = `${(waterCost / currentTotal) * 100}%`;
        } else {
            document.getElementById('mealBar').style.width = '0%';
            document.getElementById('waterBar').style.width = '0%';
        }
    }

    window.changeMonth = (dir) => { 
        viewDate.setDate(1); // Crucial fix for 31st overflow bug
        viewDate.setMonth(viewDate.getMonth() + dir); 
        syncData(); 
    };
async function exportData(type) {
    // 1. Show the loader
    const loader = document.createElement('div');
    loader.className = 'loader-wrap';
    loader.innerHTML = '<div class="pulse-ring"></div>';
    document.body.appendChild(loader);

    // 2. Perform the async work (Location + PDF generation)
    // ... existing export logic ...

    // 3. Remove loader once done
    document.body.removeChild(loader);
}
    
</script>

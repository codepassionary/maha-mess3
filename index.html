<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geofenced Attendance System</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f3f4f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.subtitle {
            color: #6b7280;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 25px;
            background-color: #e5e7eb;
            color: #374151;
            transition: all 0.3s ease;
        }

        .status-badge.inside {
            background-color: #dcfce7;
            color: var(--success);
        }

        .status-badge.outside {
            background-color: #fee2e2;
            color: var(--danger);
        }

        .info-box {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
            font-size: 14px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #6b7280;
            font-weight: 500;
        }

        .info-value {
            color: #1f2937;
            font-weight: 600;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }

        .btn:hover {
            background-color: #4338ca;
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #log {
            margin-top: 20px;
            max-height: 120px;
            overflow-y: auto;
            border-top: 1px solid #e5e7eb;
            padding-top: 15px;
            font-size: 12px;
            color: #4b5563;
            text-align: left;
        }

        .log-entry {
            margin-bottom: 4px;
            padding: 4px;
            border-radius: 4px;
            background: #f9fafb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Attendance Check-In</h1>
        <p class="subtitle">Geofenced within 100 meters</p>

        <div id="statusBadge" class="status-badge">Checking Location...</div>

        <div class="info-box">
            <div class="info-row">
                <span class="info-label">Your Distance:</span>
                <span id="distanceVal" class="info-value">Calculating...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Accuracy:</span>
                <span id="accuracyVal" class="info-value">Calculating...</span>
            </div>
        </div>

        <button id="checkInBtn" class="btn" disabled>Check In</button>
        <button id="refreshBtn" class="btn" style="background-color: #6b7280;">Refresh Location</button>

        <div id="log">
            <strong>Activity Log:</strong>
            <div id="logContents"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION: Set your office coordinates
        // ==========================================
        const OFFICE_LAT = 24.500893; 
        const OFFICE_LNG = 81.291928; 
        const GEOFENCE_RADIUS_METERS = 100; 

        // DOM Elements
        const statusBadge = document.getElementById('statusBadge');
        const distanceVal = document.getElementById('distanceVal');
        const accuracyVal = document.getElementById('accuracyVal');
        const checkInBtn = document.getElementById('checkInBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const logContents = document.getElementById('logContents');

        // Haversine Formula to calculate distance between two coordinates in meters
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth's radius in meters
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                      Math.cos(phi1) * Math.cos(phi2) * 
                      Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
            
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // Distance in meters
        }

        function addLog(message) {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<strong>[${time}]</strong> ${message}`;
            logContents.insertBefore(entry, logContents.firstChild);
        }

        function checkLocation() {
            if (!navigator.geolocation) {
                statusBadge.textContent = "Not Supported";
                statusBadge.className = "status-badge outside";
                addLog("Geolocation is not supported by your browser.");
                return;
            }

            statusBadge.textContent = "Locating...";
            statusBadge.className = "status-badge";
            
            const options = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(success, error, options);
        }

        function success(position) {
            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            // Calculate distance
            const distance = calculateDistance(userLat, userLng, OFFICE_LAT, OFFICE_LNG);

            // Update UI
            distanceVal.textContent = `${distance.toFixed(1)} meters`;
            accuracyVal.textContent = `±${accuracy.toFixed(1)} meters`;

            if (accuracy > 100) {
                addLog("Warning: Weak GPS accuracy. If indoors, try moving closer to a window.");
            }

            // Geofence Validation
            if (distance <= GEOFENCE_RADIUS_METERS) {
                statusBadge.textContent = "Inside Geofence";
                statusBadge.className = "status-badge inside";
                checkInBtn.disabled = false;
                addLog("Location verified. Access granted.");
            } else {
                statusBadge.textContent = "Outside Geofence";
                statusBadge.className = "status-badge outside";
                checkInBtn.disabled = true;
                addLog(`Access denied. You are ${Math.round(distance - GEOFENCE_RADIUS_METERS)}m outside the zone.`);
            }
        }

        function error(err) {
            console.warn(`ERROR(${err.code}): ${err.message}`);
            statusBadge.textContent = "Location Error";
            statusBadge.className = "status-badge outside";
            
            if(err.code === 1) {
                addLog("Permission denied. Please turn on device location services and allow permission.");
            } else {
                addLog("Unable to retrieve location data.");
            }
        }

        // Action Listeners
        checkInBtn.addEventListener('click', () => {
            addLog("🎉 Attendance marked successfully!");
            alert("Attendance recorded!");
        });

        refreshBtn.addEventListener('click', () => {
            checkLocation();
        });

        // Run application
        window.onload = checkLocation;
    </script>
</body>
</html>

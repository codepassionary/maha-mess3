<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe | Master Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root { --p: #FF8C00; --bg: #0B0F1A; --card: rgba(30, 41, 59, 0.7); --text: #FFFFFF; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 25px; }
        .control-card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 25px; margin-bottom: 20px; }
        .btn { background: var(--p); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; margin-top: 10px; }
        .status-tag { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 10px; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1 style="font-family:'Outfit';">Master Control</h1>

    <div class="control-card">
        <div id="mBadge" class="status-tag">Checking...</div>
        <button class="btn" onclick="toggleM()">Toggle Maintenance</button>
    </div>

    <div class="control-card">
        <label style="font-size:10px; color:var(--p); font-weight:800;">ADMIN UIDS</label>
        <input type="text" id="adminInput" placeholder="UID1, UID2...">
        <button class="btn" onclick="saveAdmins()" style="background:#334155;">Update Admins</button>
    </div>

    <div id="userList"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", projectId: "vettrack-1c65e" };
    const app = initializeApp(firebaseConfig), db = getFirestore(app);

    // Sync System Settings
    onSnapshot(doc(db, "system", "config"), (snap) => {
        const data = snap.data() || { maintenanceMode: false, adminUIDs: [] };
        const isM = data.maintenanceMode;
        const badge = document.getElementById('mBadge');
        badge.innerText = isM ? "MAINTENANCE ON" : "SYSTEM LIVE";
        badge.style.background = isM ? "#ef4444" : "#10B981";
        document.getElementById('adminInput').value = data.adminUIDs.join(", ");
    });

    window.toggleM = async () => {
        const ref = doc(db, "system", "config");
        const snap = await getDoc(ref);
        const cur = snap.data().maintenanceMode;
        await setDoc(ref, { maintenanceMode: !cur }, { merge: true });
    };

    window.saveAdmins = async () => {
        const list = document.getElementById('adminInput').value.split(",").map(s => s.trim());
        await setDoc(doc(db, "system", "config"), { adminUIDs: list }, { merge: true });
        alert("Admins Updated");
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Geofenced Attendance System</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f3f4f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.subtitle {
            color: #6b7280;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* Pulse tracking indicator */
        .pulse-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: #4b5563;
            margin-bottom: 15px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse-animation 1.5s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 25px;
            background-color: #e5e7eb;
            color: #374151;
            transition: all 0.3s ease;
        }

        .status-badge.inside {
            background-color: #dcfce7;
            color: var(--success);
        }

        .status-badge.outside {
            background-color: #fee2e2;
            color: var(--danger);
        }

        .info-box {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
            font-size: 14px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #6b7280;
            font-weight: 500;
        }

        .info-value {
            color: #1f2937;
            font-weight: 600;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }

        .btn:hover {
            background-color: #4338ca;
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #log {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #e5e7eb;
            padding-top: 15px;
            font-size: 12px;
            color: #4b5563;
            text-align: left;
        }

        .log-entry {
            margin-bottom: 4px;
            padding: 4px;
            border-radius: 4px;
            background: #f9fafb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Attendance Tracking</h1>
        <p class="subtitle">Geofenced within 65 meters</p>

        <div class="pulse-indicator">
            <div class="dot"></div>
            <span>Live GPS tracking active...</span>
        </div>

        <div id="statusBadge" class="status-badge">Initializing Pulse...</div>

        <div class="info-box">
            <div class="info-row">
                <span class="info-label">Your Distance:</span>
                <span id="distanceVal" class="info-value">Calculating...</span>
            </div>
            <div class="info-row">
                <span class="info-label">GPS Accuracy:</span>
                <span id="accuracyVal" class="info-value">Calculating...</span>
            </div>
        </div>

        <button id="checkInBtn" class="btn" disabled>Check In</button>

        <div id="log">
            <strong>Pulse Activity Log:</strong>
            <div id="logContents"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION: Set coordinates & 65m Fence
        // ==========================================
        const OFFICE_LAT = 24.500893; 
        const OFFICE_LNG = 81.291928; 
        const GEOFENCE_RADIUS_METERS = 65; 

        let watchId = null; // Holds the geo-tracker reference

        const statusBadge = document.getElementById('statusBadge');
        const distanceVal = document.getElementById('distanceVal');
        const accuracyVal = document.getElementById('accuracyVal');
        const checkInBtn = document.getElementById('checkInBtn');
        const logContents = document.getElementById('logContents');

        // Haversine Formula for distance calculation
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth radius in meters
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                      Math.cos(phi1) * Math.cos(phi2) * 
                      Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
            
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; 
        }

        function addLog(message) {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<strong>[${time}]</strong> ${message}`;
            logContents.insertBefore(entry, logContents.firstChild);
        }

        // Starts the live tracking loop
        function startContinuousTracking() {
            if (!navigator.geolocation) {
                statusBadge.textContent = "Not Supported";
                statusBadge.className = "status-badge outside";
                addLog("Error: Browser does not support location services.");
                return;
            }

            const options = {
                enableHighAccuracy: true, // Forces phone GPS chip over network estimation
                timeout: 15000,           // Wait up to 15s per pulse
                maximumAge: 0             // Strictly fetch fresh data, no caching
            };

            // watchPosition creates a permanent thread/event listener
            watchId = navigator.geolocation.watchPosition(successPulse, errorPulse, options);
            addLog("Continuous GPS stream initialized.");
        }

        // Fired automatically every time the device's location updates
        function successPulse(position) {
            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            const distance = calculateDistance(userLat, userLng, OFFICE_LAT, OFFICE_LNG);

            // Update parameters instantly on the interface
            distanceVal.textContent = `${distance.toFixed(1)} meters`;
            accuracyVal.textContent = `±${accuracy.toFixed(1)} meters`;

            // State Evaluation
            if (distance <= GEOFENCE_RADIUS_METERS) {
                statusBadge.textContent = "Inside Geofence";
                statusBadge.className = "status-badge inside";
                checkInBtn.disabled = false;
                addLog(`Pulse Check: Within zone (${Math.round(distance)}m away). Button enabled.`);
            } else {
                statusBadge.textContent = "Outside Geofence";
                statusBadge.className = "status-badge outside";
                checkInBtn.disabled = true;
                addLog(`Pulse Check: Outside fence by ${Math.round(distance - GEOFENCE_RADIUS_METERS)}m.`);
            }
        }

        function errorPulse(err) {
            console.warn(`Watch Error(${err.code}): ${err.message}`);
            statusBadge.textContent = "Syncing GPS...";
            statusBadge.className = "status-badge";
            
            if(err.code === 1) {
                statusBadge.textContent = "Permission Blocked";
                statusBadge.className = "status-badge outside";
                addLog("Error: Please grant site location permissions.");
            } else {
                addLog("Tracking pulse connection unstable... waiting for next interval.");
            }
        }

        checkInBtn.addEventListener('click', () => {
            addLog("🎉 Attendance successfully registered via live coordinates!");
            alert("Attendance marked!");
        });

        // Initialize immediately upon page opening
        window.onload = startContinuousTracking;
    </script>
</body>
</html>

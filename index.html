<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VetTrack Luxe | Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #FF8C00; --bg: #05070A; --card: rgba(17, 24, 39, 0.8); 
            --surface: rgba(31, 41, 55, 0.5); --text: #F9FAFB; --sub: #9CA3AF;
            --success: #10B981; --danger: #EF4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif; padding: env(safe-area-inset-top) 20px 100px 20px;
        }

        /* Maintenance Shield */
        #maintenanceOverlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 100000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px;
        }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .profile-btn { width: 45px; height: 45px; border-radius: 15px; border: 2px solid var(--surface); object-fit: cover; }

        /* Main Bill Card */
        .bill-card {
            background: linear-gradient(135deg, #FF8C00 0%, #FF5F1F 100%);
            padding: 25px; border-radius: 30px; margin-bottom: 25px;
            box-shadow: 0 20px 40px -10px rgba(255, 140, 0, 0.3);
        }
        .bill-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.8; }
        .bill-amt { font-family: 'Outfit'; font-size: 42px; font-weight: 900; margin: 5px 0; }
        .bill-status { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

        /* Activity Feed */
        .section-title { font-family: 'Outfit'; font-size: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .activity-feed { background: var(--card); border-radius: 24px; padding: 10px; border: 1px solid var(--surface); margin-bottom: 25px; max-height: 200px; overflow-y: auto; }
        .activity-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
        .activity-item small { color: var(--sub); display: block; margin-top: 4px; }

        /* Daily Toggle Grid */
        .log-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .log-btn {
            background: var(--card); border: 1px solid var(--surface); border-radius: 20px;
            padding: 20px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .log-btn.active { background: var(--p); border-color: var(--p); transform: scale(0.95); }
        .log-btn i { font-size: 24px; display: block; margin-bottom: 8px; }
        .log-btn b { font-size: 14px; text-transform: uppercase; }

        /* Navigation */
        .nav { position: fixed; bottom: 25px; left: 20px; right: 20px; background: rgba(17,24,39,0.9); backdrop-filter: blur(20px); border-radius: 25px; padding: 15px; display: flex; justify-content: space-around; border: 1px solid var(--surface); }
        .nav-item { color: var(--sub); font-size: 20px; cursor: pointer; }
        .nav-item.active { color: var(--p); }

        #authUI { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; }
        .btn-auth { background: var(--p); color: white; border: none; padding: 16px 32px; border-radius: 20px; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div id="maintenanceOverlay">
    <h1 style="font-family:'Outfit'; font-size: 48px; margin: 0;">Updating<span style="color:var(--p)">.</span></h1>
    <p style="color:var(--sub); margin-top: 10px;">The kitchen is being polished. We'll be back in a few minutes!</p>
</div>

<div id="authUI">
    <h1 style="font-family:'Outfit'; font-size: 50px; margin: 0;">VetTrack<span style="color:var(--p)">.</span></h1>
    <p style="color:var(--sub)">Exquisite Meal Management</p>
    <button class="btn-auth" onclick="login()">Enter the Lounge</button>
</div>

<div id="appUI" style="display:none;">
    <header class="header">
        <div>
            <small style="color:var(--sub); font-weight: 800; text-transform: uppercase;">Welcome back,</small>
            <h2 id="userName" style="font-family:'Outfit'; margin: 0;">Student Name</h2>
        </div>
        <img id="userIcon" class="profile-btn" src="">
    </header>

    <div class="bill-card">
        <div class="bill-label">Current Month Bill</div>
        <div class="bill-amt" id="totalBill">₹0</div>
        <div class="bill-status" id="payStatus">Checking Status...</div>
    </div>

    <div class="section-title">Activity Feed</div>
    <div class="activity-feed" id="activityFeed">
        <div style="padding: 20px; text-align: center; color: var(--sub); font-size: 12px;">No recent changes</div>
    </div>

    <div class="section-title">Today's Log</div>
    <div class="log-grid">
        <div id="btn-l" class="log-btn" onclick="toggleMeal('l')"><i>🍱</i><b>Lunch</b></div>
        <div id="btn-d" class="log-btn" onclick="toggleMeal('d')"><i>🌙</i><b>Dinner</b></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, getDoc, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", 
        messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" 
    };

    const app = initializeApp(firebaseConfig), db = getFirestore(app), auth = getAuth(app), provider = new GoogleAuthProvider();
    let user, userData, logs = {};

    // 1. Global Maintenance Check
    onSnapshot(doc(db, "app_settings", "global"), s => {
        const isMaint = s.exists() ? s.data().maintenance : false;
        document.getElementById('maintenanceOverlay').style.display = isMaint ? 'flex' : 'none';
    });

    window.login = () => signInWithPopup(auth, provider);

    onAuthStateChanged(auth, async u => {
        if(u) {
            user = u;
            document.getElementById('authUI').style.display = 'none';
            document.getElementById('appUI').style.display = 'block';
            document.getElementById('userName').innerText = u.displayName.split(' ')[0];
            document.getElementById('userIcon').src = u.photoURL;
            
            // Sync User Meta (Price & Payment Status)
            onSnapshot(doc(db, "users", u.uid), s => {
                userData = s.data() || { mealPrice: 50, isPaid: false };
                updateBill();
            });

            // Sync Today's Logs
            const mk = `${new Date().getFullYear()}_${new Date().getMonth()}`;
            onSnapshot(doc(db, "users", u.uid, "logs", mk), s => {
                logs = s.exists() ? s.data() : {};
                const today = new Date().getDate();
                const d = logs[today] || { l: 0, d: 0 };
                document.getElementById('btn-l').className = d.l ? 'log-btn active' : 'log-btn';
                document.getElementById('btn-d').className = d.d ? 'log-btn active' : 'log-btn';
                updateBill();
            });

            // Sync Activity Feed
            const q = query(collection(db, "users", u.uid, "activity"), orderBy("time", "desc"), limit(5));
            onSnapshot(q, snap => {
                const feed = document.getElementById('activityFeed');
                feed.innerHTML = "";
                snap.forEach(d => {
                    const a = d.data();
                    feed.innerHTML += `<div class="activity-item">${a.msg}<small>${new Date(a.time).toLocaleTimeString()}</small></div>`;
                });
            });

        }
    });

    window.toggleMeal = async (type) => {
        const today = new Date().getDate();
        if(!logs[today]) logs[today] = { l:0, d:0, lg:0, dg:0, w:0 };
        logs[today][type] = logs[today][type] ? 0 : 1;
        
        const mk = `${new Date().getFullYear()}_${new Date().getMonth()}`;
        await setDoc(doc(db, "users", user.uid, "logs", mk), { [today]: logs[today] }, { merge: true });
        
        // Auto-register user in DB if first time
        await setDoc(doc(db, "users", user.uid), { name: user.displayName, email: user.email, photo: user.photoURL }, { merge: true });
    };

    function updateBill() {
        let m=0, g=0;
        Object.values(logs).forEach(v => { 
            m += (v.l?1:0) + (v.d?1:0); 
            g += (parseInt(v.lg)||0) + (parseInt(v.dg)||0);
        });
        const total = (m+g) * (userData.mealPrice || 50);
        document.getElementById('totalBill').innerText = "₹" + total;
        
        const status = document.getElementById('payStatus');
        status.innerText = userData.isPaid ? '● Fully Paid' : '● Unpaid Balance';
        status.style.color = userData.isPaid ? 'var(--success)' : '#ffd1a1';
    }
</script>
</body>
</html>

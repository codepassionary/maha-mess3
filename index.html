<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TicketLuxe | Professional Booking</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Outfit:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #FF8C00; --bg: #0B0F1A; --card: #1E293B; --border: rgba(255,255,255,0.1); --text: #FFFFFF; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 40px; }
        
        header { background: rgba(11, 15, 26, 0.8); backdrop-filter: blur(20px); padding: 20px 5%; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Outfit'; font-size: 24px; }
        .logo span { color: var(--p); }

        .container { padding: 20px 5%; }
        .event-banner { width: 100%; border-radius: 30px; margin-bottom: 30px; border: 1px solid var(--border); }

        /* Seat Matrix */
        .seat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; max-width: 400px; margin: 30px auto; }
        .seat { aspect-ratio: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
        .seat.selected { background: var(--p); border-color: var(--p); transform: scale(1.1); box-shadow: 0 0 15px rgba(255, 140, 0, 0.4); }
        .seat.occupied { background: #334155; opacity: 0.3; cursor: not-allowed; }

        /* Glassmorphic Footer */
        .footer-action { position: fixed; bottom: 20px; left: 5%; right: 5%; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(15px); padding: 20px; border-radius: 25px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .btn-prime { background: var(--p); color: white; border: none; padding: 15px 35px; border-radius: 15px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo">Ticket<span>Luxe.</span></div>
    <div style="font-size:12px; font-weight:700;">NDVSU Rewa Campus</div>
</header>

<div class="container">
    <div style="margin-bottom:20px;">
        <h2 style="font-family:'Outfit'; margin:0;">Select Your Seats</h2>
        <p style="color:#94A3B8; font-size:14px; margin-top:5px;">Batch A Seminar | Hall 01</p>
    </div>

    <div class="seat-grid" id="seatGrid"></div>
</div>

<div class="footer-action">
    <div>
        <div style="font-size:10px; color:#94A3B8; font-weight:800; letter-spacing:1px;">TOTAL PAYABLE</div>
        <div id="totalDisplay" style="font-size:22px; font-weight:800;">₹0</div>
    </div>
    <button class="btn-prime" onclick="confirmBooking()">BOOK NOW</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, updateDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const SEAT_PRICE = 450;
    let selectedSeats = [];

    // --- SEAT ENGINE ---
    const grid = document.getElementById('seatGrid');
    for (let i = 1; i <= 36; i++) {
        const isOccupied = [5, 12, 18, 22].includes(i); // Simulated occupied seats
        grid.innerHTML += `<div class="seat ${isOccupied ? 'occupied' : ''}" onclick="toggleSeat(this, ${i})">${i}</div>`;
    }

    window.toggleSeat = (el, id) => {
        if (el.classList.contains('occupied')) return;
        
        el.classList.toggle('selected');
        if (el.classList.contains('selected')) {
            selectedSeats.push(id);
            if (window.navigator.vibrate) window.navigator.vibrate(40); // Clinical Haptic
        } else {
            selectedSeats = selectedSeats.filter(s => s !== id);
        }
        
        document.getElementById('totalDisplay').innerText = `₹${selectedSeats.length * SEAT_PRICE}`;
    };

    window.confirmBooking = async () => {
        if (selectedSeats.length === 0) return alert("Please select a seat.");
        
        // Firebase Logic Integration
        try {
            console.log("Syncing to Firebase...");
            // Example: updateDoc(doc(db, "bookings", "session_01"), { seats: arrayUnion(...selectedSeats) });
            alert(`Success! Seats ${selectedSeats.join(", ")} confirmed for Batch A.`);
            location.reload();
        } catch (e) {
            alert("Connection error. Caching pulse locally."); // Using your Resilience logic
        }
    };
</script>
</body>
</html>

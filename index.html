<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetTrack | Pulse Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #FF8C00; --bg: #0B0F1A; --card: #1E293B; --success: #2ed573; --danger: #ff4757; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; }
        
        /* Pulse UI */
        .status-card { background: var(--card); border-radius: 30px; padding: 30px; text-align: center; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .pulse-ring { width: 100px; height: 100px; border: 4px solid var(--p); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; position: relative; }
        .pulse-ring.active { animation: ripple 2s infinite; }
        
        @keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(255, 140, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0); } }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; text-align: center; }
        .btn { width: 100%; padding: 20px; border-radius: 20px; border: none; background: var(--p); color: white; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 20px; }
        #log { margin-top: 20px; font-size: 12px; color: #94A3B8; height: 100px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <h1 style="font-family:'Outfit';">Attendance<span style="color:var(--p)">Pulse.</span></h1>

    <div class="status-card">
        <div id="ring" class="pulse-ring">
            <span id="score">0%</span>
        </div>
        <div id="statusLabel" style="font-weight:700; color:var(--p)">READY TO START</div>
        <div id="timer" style="font-size: 14px; opacity: 0.6; margin-top: 5px;">Lecture Duration: 60m</div>
    </div>

    <div class="stat-grid">
        <div class="stat-item">
            <small>VALID PULSES</small>
            <div id="pulses" style="font-size:24px; font-weight:800;">0/12</div>
        </div>
        <div class="stat-item">
            <small>GRACE TIME</small>
            <div id="grace" style="font-size:24px; font-weight:800;">10m</div>
        </div>
    </div>

    <button id="startBtn" class="btn" onclick="engagePulse()">Start Tracking</button>

    <div id="log">System initialized. Waiting for GPS trigger...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { /* YOUR CONFIG */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // CONFIG
    const TARGET_LOC = { lat: 22.7196, lng: 75.8577 }; // Classroom Coords
    const CLASS_ID = "LECTURE_101";
    const USER_ID = "STUDENT_XYZ"; // In real app, get from Auth

    let pulsesCaught = 0;
    let totalChecks = 0;
    let isMonitoring = false;

    window.engagePulse = async () => {
        if(isMonitoring) return;
        isMonitoring = true;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('ring').classList.add('active');
        addLog("Pulse started. Continuous monitoring active.");

        // Create Initial Doc in Firestore
        await setDoc(doc(db, `attendance/${CLASS_ID}/students`, USER_ID), {
            name: "John Doe",
            status: "In Progress",
            startTime: serverTimestamp(),
            pulses: 0
        });

        // Run the pulse check every 5 minutes (300000ms)
        // For testing, change this to 10000 (10 seconds)
        runCheck(); 
        setInterval(runCheck, 300000); 
    };

    async function runCheck() {
        totalChecks++;
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const dist = calculateDistance(pos.coords.latitude, pos.coords.longitude, TARGET_LOC.lat, TARGET_LOC.lng);
            
            const inClass = dist < 0.05; // 50-meter radius
            if(inClass) pulsesCaught++;

            // Update UI
            document.getElementById('pulses').innerText = `${pulsesCaught}/12`;
            document.getElementById('score').innerText = `${Math.round((pulsesCaught/12)*100)}%`;
            document.getElementById('statusLabel').innerText = inClass ? "VERIFIED IN CLASS" : "OUTSIDE ROOM";
            document.getElementById('statusLabel').style.color = inClass ? "var(--success)" : "var(--danger)";
            
            addLog(`Pulse ${totalChecks}: ${inClass ? "Verified" : "Failed"}`);

            // Update Firebase Real-time
            await updateDoc(doc(db, `attendance/${CLASS_ID}/students`, USER_ID), {
                pulses: pulsesCaught,
                lastSeen: serverTimestamp(),
                finalStatus: pulsesCaught >= 10 ? "PRESENT" : "INCOMPLETE"
            });
        });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // km
        const dLat = (lat2-lat1) * Math.PI / 180;
        const dLon = (lon2-lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    }
</script>
</body>
</html>

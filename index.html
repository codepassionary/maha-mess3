<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biometric Geo Attendance</title>

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:450px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:20px;
padding:20px;
text-align:center;
}

video{
width:100%;
border-radius:12px;
margin-top:10px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.primary{
background:#22c55e;
color:white;
}

.secondary{
background:#3b82f6;
color:white;
}

.status{
margin-top:15px;
padding:10px;
background:#1e293b;
border-radius:10px;
}

.success{
color:#22c55e;
}

.error{
color:#ef4444;
}
</style>
</head>

<body>

<div class="card">

<h2>Biometric Geo Attendance</h2>

<video id="video" autoplay muted></video>

<button class="secondary" onclick="registerFace()">
Register Face
</button>

<button class="primary" onclick="markAttendance()">
Mark Attendance
</button>

<div class="status" id="status">
Waiting...
</div>

</div>

<script>

const video=document.getElementById("video");
const statusBox=document.getElementById("status");

const OFFICE_LAT=25.3176;
const OFFICE_LNG=82.9739;
const GEOFENCE_RADIUS=20;

async function loadModels(){

status("Loading AI models...");

await faceapi.nets.tinyFaceDetector.loadFromUri('./models');
await faceapi.nets.faceLandmark68Net.loadFromUri('./models');
await faceapi.nets.faceRecognitionNet.loadFromUri('./models');

status("Models Loaded");
}

async function startCamera(){

try{

const stream=await navigator.mediaDevices.getUserMedia({
video:true
});

video.srcObject=stream;

}catch(e){

status("Camera Permission Denied",true);

}
}

function status(text,error=false){

statusBox.innerHTML=text;

statusBox.className="status " + (error ? "error":"success");

}

function getDistance(lat1,lon1,lat2,lon2){

const R=6371000;

const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;

const a=
Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2;

const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;
}

async function registerFace(){

status("Registering face...");

const detection=await faceapi
.detectSingleFace(
video,
new faceapi.TinyFaceDetectorOptions()
)
.withFaceLandmarks()
.withFaceDescriptor();

if(!detection){

status("Face Not Detected",true);
return;
}

localStorage.setItem(
"faceDescriptor",
JSON.stringify(Array.from(detection.descriptor))
);

status("Face Registered Successfully");

}

async function verifyFace(){

const stored=localStorage.getItem("faceDescriptor");

if(!stored){

status("No Registered Face Found",true);
return false;
}

const savedDescriptor=
new Float32Array(JSON.parse(stored));

const detection=await faceapi
.detectSingleFace(
video,
new faceapi.TinyFaceDetectorOptions()
)
.withFaceLandmarks()
.withFaceDescriptor();

if(!detection){

status("Face Not Detected",true);
return false;
}

const distance=
faceapi.euclideanDistance(
savedDescriptor,
detection.descriptor
);

return distance<0.55;
}

function getLocation(){

return new Promise((resolve,reject)=>{

navigator.geolocation.getCurrentPosition(
resolve,
reject,
{
enableHighAccuracy:true,
timeout:10000
}
);

});
}

async function markAttendance(){

status("Verifying Face...");

const faceVerified=await verifyFace();

if(!faceVerified){

status("Face Verification Failed",true);
return;
}

status("Checking Location...");

try{

const pos=await getLocation();

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;

const distance=getDistance(
lat,
lng,
OFFICE_LAT,
OFFICE_LNG
);

if(distance>GEOFENCE_RADIUS){

status(
"Outside Geofence ("+
Math.round(distance)+
"m)",
true
);

return;
}

const attendance={
time:new Date().toLocaleString(),
latitude:lat,
longitude:lng
};

localStorage.setItem(
"lastAttendance",
JSON.stringify(attendance)
);

status(
"Attendance Marked Successfully"
);

}catch(e){

status("Location Access Failed",true);

}

}

loadModels();
startCamera();

</script>

</body>
</html>

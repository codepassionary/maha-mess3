<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VetTrack Luxe | Official Billing</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --p: #FF8C00; --bg: #0B0F1A; }
        body { font-family: 'Helvetica Neue', sans-serif; background: var(--bg); color: #fff; padding: 20px; }
        .btn { background: var(--p); color: white; padding: 15px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px; }
        #exportHelper { display: none; position: absolute; top: -9999px; left: -9999px; width: 800px; padding: 60px; background: white; color: black; }
        /* Anti-Spoof Seal Styling */
        .hologram-seal {
            position: absolute; top: 50px; right: 50px; width: 130px; height: 130px;
            background: radial-gradient(circle, #fff 10%, #FFD700 30%, #FF8C00 70%);
            border: 5px double #B8860B; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transform: rotate(-15deg); box-shadow: 0 0 25px rgba(0,0,0,0.3);
            overflow: hidden;
        }
    </style>
</head>
<body>

<div style="max-width:480px; margin:0 auto;">
    <h2>VetTrack Luxe Billing</h2>
    <button class="btn" onclick="exportPDF('meal')">Generate Official Meal Bill</button>
</div>

<div id="exportHelper"></div>

<script>
    const config = { name: "Dr. Resident", mealPrice: 50 };

    async function getAddress(lat, lon) {
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
            const data = await res.json();
            const addr = data.address;
            return `${addr.suburb || addr.neighbourhood || ''}, ${addr.city || addr.town || ''}, ${addr.state || ''} - ${addr.postcode || 'N/A'}`;
        } catch { return "Location Data Unavailable"; }
    }

    window.exportPDF = async (type) => {
        // 1. Force Location
        let pos;
        try {
            pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {enableHighAccuracy: true, timeout: 5000}));
        } catch(e) { alert("Location Services are MANDATORY. Please enable to proceed."); return; }

        const address = await getAddress(pos.coords.latitude, pos.coords.longitude);
        const { jsPDF } = window.jspdf;
        const helper = document.getElementById('exportHelper');
        const now = new Date();
        const total = 1250; // Dynamic total

        helper.style.display = 'block';
        helper.innerHTML = `
            <div style="position:relative; width: 100%; height: 100%; padding: 40px;">
                <div class="hologram-seal">
                    <div style="text-align:center; font-family: serif; color: #8B4513; padding: 10px;">
                        <b style="font-size: 14px;">VETTRACK</b><br>
                        <hr style="border: 0.5px solid #8B4513;">
                        <span style="font-size: 8px; letter-spacing: 2px;">AUTHENTICATED</span>
                    </div>
                </div>
                <h1 style="font-size: 45px; margin: 0;">OFFICIAL INVOICE</h1>
                <div style="margin-top: 20px; font-size: 24px;">TOTAL PAYABLE: <b>₹${total}</b></div>
                <div style="margin-top: 30px; line-height: 1.8; font-size: 14px;">
                    <p><b>Diner Name:</b> ${config.name}</p>
                    <p><b>Issue Date:</b> ${now.toDateString()}</p>
                    <p><b>Service Point:</b> ${address}</p>
                </div>
                <footer style="margin-top:100px; font-size: 12px; border-top: 1px solid #000; padding-top: 10px;">
                    Digital Signature: ${Math.random().toString(36).substr(2, 12).toUpperCase()} | Time: ${now.toLocaleTimeString()}
                </footer>
            </div>
        `;

        html2canvas(helper, {scale: 2}).then(canvas => {
            const doc = new jsPDF('p', 'mm', 'a4');
            doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
            doc.save(`VetTrack_Bill_${now.getTime()}.pdf`);
            helper.style.display = 'none';
        });
    };
</script>
</body>
</html>

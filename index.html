<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Integrity Terminal</title>
    <style>
        :root {
            --bg-canvas: #040712;
            --surface: #0d1322;
            --border: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --brand: #6366f1;
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .header p { font-size: 13px; color: var(--text-secondary); margin-bottom: 28px; }

        .status-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .status-pill.active { color: var(--success); border-color: rgba(16, 185, 129, 0.2); background: rgba(16, 185, 129, 0.02); }
        .status-pill.warning { color: var(--warning); border-color: rgba(251, 191, 36, 0.2); background: rgba(251, 191, 36, 0.02); }
        .status-pill.isolated { color: var(--danger); border-color: rgba(244, 63, 94, 0.2); background: rgba(244, 63, 94, 0.02); }

        .metric-box {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .progress-track {
            background-color: #1e293b;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--brand);
            transition: width 0.5s ease;
        }
        #attendanceBar { background-color: var(--success); }

        /* Hardware Hardware Error Screen Overlay */
        .hardware-blindfold {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 19, 34, 0.98);
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .hardware-blindfold h2 { color: var(--danger); font-size: 18px; margin-bottom: 8px; }
        .hardware-blindfold p { color: var(--text-secondary); font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        
        .hardware-toggle-btn {
            background: var(--brand);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Hardware State Alert Overlay -->
        <div id="hardwareAlertScreen" class="hardware-blindfold">
            <h2>Bluetooth Matrix Disconnected</h2>
            <p>Your timeline presence tracking is frozen. The system requires an active local Bluetooth array link to confirm you are sitting at a valid pair bench configuration.</p>
            <button id="retryHardwareBtn" class="hardware-toggle-btn">Re-verify Hardware Sensors</button>
        </div>

        <div class="header">
            <h1>Presence Core</h1>
            <p>Radio Environment Monitor</p>
        </div>

        <div id="statusBadge" class="status-pill active">Syncing Radio Grid...</div>

        <div class="metric-box">
            <div class="metric-row"><span>Lecture Horizon</span><span id="timeVal">0%</span></div>
            <div class="progress-track"><div id="timeBar" class="progress-bar"></div></div>
        </div>

        <div class="metric-box">
            <div class="metric-row"><span>Verified Timeline</span><span id="attendanceVal">0%</span></div>
            <div class="progress-track"><div id="attendanceBar" class="progress-bar"></div></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            let app = {
                elapsed: 0,
                verified: 0,
                bluetoothActive: true, // Core signal tracking link
                isTracking: true
            };

            const DOM = Object.freeze({
                badge: document.getElementById('statusBadge'),
                timeBar: document.getElementById('timeBar'),
                timeVal: document.getElementById('timeVal'),
                attBar: document.getElementById('attendanceBar'),
                attVal: document.getElementById('attendanceVal'),
                blindfold: document.getElementById('hardwareAlertScreen'),
                retryBtn: document.getElementById('retryHardwareBtn')
            });

            function initDeviceSensors() {
                // Monitor browser system connectivity layers
                window.addEventListener('online', evaluateSensorEnvironment);
                window.addEventListener('offline', evaluateSensorEnvironment);

                // Simulation trigger: Click the retry button to mimic toggling Bluetooth back on
                DOM.retryBtn.addEventListener('click', () => {
                    app.bluetoothActive = true;
                    evaluateSensorEnvironment();
                });

                // Simulate an unpredictable user action where they turn off Bluetooth after 7 seconds
                setTimeout(() => {
                    app.bluetoothActive = false;
                    evaluateSensorEnvironment();
                }, 7000);

                setInterval(clockEngine, 1000);
            }

            function evaluateSensorEnvironment() {
                // In production, navigate via native wrapper check: bluetooth.getAvailability()
                if (!app.bluetoothActive || !navigator.onLine) {
                    app.isTracking = false;
                    DOM.blindfold.style.display = "flex";
                    DOM.badge.textContent = "Hardware Signal Missing";
                    DOM.badge.className = "status-pill isolated";
                } else {
                    app.isTracking = true;
                    DOM.blindfold.style.display = "none";
                    DOM.badge.textContent = "Tracking Environment Secure";
                    DOM.badge.className = "status-pill active";
                }
            }

            function clockEngine() {
                if (!app.isTracking) return; // Completely locks tracking and stops adding seconds

                if (app.elapsed >= 3600) {
                    DOM.badge.textContent = "Session Completed Successfully";
                    DOM.badge.className = "status-pill active";
                    return;
                }

                app.elapsed++;
                app.verified++;
                updateInterface();
            }

            function updateInterface() {
                const limit = 3600;
                const timePct = (app.elapsed / limit) * 100;
                DOM.timeBar.style.width = `${timePct}%`;
                DOM.timeVal.textContent = `${Math.floor(timePct)}%`;

                const attPct = (app.verified / limit) * 100;
                DOM.attBar.style.width = `${attPct}%`;
                DOM.attVal.textContent = `${Math.floor(attPct)}%`;
            }

            // Launch Node
            initDeviceSensors();
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Offline Attendance Node</title>
    <style>
        :root {
            --bg-canvas: #090d16;
            --surface: #111827;
            --border: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --brand: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            padding: 36px;
            text-align: center;
        }

        .header h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
        .header p { font-size: 13px; color: var(--text-secondary); margin-bottom: 28px; }

        .status-pill {
            display: inline-flex;
            align-items: center;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            margin-bottom: 28px;
            transition: all 0.3s ease;
        }

        .status-pill.syncing { color: var(--brand); }
        .status-pill.active { color: var(--success); }
        .status-pill.isolated { color: var(--danger); }
        .status-pill.warning { color: var(--warning); }

        .metric-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .progress-track {
            background-color: #1f2937;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--brand);
            transition: width 0.3s linear;
        }

        #attendanceBar { background-color: var(--success); }

        .console {
            font-family: monospace;
            font-size: 11px;
            color: #6b7280;
            text-align: left;
            max-height: 110px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 16px;
            margin-top: 24px;
        }
        .log-entry { margin-bottom: 4px; line-height: 1.4; }
        .log-err { color: var(--danger); }
        .log-warn { color: var(--warning); }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Offline Attendance</h1>
            <p>Fault-Tolerant Verification Node</p>
        </div>

        <div class="status-container">
            <div id="statusBadge" class="status-pill syncing">Initializing Database...</div>
        </div>

        <div class="metric-container">
            <div class="metric-row"><span>Timeline Horizon</span><span id="timeVal">0%</span></div>
            <div class="progress-track"><div id="timeBar" class="progress-bar"></div></div>
        </div>

        <div class="metric-container">
            <div class="metric-row"><span>Attendance Progress</span><span id="attendanceVal">0%</span></div>
            <div class="progress-track"><div id="attendanceBar" class="progress-bar"></div></div>
        </div>

        <div id="consoleLog" class="console">Booting storage modules...</div>
    </div>

    <script>
        (function() {
            'use strict';

            const CONFIG = Object.freeze({
                TARGET_LAT: 24.507607,
                TARGET_LNG: 81.298394,
                ALLOWED_RADIUS_M: 65,
                MAX_GPS_ACCURACY_M: 40,
                SESSION_TOTAL_SEC: 3600,
                DB_NAME: "OfflineAttendanceDB",
                DB_VERSION: 1
            });

            let state = {
                elapsed: 0,
                verified: 0,
                isInside: false,
                compromised: false,
                db: null,
                watchId: null,
                isGpsActive: false
            };

            const DOM = Object.freeze({
                badge: document.getElementById('statusBadge'),
                timeBar: document.getElementById('timeBar'),
                timeVal: document.getElementById('timeVal'),
                attBar: document.getElementById('attendanceBar'),
                attVal: document.getElementById('attendanceVal'),
                console: document.getElementById('consoleLog')
            });

            function pushLog(text, type = 'info') {
                const el = document.createElement('div');
                el.className = 'log-entry';
                if(type === 'error') el.className += ' log-err';
                if(type === 'warning') el.className += ' log-warn';
                
                el.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
                DOM.console.appendChild(el);
                DOM.console.scrollTop = DOM.console.scrollHeight;
                
                if (DOM.console.childNodes.length > 25) {
                    DOM.console.removeChild(DOM.console.firstChild);
                }
            }

            function geoMath(lat1, lon1, lat2, lon2) {
                try {
                    const R = 6371e3;
                    const p1 = lat1 * Math.PI / 180;
                    const p2 = lat2 * Math.PI / 180;
                    const dPhi = (lat2 - lat1) * Math.PI / 180;
                    const dLam = (lon2 - lon1) * Math.PI / 180;
                    const a = Math.sin(dPhi/2) * Math.sin(dPhi/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dLam/2) * Math.sin(dLam/2);
                    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
                } catch (e) {
                    pushLog("Math exception handled during calculation.", "error");
                    return Infinity;
                }
            }

            // Database Initialization with Fallbacks
            function initDatabase() {
                try {
                    const request = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);

                    request.onupgradeneeded = function(e) {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains("logs")) db.createObjectStore("logs", { keyPath: "timestamp" });
                        if (!db.objectStoreNames.contains("state")) db.createObjectStore("state", { keyPath: "parameter" });
                    };

                    request.onsuccess = function(e) {
                        state.db = e.target.result;
                        pushLog("IndexedDB initialized successfully.");
                        restoreSession();
                    };

                    request.onerror = function(e) {
                        pushLog(`DB Engine downgrade. Running in temporary runtime memory.`, "warning");
                        startEngine(); // Fallback to memory tracking instead of completely hard-crashing
                    };
                } catch (err) {
                    pushLog("Storage sandbox access rejected. Bypassing to temporary cache.", "warning");
                    startEngine();
                }
            }

            function saveTelemetryRow(lat, lng, accuracy, insideStatus) {
                if (!state.db) return;
                try {
                    const transaction = state.db.transaction(["logs", "state"], "readwrite");
                    
                    transaction.onerror = function(e) {
                        // Catches QuotaExceededError or other database execution exceptions
                        pushLog(`Write aborted: ${e.target.error?.name || 'Storage Limit reached'}`, "warning");
                    };

                    const logStore = transaction.objectStore("logs");
                    const stateStore = transaction.objectStore("state");

                    logStore.put({
                        timestamp: Date.now(),
                        latitude: lat,
                        longitude: lng,
                        accuracy: accuracy,
                        status: insideStatus
                    });

                    stateStore.put({ parameter: "elapsed", value: state.elapsed });
                    stateStore.put({ parameter: "verified", value: state.verified });
                } catch (err) {
                    // Fail-safe to avoid throwing runtime unhandled script crashes
                }
            }

            function restoreSession() {
                if (!state.db) return;
                try {
                    const transaction = state.db.transaction(["state"], "readonly");
                    const store = transaction.objectStore("state");
                    
                    const getElapsed = store.get("elapsed");
                    getElapsed.onsuccess = function() {
                        if (getElapsed.result && typeof getElapsed.result.value === 'number') {
                            state.elapsed = Math.min(getElapsed.result.value, CONFIG.SESSION_TOTAL_SEC);
                        }
                        
                        const getVerified = store.get("verified");
                        getVerified.onsuccess = function() {
                            if (getVerified.result && typeof getVerified.result.value === 'number') {
                                state.verified = Math.min(getVerified.result.value, CONFIG.SESSION_TOTAL_SEC);
                            }
                            updateUI();
                            startEngine();
                        };
                    };
                    
                    transaction.onerror = function() {
                        pushLog("State restore failure. Resetting baseline state safely.", "warning");
                        startEngine();
                    };
                } catch (e) {
                    startEngine();
                }
            }

            function clockTickEngine() {
                if (state.compromised) return;

                if (state.elapsed >= CONFIG.SESSION_TOTAL_SEC) {
                    DOM.badge.textContent = "Session Complete";
                    DOM.badge.className = "status-pill active";
                    pushLog("Session tracking threshold achieved.");
                    if(state.watchId) navigator.geolocation.clearWatch(state.watchId);
                    return;
                }

                // Tick logic is permitted exclusively if the GPS hardware layer is responsive
                if (state.isGpsActive) {
                    state.elapsed++;
                    if (state.isInside) {
                        state.verified++;
                    }
                    updateUI();
                }
            }

            function updateUI() {
                const timePercent = (state.elapsed / CONFIG.SESSION_TOTAL_SEC) * 100;
                DOM.timeBar.style.width = `${timePercent}%`;
                DOM.timeVal.textContent = `${Math.floor(timePercent)}%`;

                const attPercent = (state.verified / CONFIG.SESSION_TOTAL_SEC) * 100;
                DOM.attBar.style.width = `${attPercent}%`;
                DOM.attVal.textContent = `${Math.floor(attPercent)}%`;
            }

            function processLocationStream(position) {
                if (state.compromised) return;
                state.isGpsActive = true;

                if (!position || !position.coords || position.mocked === true) {
                    isolateTerminal("Hardware level mock manipulation detected.");
                    return;
                }

                const uLat = position.coords.latitude;
                const uLng = position.coords.longitude;
                const uAcc = position.coords.accuracy;

                if (uAcc > CONFIG.MAX_GPS_ACCURACY_M) {
                    DOM.badge.textContent = "Signal Degraded";
                    DOM.badge.className = "status-pill warning";
                    state.isInside = false;
                    pushLog("Precision low. Seeking denser GPS satellite mesh...", "warning");
                    return;
                }

                const distance = geoMath(uLat, uLng, CONFIG.TARGET_LAT, CONFIG.TARGET_LNG);

                if (distance <= CONFIG.ALLOWED_RADIUS_M) {
                    DOM.badge.textContent = "Presence Verified";
                    DOM.badge.className = "status-pill active";
                    state.isInside = true;
                } else {
                    DOM.badge.textContent = "Outside Area Boundary";
                    DOM.badge.className = "status-pill isolated";
                    state.isInside = false;
                }

                saveTelemetryRow(uLat, uLng, uAcc, state.isInside);
            }

            // Core Error Interface for Hardware Failure Cases
            function handleHardwareFault(err) {
                state.isGpsActive = false;
                state.isInside = false;
                
                switch(err.code) {
                    case err.PERMISSION_DENIED:
                        DOM.badge.textContent = "Access Denied";
                        DOM.badge.className = "status-pill isolated";
                        pushLog("CRITICAL: Location permissions revoked.", "error");
                        break;
                    case err.POSITION_UNAVAILABLE:
                        DOM.badge.textContent = "Signal Offline";
                        DOM.badge.className = "status-pill warning";
                        pushLog("Hardware layer lost positioning fix.", "warning");
                        break;
                    case err.TIMEOUT:
                        DOM.badge.textContent = "Telemetry Lag";
                        DOM.badge.className = "status-pill warning";
                        pushLog("Hardware query timeout window expired.", "warning");
                        break;
                    default:
                        DOM.badge.textContent = "Hardware Fault";
                        DOM.badge.className = "status-pill isolated";
                        break;
                }
            }

            function isolateTerminal(reason) {
                state.compromised = true;
                state.isInside = false;
                DOM.badge.textContent = "Terminal Isolated";
                DOM.badge.className = "status-pill isolated";
                DOM.timeBar.style.backgroundColor = "var(--danger)";
                DOM.attBar.style.backgroundColor = "var(--danger)";
                pushLog(`CRITICAL: ${reason}`, "error");
                if (state.watchId) navigator.geolocation.clearWatch(state.watchId);
            }

            function startEngine() {
                pushLog("Binding hardware location interfaces...");
                
                // Establish watch link with robust configurations
                state.watchId = navigator.geolocation.watchPosition(
                    processLocationStream, 
                    handleHardwareFault, 
                    {
                        enableHighAccuracy: true,
                        timeout: 8000,       // Triggers error fallback if hardware freezes for >8s
                        maximumAge: 0        // Bypasses local cache, enforcing genuine real-time verification
                    }
                );

                setInterval(clockTickEngine, 1000);
            }

            // Fallback Initialization Gateway Checks
            if (navigator.geolocation && typeof window.indexedDB !== 'undefined') {
                initDatabase();
            } else {
                DOM.badge.textContent = "Node Incompatible";
                DOM.badge.className = "status-pill isolated";
                pushLog("Fatal: Hardware architecture unsupported.", "error");
            }
        })();
    </script>
</body>
</html>

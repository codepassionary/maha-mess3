<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VetTrack Luxe | Admin Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #FF8C00; --bg: #0B0F1A; --card: rgba(30, 41, 59, 0.7); 
            --surface: rgba(51, 65, 85, 0.5); --text: #FFFFFF; --sub: #94A3B8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; }
        
        .container { max-width: 650px; margin: 0 auto; }
        
        /* Header & Search */
        .admin-header { margin-bottom: 25px; }
        .admin-header h1 { font-family: 'Outfit'; font-size: 32px; margin: 0; letter-spacing: -1px; }
        .search-box {
            width: 100%; padding: 15px 20px; background: var(--card); border: 1px solid var(--surface);
            border-radius: 15px; color: white; margin-top: 15px; font-family: inherit;
        }

        /* Stats Bar */
        .master-stats { display: flex; gap: 12px; margin-bottom: 25px; }
        .stat-box { flex: 1; background: var(--card); padding: 18px; border-radius: 22px; border: 1px solid var(--surface); }
        .stat-box small { font-size: 10px; color: var(--sub); font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 5px; }
        .stat-box div { font-family: 'Outfit'; font-size: 26px; color: var(--p); font-weight: 800; }

        /* Student Row with Icons */
        .student-row {
            background: var(--card); padding: 12px 18px; border-radius: 22px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--surface);
            cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .student-row:hover { border-color: var(--p); background: rgba(255,140,0,0.05); transform: translateY(-2px); }
        
        .student-meta { display: flex; align-items: center; gap: 15px; }
        .student-icon { 
            width: 48px; height: 48px; border-radius: 16px; 
            object-fit: cover; border: 2px solid var(--surface);
            background: var(--bg);
        }
        .student-name { font-weight: 700; font-size: 16px; display: block; }
        .student-sub { font-size: 11px; color: var(--sub); font-weight: 600; }

        /* Detail Modal */
        .modal {
            position: fixed; inset: 0; background: var(--bg); z-index: 20000;
            display: none; flex-direction: column; padding: 25px; overflow-y: auto;
        }
        .modal.active { display: flex; }
        
        .detail-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        .detail-table th { text-align: left; color: var(--sub); padding: 10px; text-transform: uppercase; font-size: 10px; }
        .detail-table td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .input-mini { background: #000; border: 1px solid var(--surface); color: white; padding: 6px; border-radius: 8px; width: 45px; text-align: center; }
        .btn-p { background: var(--p); color: white; border: none; padding: 12px 25px; border-radius: 15px; font-weight: 800; cursor: pointer; }
        
        #loader { text-align: center; padding: 50px; color: var(--p); font-weight: 800; }
    </style>
</head>
<body>

<div class="container" id="mainDashboard">
    <div class="admin-header">
        <h1>Control Tower</h1>
        <input type="text" id="studentSearch" class="search-box" placeholder="Search by student name..." oninput="filterData()">
    </div>

    <div class="master-stats">
        <div class="stat-box"><small>Total Rev</small><div id="totalRev">₹0</div></div>
        <div class="stat-box"><small>Plates</small><div id="totalPlates">0</div></div>
    </div>

    <div id="loader">Syncing Students...</div>
    <div id="studentList"></div>
</div>

<div id="editModal" class="modal">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <button onclick="closeModal()" style="background:none; border:none; color:var(--sub); font-weight:800; cursor:pointer;">← BACK</button>
        <button class="btn-p" onclick="window.print()">PRINT BILL</button>
    </div>
    
    <div style="display:flex; align-items:center; gap:15px; margin-top:30px;">
        <img id="editIcon" class="student-icon" src="" style="width:60px; height:60px;">
        <div>
            <h2 id="editName" style="font-family:'Outfit'; margin:0">Name</h2>
            <p id="editEmail" style="font-size:12px; color:var(--sub); margin:0">email@student.com</p>
        </div>
    </div>

    <table class="detail-table">
        <thead>
            <tr><th>Day</th><th>L</th><th>D</th><th>Guests</th><th>W</th></tr>
        </thead>
        <tbody id="detailBody"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", 
        messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" 
    };

    const app = initializeApp(firebaseConfig), db = getFirestore(app), auth = getAuth(app), provider = new GoogleAuthProvider();
    let allStudents = [], currentUid, currentLogs;

    onAuthStateChanged(auth, u => { if(u) fetchAll(); else signInWithPopup(auth, provider); });

    async function fetchAll() {
        const snap = await getDocs(collection(db, "users"));
        const monthKey = `${new Date().getFullYear()}_${new Date().getMonth()}`;
        allStudents = [];
        
        for(const d of snap.docs) {
            const u = d.data();
            const lSnap = await getDoc(doc(db, "users", d.id, "logs", monthKey));
            const logs = lSnap.exists() ? lSnap.data() : {};
            allStudents.push({ uid: d.id, ...u, logs });
        }
        renderList(allStudents);
    }

    function renderList(data) {
        document.getElementById('loader').style.display = 'none';
        const list = document.getElementById('studentList');
        list.innerHTML = "";
        let rev = 0, plates = 0;

        data.forEach(s => {
            let m=0, g=0;
            Object.values(s.logs).forEach(v => { 
                if(v.l) m++; if(v.d) m++; 
                g += (parseInt(v.lg)||0) + (parseInt(v.dg)||0);
            });
            const bill = (m + g) * (s.mealPrice || 50);
            rev += bill; plates += (m + g);

            // Generate initial-based icon if no photo exists
            const photo = s.photo || `https://ui-avatars.com/api/?name=${s.name}&background=random&color=fff`;

            list.innerHTML += `
                <div class="student-row" onclick='openDetail("${s.uid}")'>
                    <div class="student-meta">
                        <img class="student-icon" src="${photo}">
                        <div>
                            <span class="student-name">${s.name}</span>
                            <span class="student-sub">${m+g} Plates logged</span>
                        </div>
                    </div>
                    <div class="student-amt">₹${bill}</div>
                </div>`;
        });
        document.getElementById('totalRev').innerText = "₹" + rev;
        document.getElementById('totalPlates').innerText = plates;
    }

    window.openDetail = (uid) => {
        const s = allStudents.find(x => x.uid === uid);
        currentUid = uid; currentLogs = s.logs;
        document.getElementById('editName').innerText = s.name;
        document.getElementById('editIcon').src = s.photo || `https://ui-avatars.com/api/?name=${s.name}&background=random&color=fff`;
        document.getElementById('editModal').classList.add('active');
        renderTable();
    }

    window.filterData = () => {
        const query = document.getElementById('studentSearch').value.toLowerCase();
        const filtered = allStudents.filter(s => s.name.toLowerCase().includes(query));
        renderList(filtered);
    }

    window.closeModal = () => { document.getElementById('editModal').classList.remove('active'); fetchAll(); }

    function renderTable() {
        const body = document.getElementById('detailBody');
        body.innerHTML = "";
        const days = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
        for(let i=1; i<=days; i++) {
            const d = currentLogs[i] || { l:0, d:0, lg:0, dg:0, w:0 };
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i}</td>
                <td><input type="checkbox" ${d.l?'checked':''} onchange="update(${i}, 'l', this.checked?1:0)"></td>
                <td><input type="checkbox" ${d.d?'checked':''} onchange="update(${i}, 'd', this.checked?1:0)"></td>
                <td><input type="number" class="input-mini" value="${(parseInt(d.lg)||0) + (parseInt(d.dg)||0)}" onchange="update(${i}, 'lg', this.value)"></td>
                <td><input type="number" class="input-mini" value="${d.w||0}" onchange="update(${i}, 'w', this.value)"></td>
            `;
            body.appendChild(tr);
        }
    }

    window.update = async (day, field, val) => {
        if(!currentLogs[day]) currentLogs[day] = { l:0, d:0, lg:0, dg:0, w:0 };
        currentLogs[day][field] = val;
        const monthKey = `${new Date().getFullYear()}_${new Date().getMonth()}`;
        await setDoc(doc(db, "users", currentUid, "logs", monthKey), { [day]: currentLogs[day] }, { merge: true });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VetTrack Luxe | Pay & Play</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        :root { 
            --p: #FF8C00; --bg: #05070A; --card: rgba(17, 24, 39, 0.8); 
            --surface: rgba(31, 41, 55, 0.5); --text: #F9FAFB; --sub: #9CA3AF;
            --success: #10B981; --danger: #EF4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px 20px 100px 20px; }

        /* Unified Bill Section */
        .bill-widget {
            background: linear-gradient(145deg, #1e1b4b 0%, #05070A 100%);
            border: 1px solid var(--surface); padding: 25px; border-radius: 32px;
            margin-bottom: 25px; position: relative; overflow: hidden;
        }
        .bill-widget::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,140,0,0.1) 0%, transparent 70%); pointer-events: none; }
        
        .amt-big { font-family: 'Outfit'; font-size: 48px; font-weight: 900; color: white; margin: 10px 0; }
        .status-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 100px; font-size: 11px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.1); }
        .paid { background: rgba(16, 185, 129, 0.2); color: var(--success); border-color: var(--success); }
        .unpaid { background: rgba(239, 68, 68, 0.2); color: var(--danger); border-color: var(--danger); }

        /* Payment Button */
        .pay-btn {
            width: 100%; background: var(--p); color: white; border: none; padding: 18px;
            border-radius: 20px; font-size: 16px; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(255, 140, 0, 0.4); margin-top: 15px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pay-btn:active { transform: scale(0.96); }
        .pay-btn:disabled { background: var(--surface); color: var(--sub); box-shadow: none; cursor: not-allowed; }

        /* Log Section */
        .log-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .log-tile { background: var(--card); border: 1px solid var(--surface); padding: 20px; border-radius: 24px; text-align: center; }
        .log-tile.active { border-color: var(--p); background: rgba(255,140,0,0.05); }
        .circle-toggle { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--surface); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .active .circle-toggle { background: var(--p); border-color: var(--p); color: white; }

        #maintenance { position: fixed; inset: 0; background: var(--bg); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; }
    </style>
</head>
<body>

<div id="maintenance">
    <h1 style="font-family:'Outfit'; font-size: 42px;">System Update</h1>
    <p style="color:var(--sub)">We're making things better. Hang tight!</p>
</div>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="font-family:'Outfit'; margin:0">VetTrack<span style="color:var(--p)">.</span></h2>
        <img id="u-icon" style="width:40px; height:40px; border-radius:12px; border:1px solid var(--surface);">
    </div>

    <div class="bill-widget">
        <div class="status-pill" id="u-status">Loading...</div>
        <div class="amt-big" id="u-bill">₹0</div>
        <small id="u-meta" style="color:var(--sub); font-weight:700;">0 Meals Total</small>
        
        <button id="pay-button" class="pay-btn" onclick="initiatePayment()">Pay Monthly Dues</button>
    </div>

    <h3 style="font-family:'Outfit'; font-size:18px;">Today's Attendance</h3>
    <div class="log-section">
        <div id="l-tile" class="log-tile" onclick="toggleMeal('l')">
            <div class="circle-toggle">L</div>
            <b style="font-size:14px;">LUNCH</b>
        </div>
        <div id="d-tile" class="log-tile" onclick="toggleMeal('d')">
            <div class="circle-toggle">D</div>
            <b style="font-size:14px;">DINNER</b>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, updateDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", 
        messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" 
    };

    const app = initializeApp(firebaseConfig), db = getFirestore(app), auth = getAuth(app), provider = new GoogleAuthProvider();
    let user, userData, logs = {}, currentAmount = 0;

    onAuthStateChanged(auth, u => {
        if(u) {
            user = u;
            document.getElementById('u-icon').src = u.photoURL;
            syncData();
        } else signInWithPopup(auth, provider);
    });

    // 1. Live Sync Global Maintenance
    onSnapshot(doc(db, "app_settings", "global"), s => {
        document.getElementById('maintenance').style.display = (s.exists() && s.data().maintenance) ? 'flex' : 'none';
    });

    function syncData() {
        const mk = `${new Date().getFullYear()}_${new Date().getMonth()}`;
        
        // Sync Profile (Price/Status)
        onSnapshot(doc(db, "users", user.uid), s => {
            userData = s.data() || { mealPrice: 50, isPaid: false };
            updateUI();
        });

        // Sync Logs
        onSnapshot(doc(db, "users", user.uid, "logs", mk), s => {
            logs = s.exists() ? s.data() : {};
            updateUI();
        });
    }

    function updateUI() {
        let m=0, g=0, today = new Date().getDate();
        Object.values(logs).forEach(v => { 
            m += (v.l?1:0) + (v.d?1:0); 
            g += (parseInt(v.lg)||0) + (parseInt(v.dg)||0);
        });
        
        currentAmount = (m+g) * (userData.mealPrice || 50);
        document.getElementById('u-bill').innerText = "₹" + currentAmount;
        document.getElementById('u-meta').innerText = `${m+g} Plates Registered`;

        const stat = document.getElementById('u-status');
        const payBtn = document.getElementById('pay-button');

        if(userData.isPaid) {
            stat.innerText = "● Verified Paid"; stat.className = "status-pill paid";
            payBtn.disabled = true; payBtn.innerText = "Payment Cleared";
        } else {
            stat.innerText = "● Due Pending"; stat.className = "status-pill unpaid";
            payBtn.disabled = currentAmount === 0;
            payBtn.innerText = "Pay Now";
        }

        const d = logs[today] || { l:0, d:0 };
        document.getElementById('l-tile').className = d.l ? 'log-tile active' : 'log-tile';
        document.getElementById('d-tile').className = d.d ? 'log-tile active' : 'log-tile';
    }

    window.toggleMeal = async (t) => {
        const today = new Date().getDate();
        if(!logs[today]) logs[today] = { l:0, d:0, lg:0, dg:0, w:0 };
        logs[today][t] = logs[today][t] ? 0 : 1;
        const mk = `${new Date().getFullYear()}_${new Date().getMonth()}`;
        await setDoc(doc(db, "users", user.uid, "logs", mk), { [today]: logs[today] }, { merge: true });
        // Ensure user entry exists
        await setDoc(doc(db, "users", user.uid), { name: user.displayName, email: user.email, photo: user.photoURL }, { merge: true });
    }

    // RAZORPAY INTEGRATION
    window.initiatePayment = () => {
        if(currentAmount <= 0) return;

        const options = {
            "key": "rzp_test_YOUR_KEY_HERE", // Replace with your Key ID from Razorpay Dashboard
            "amount": currentAmount * 100, // In paise
            "currency": "INR",
            "name": "VetTrack Luxe",
            "description": "Monthly Mess Dues",
            "handler": async function (response) {
                // UPDATE DB ON SUCCESS
                await updateDoc(doc(db, "users", user.uid), { isPaid: true });
                await addDoc(collection(db, "users", user.uid, "activity"), {
                    msg: `Successfully paid ₹${currentAmount} (Ref: ${response.razorpay_payment_id})`,
                    time: Date.now()
                });
                alert("Payment Successful! Status Updated.");
            },
            "prefill": { "name": user.displayName, "email": user.email },
            "theme": { "color": "#FF8C00" }
        };
        const rzp = new Razorpay(options);
        rzp.open();
    };
</script>
</body>
</html>

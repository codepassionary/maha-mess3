<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetTrack | Admin Luxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Outfit:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #FF8C00; --bg: #0B0F1A; --card: rgba(30, 41, 59, 0.7); --text: #FFFFFF; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,140,0,0.3); margin-bottom: 20px; }
        .student-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .amt { color: var(--p); font-weight: 800; font-family: 'Outfit'; }
        #loginBtn { background: var(--p); color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: 800; cursor: pointer; display: none; }
    </style>
</head>
<body>

    <div id="adminUI" style="display:none;">
        <h1 style="font-family:'Outfit'">Admin Dashboard</h1>
        <div class="stat-card">
            <small>TOTAL COLLECTION</small>
            <div id="totalCollection" style="font-size:32px; color:var(--p)">₹0</div>
        </div>
        <div id="studentList"></div>
    </div>

    <div id="authUI" style="text-align:center; padding-top:100px;">
        <h2 style="font-family:'Outfit'">Admin Authorization</h2>
        <button id="loginBtn" onclick="adminLogin()">Sign In as Admin</button>
        <p id="status">Checking credentials...</p>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", 
        authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e", 
        storageBucket: "vettrack-1c65e.firebasestorage.app", 
        messagingSenderId: "591343582241", 
        appId: "1:591343582241:web:9fc9761725ad7d9bb97760" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.adminLogin = () => {
        signInWithPopup(auth, provider).catch(e => alert("Login Error: " + e.message));
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('authUI').style.display = 'none';
            document.getElementById('adminUI').style.display = 'block';
            fetchAllData();
        } else {
            document.getElementById('loginBtn').style.display = 'inline-block';
            document.getElementById('status').innerText = "Please sign in to access Admin data.";
        }
    });

    async function fetchAllData() {
        const list = document.getElementById('studentList');
        const monthKey = `${new Date().getFullYear()}_${new Date().getMonth()}`;
        let grandTotal = 0;

        try {
            const usersSnap = await getDocs(collection(db, "users"));
            list.innerHTML = "";
            
            for (const userDoc of usersSnap.docs) {
                const u = userDoc.data();
                const logSnap = await getDoc(doc(db, "users", userDoc.id, "logs", monthKey));
                const logs = logSnap.exists() ? logSnap.data() : {};
                
                let m=0, w=0;
                Object.values(logs).forEach(v => { if(v.l) m++; if(v.d) m++; if(v.w) w++; });
                const bill = (m * (u.mealPrice || 50)) + (w * (u.waterPrice || 30));
                grandTotal += bill;

                list.innerHTML += `
                    <div class="student-card">
                        <span><strong>${u.name || 'User'}</strong><br><small>${m} Meals</small></span>
                        <span class="amt">₹${bill}</span>
                    </div>`;
            }
            document.getElementById('totalCollection').innerText = "₹" + grandTotal;
        } catch (e) {
            alert("Permission Denied: You are not recognized as an Admin in Firestore Rules.");
            console.error(e);
        }
    }
</script>
</body>
</html>

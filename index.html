<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VetTrack Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --p: #FF8C00; --bg: #F8F9FA; --text: #1A1A1A; --card: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .admin-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .user-card { background: var(--card); padding: 20px; border-radius: 24px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .user-info h3 { margin: 0; font-size: 16px; }
        .btn-action { background: var(--p); color: white; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 800; }
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 100; display: none; align-items: flex-end; }
        .sheet { background: white; width: 100%; border-radius: 30px 30px 0 0; padding: 30px; max-height: 80vh; overflow-y: auto; transform: translateY(100%); transition: 0.3s ease; }
        .sheet.open { transform: translateY(0); }
        .log-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #F5F5F5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-head"><h1>Master Center</h1><button onclick="fetchUsers()" style="border:none; background:none; font-size:20px;">🔄</button></div>
        <div id="masterList"></div>
    </div>
    <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"><div class="sheet" id="sheet" onclick="event.stopPropagation()"><h2 id="sheetTitle">History Sync</h2><div id="history"></div></div></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    const firebaseConfig = { apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" };
    const app = initializeApp(firebaseConfig), db = getFirestore(app);

    window.fetchUsers = async () => {
        const snap = await getDocs(collection(db, "users"));
        const list = document.getElementById('masterList'); list.innerHTML = "";
        snap.forEach(u => {
            const div = document.createElement('div'); div.className = "user-card";
            div.innerHTML = `<div class="user-info"><h3>${u.data().name || 'New User'}</h3><small>${u.id.slice(0,8)}</small></div><button class="btn-action" onclick="syncFull('${u.id}')">Sync</button>`;
            list.appendChild(div);
        });
    };

    window.syncFull = async (uid) => {
        document.getElementById('sheetOverlay').style.display='flex'; setTimeout(()=>document.getElementById('sheet').classList.add('open'),10);
        const logSnap = await getDocs(collection(db, `users/${uid}/logs`));
        const hist = document.getElementById('history'); hist.innerHTML = "";
        logSnap.forEach(d => {
            let m=0, w=0; Object.values(d.data()).forEach(v=>{if(v.l)m++;if(v.d)m++;if(v.w)w++;});
            hist.innerHTML += `<div class="log-item"><b>${d.id}</b> <span>${m} Meals • ₹${m*50+w*30}</span></div>`;
        });
    };
    window.closeSheet = () => { document.getElementById('sheet').classList.remove('open'); setTimeout(()=>document.getElementById('sheetOverlay').style.display='none',300); };
    fetchUsers();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VetTrack Super Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { 
            --p: #2563EB; --p-glow: rgba(37, 99, 235, 0.4);
            --bg: #F8FAFC; --card: #FFFFFF; --surface: #F1F5F9;
            --text: #0F172A; --sub: #64748B; --border: #E2E8F0;
            --danger: #EF4444; --warn: #F59E0B;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding-bottom: 80px; padding-top: env(safe-area-inset-top);
        }

        .navbar {
            background: var(--card); padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .brand { font-family: 'Outfit'; font-size: 24px; font-weight: 900; color: var(--p); letter-spacing: -0.5px; }
        
        .lang-btn { background: var(--surface); color: var(--p); border: none; padding: 10px 18px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        .stat-card {
            background: linear-gradient(135deg, var(--p) 0%, #1D4ED8 100%);
            padding: 25px; border-radius: 24px; margin-bottom: 25px;
            color: white; box-shadow: 0 10px 25px -5px var(--p-glow);
            display: flex; justify-content: space-between; align-items: center;
        }
        .stat-val { font-family: 'Outfit'; font-size: 42px; font-weight: 900; line-height: 1; }
        .stat-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; margin-bottom: 5px; }

        .section-title { font-size: 14px; font-weight: 800; margin-bottom: 15px; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; }

        /* User List */
        .user-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 18px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); cursor: pointer;
            transition: 0.2s;
        }
        .user-card:active { transform: scale(0.98); }
        .user-info h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .user-info p { font-size: 13px; color: var(--sub); font-weight: 600; }
        .open-icon { background: var(--surface); width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--p); }

        /* Overlay & Bottom Sheet */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 2000; display: none; flex-direction: column; justify-content: flex-end; }
        .sheet { background: var(--bg); width: 100%; max-width: 600px; margin: 0 auto; height: 90vh; border-radius: 30px 30px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
        .sheet.up { transform: translateY(0); }
        
        .sheet-header { padding: 20px 25px; background: var(--card); border-radius: 30px 30px 0 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .sheet-title { font-family: 'Outfit'; font-size: 24px; font-weight: 800; }
        .close-btn { background: var(--surface); border: none; width: 36px; height: 36px; border-radius: 18px; font-size: 18px; font-weight: bold; color: var(--text); cursor: pointer; }

        .sheet-content { padding: 20px; overflow-y: auto; flex: 1; }

        /* Actions Grid */
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .btn-action { padding: 15px; border-radius: 16px; border: none; font-weight: 800; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .btn-action i { font-size: 20px; font-style: normal; }
        .btn-bill { background: var(--p); color: white; }
        .btn-edit { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
        .btn-warn { background: rgba(245, 158, 11, 0.1); color: var(--warn); border: 1px solid var(--warn); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }

        /* Calendar Grid (Inspired by Luxe) */
        .nav-pill { display: flex; align-items: center; background: var(--card); padding: 8px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        .nav-pill button { border: none; background: var(--surface); color: var(--text); width: 40px; height: 40px; border-radius: 14px; cursor: pointer; font-size: 18px; }
        .nav-pill span { flex: 1; text-align: center; font-weight: 800; font-size: 15px; }

        .day-item { 
            display: grid; grid-template-columns: 60px 1fr 1fr 1fr; gap: 8px; align-items: center; 
            padding: 12px; background: var(--card); border-radius: 20px; margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .date-circ .n { font-family: 'Outfit'; font-size: 24px; font-weight: 800; color: var(--text); display: block; line-height: 1; }
        .date-circ .d { font-size: 10px; font-weight: 700; color: var(--sub); text-transform: uppercase; }
        
        .item-pill { 
            height: 45px; border-radius: 14px; border: 1px solid var(--surface); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: var(--bg); color: var(--sub); font-size: 10px; font-weight: 800; text-transform: uppercase;
        }
        .item-pill.active { background: var(--p); border-color: var(--p); color: white; }
        
        /* Edit Rates Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card); width: 100%; max-width: 400px; padding: 25px; border-radius: 24px; }
        .modal-content input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; font-family: inherit; font-size: 16px; font-weight: 600; }
        .modal-content label { display: block; font-size: 11px; font-weight: 800; color: var(--sub); text-transform: uppercase; margin-bottom: 8px; }
        .btn-save { background: var(--p); color: white; width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 800; font-size: 15px; cursor: pointer; }

        #pdf-render-zone { display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">VetTrack<span style="color:var(--text)">Admin</span></div>
        <button class="lang-btn" onclick="toggleLang()" id="langToggle">ENG / हिंदी</button>
    </nav>

    <div class="container">
        <div class="stat-card">
            <div>
                <div class="stat-label" id="t-total-diners">Active Diners</div>
                <div class="stat-val" id="totalUsersCount">0</div>
            </div>
            <div style="font-size: 40px; opacity: 0.5;">👨‍🍳</div>
        </div>

        <div class="section-title" id="t-list-title">Registered Users</div>
        <div id="usersList">
            <div style="text-align:center; padding: 40px; color: var(--sub); font-weight: 600;" id="t-loading">Loading users from Firebase...</div>
        </div>
    </div>

    <div class="sheet-overlay" id="userSheetOverlay" onclick="closeUserSheet()">
        <div class="sheet" id="userSheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <div class="sheet-title" id="sheetUserName">User Name</div>
                <button class="close-btn" onclick="closeUserSheet()">✕</button>
            </div>
            
            <div class="sheet-content">
                <div class="actions-grid">
                    <button class="btn-action btn-bill" onclick="generateBill()"><i>📄</i> <span class="t-gen-bill">Generate Bill</span></button>
                    <button class="btn-action btn-edit" onclick="openRatesModal()"><i>💰</i> <span class="t-edit-rates">Edit Rates</span></button>
                    <button class="btn-action btn-warn" onclick="forceLogout()"><i>🔒</i> <span class="t-force-out">Force Logout</span></button>
                    <button class="btn-action btn-danger" onclick="deleteUser()"><i>🗑️</i> <span class="t-delete">Delete User</span></button>
                </div>

                <div class="section-title" id="t-logs-title">Eating Layout</div>
                
                <div class="nav-pill">
                    <button onclick="changeMonth(-1)">‹</button>
                    <span id="monthLabel">Month</span>
                    <button onclick="changeMonth(1)">›</button>
                </div>

                <div id="logsGrid"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="ratesModal" onclick="closeRatesModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="margin-bottom: 20px; font-family:'Outfit';" class="t-edit-rates">Edit Rates</h3>
            <label class="t-meal-rate">Meal Rate (₹)</label>
            <input type="number" id="inpMealPrice">
            <label class="t-water-rate">Water Rate (₹)</label>
            <input type="number" id="inpWaterPrice">
            <button class="btn-save" onclick="saveRates()" class="t-save">Save Changes</button>
        </div>
    </div>

    <div id="pdf-render-zone"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Reusing the configuration from your user app
    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", 
        messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let usersData = [];
    let selectedUser = null;
    let selectedLogs = {};
    let viewDate = new Date();
    let logsUnsubscribe = null;

    // --- MULTILINGUAL DICTIONARY ---
    let lang = 'en';
    const dict = {
        en: {
            totalDiners: "Active Diners", listTitle: "Registered Users", loading: "Loading users...",
            genBill: "Generate Bill", editRates: "Edit Rates", forceOut: "Force Logout", del: "Delete User",
            logsTitle: "Eating Layout (Read-Only)", mealRate: "Meal Rate (₹)", waterRate: "Water Rate (₹)", save: "Save Changes",
            billTitle: "Official Mess Bill", genBy: "Admin Portal Generation", confirmDel: "Are you sure you want to permanently delete this user?"
        },
        hi: {
            totalDiners: "सक्रिय भोजनकर्ता", listTitle: "पंजीकृत ग्राहक", loading: "ग्राहक लोड हो रहे हैं...",
            genBill: "बिल बनाएं", editRates: "दर बदलें", forceOut: "लॉगआउट करें", del: "ग्राहक हटाएं",
            logsTitle: "भोजन विवरण (केवल देखने के लिए)", mealRate: "भोजन दर (₹)", waterRate: "पानी दर (₹)", save: "सेव करें",
            billTitle: "आधिकारिक मेस बिल", genBy: "एडमिन द्वारा जनरेट किया गया", confirmDel: "क्या आप वाकई इस ग्राहक को स्थायी रूप से हटाना चाहते हैं?"
        }
    };

    window.toggleLang = () => {
        lang = lang === 'en' ? 'hi' : 'en';
        applyLang(); renderUsers();
    };

    function applyLang() {
        document.getElementById('t-total-diners').innerText = dict[lang].totalDiners;
        document.getElementById('t-list-title').innerText = dict[lang].listTitle;
        document.getElementById('t-loading') && (document.getElementById('t-loading').innerText = dict[lang].loading);
        document.getElementById('t-logs-title').innerText = dict[lang].logsTitle;
        document.querySelectorAll('.t-gen-bill').forEach(e => e.innerText = dict[lang].genBill);
        document.querySelectorAll('.t-edit-rates').forEach(e => e.innerText = dict[lang].editRates);
        document.querySelectorAll('.t-force-out').forEach(e => e.innerText = dict[lang].forceOut);
        document.querySelectorAll('.t-delete').forEach(e => e.innerText = dict[lang].del);
        document.querySelectorAll('.t-meal-rate').forEach(e => e.innerText = dict[lang].mealRate);
        document.querySelectorAll('.t-water-rate').forEach(e => e.innerText = dict[lang].waterRate);
    }

    // --- FIREBASE DATA FETCHING ---
    onSnapshot(collection(db, "users"), (snapshot) => {
        usersData = [];
        snapshot.forEach((doc) => {
            const data = doc.data();
            if (!data.deleted) { // Hide deleted users
                usersData.push({ uid: doc.id, ...data });
            }
        });
        document.getElementById('totalUsersCount').innerText = usersData.length;
        renderUsers();
    });

    function renderUsers() {
        const list = document.getElementById('usersList');
        list.innerHTML = '';
        usersData.forEach(u => {
            const card = document.createElement('div');
            card.className = 'user-card';
            card.onclick = () => openUserSheet(u);
            card.innerHTML = `
                <div class="user-info">
                    <h3>${u.name || 'Unnamed Diner'}</h3>
                    <p>Meal: ₹${u.mealPrice || 0} • Water: ₹${u.waterPrice || 0}</p>
                </div>
                <div class="open-icon">›</div>
            `;
            list.appendChild(card);
        });
    }

    // --- USER DETAIL SHEET & LOGS ---
    window.openUserSheet = (user) => {
        selectedUser = user;
        viewDate = new Date();
        document.getElementById('sheetUserName').innerText = user.name;
        document.getElementById('userSheetOverlay').style.display = 'flex';
        setTimeout(() => document.getElementById('userSheet').classList.add('up'), 10);
        fetchLogs();
    };

    window.closeUserSheet = () => {
        document.getElementById('userSheet').classList.remove('up');
        setTimeout(() => document.getElementById('userSheetOverlay').style.display = 'none', 400);
        if(logsUnsubscribe) logsUnsubscribe();
    };

    window.changeMonth = (dir) => { 
        viewDate.setMonth(viewDate.getMonth() + dir); 
        fetchLogs(); 
    };

    function fetchLogs() {
        if(logsUnsubscribe) logsUnsubscribe();
        document.getElementById('monthLabel').innerText = viewDate.toLocaleDateString(lang === 'en'?'en-IN':'hi-IN', { month: 'long', year: 'numeric' });
        
        const docRef = doc(db, "users", selectedUser.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`);
        logsUnsubscribe = onSnapshot(docRef, (d) => {
            selectedLogs = d.exists() ? d.data() : {};
            renderLogsGrid();
        });
    }

    function renderLogsGrid() {
        const grid = document.getElementById('logsGrid');
        grid.innerHTML = '';
        const daysCount = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();

        for (let i = 1; i <= daysCount; i++) {
            const d = selectedLogs[i] || { l: 0, d: 0, w: 0, n: "" };
            const dayName = new Date(viewDate.getFullYear(), viewDate.getMonth(), i).toLocaleDateString(lang==='en'?'en-IN':'hi-IN',{weekday:'short'});
            
            const card = document.createElement('div');
            card.className = 'day-item';
            card.innerHTML = `
                <div class="date-circ"><span class="n">${i}</span><span class="d">${dayName}</span></div>
                <div class="item-pill ${d.l?'active':''}">L</div>
                <div class="item-pill ${d.d?'active':''}">D</div>
                <div class="item-pill ${d.w?'active':''}">W</div>
            `;
            grid.appendChild(card);
        }
    }

    // --- ADMIN ACTIONS ---
    window.openRatesModal = () => {
        document.getElementById('inpMealPrice').value = selectedUser.mealPrice || 0;
        document.getElementById('inpWaterPrice').value = selectedUser.waterPrice || 0;
        document.getElementById('ratesModal').style.display = 'flex';
    };
    
    window.closeRatesModal = () => document.getElementById('ratesModal').style.display = 'none';

    window.saveRates = async () => {
        const newMeal = parseInt(document.getElementById('inpMealPrice').value);
        const newWater = parseInt(document.getElementById('inpWaterPrice').value);
        await updateDoc(doc(db, "users", selectedUser.uid), { mealPrice: newMeal, waterPrice: newWater });
        selectedUser.mealPrice = newMeal; selectedUser.waterPrice = newWater;
        closeRatesModal(); renderUsers();
    };

    window.forceLogout = async () => {
        // Appends a flag that the user app should listen to for forcing a signOut()
        await updateDoc(doc(db, "users", selectedUser.uid), { forceLogout: true });
        alert(lang === 'en' ? "Logout signal sent to user device." : "उपयोगकर्ता डिवाइस पर लॉगआउट सिग्नल भेजा गया।");
    };

    window.deleteUser = async () => {
        if(confirm(dict[lang].confirmDel)) {
            // Soft delete to prevent orphaned data crashes, user app auth rules should block access if deleted=true
            await updateDoc(doc(db, "users", selectedUser.uid), { deleted: true, forceLogout: true });
            closeUserSheet();
        }
    };

    // --- ADMIN PDF GENERATION ---
    window.generateBill = () => {
        let mCount = 0, wCount = 0;
        const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
        
        for (let i = 1; i <= daysInMonth; i++) {
            const d = selectedLogs[i];
            if(d) { if(d.l) mCount++; if(d.d) mCount++; if(d.w) wCount++; }
        }

        const mealTotal = mCount * (selectedUser.mealPrice || 0);
        const waterTotal = wCount * (selectedUser.waterPrice || 0);
        const grandTotal = mealTotal + waterTotal;

        const now = new Date();
        const dateStr = now.toLocaleDateString('en-IN');
        const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        const monthName = viewDate.toLocaleDateString(lang==='en'?'en-IN':'hi-IN', { month: 'long', year: 'numeric' });

        let htmlContent = `
            <div style="font-family:'Plus Jakarta Sans', sans-serif; background:#fff; color:#000; padding:40px; width:800px; box-sizing:border-box; border: 2px solid #000;">
                <div style="text-align:center; border-bottom:3px solid #000; padding-bottom:20px; margin-bottom:30px;">
                    <h1 style="margin:0; font-family:'Outfit'; font-size:38px; text-transform:uppercase;">${dict[lang].billTitle}</h1>
                    <h2 style="margin:10px 0 0 0; font-size:22px; color:#444;">${monthName}</h2>
                </div>
                
                <div style="display:flex; justify-content:space-between; margin-bottom:40px; font-size:18px;">
                    <div>
                        <p style="margin:5px 0;"><strong>Name:</strong> ${selectedUser.name}</p>
                        <p style="margin:5px 0;"><strong>Meals (${mCount}):</strong> ${mCount} x ₹${selectedUser.mealPrice} = ₹${mealTotal}</p>
                        <p style="margin:5px 0;"><strong>Water (${wCount}):</strong> ${wCount} x ₹${selectedUser.waterPrice} = ₹${waterTotal}</p>
                    </div>
                    <div style="text-align:right;">
                        <p style="margin:5px 0;"><strong>Gen Date:</strong> ${dateStr}</p>
                        <p style="margin:5px 0;"><strong>Gen Time:</strong> ${timeStr}</p>
                        <p style="margin:5px 0; color:#555;"><em>${dict[lang].genBy}</em></p>
                    </div>
                </div>

                <div style="background:#f1f5f9; padding:30px; border: 2px dashed #000; text-align:center; margin-bottom: 40px;">
                    <h3 style="margin:0; font-size:20px; text-transform:uppercase; color:#64748b;">Grand Total</h3>
                    <h1 style="margin:10px 0 0 0; font-family:'Outfit'; font-size:55px;">₹${grandTotal.toLocaleString('en-IN')}</h1>
                </div>
            </div>
        `;

        const renderZone = document.getElementById('pdf-render-zone');
        renderZone.innerHTML = htmlContent;

        const opt = {
            margin:       0.2,
            filename:     `Admin_Bill_${selectedUser.name.replace(" ", "_")}_${monthName.replace(" ", "_")}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(renderZone.firstElementChild).save().then(() => {
            renderZone.innerHTML = '';
        });
    }

    applyLang();
</script>
</body>
</html>

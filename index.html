<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Offline Attendance Node</title>
    <style>
        :root {
            --bg-canvas: #090d16;
            --surface: #111827;
            --border: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --brand: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            padding: 36px;
            text-align: center;
        }

        .header h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
        .header p { font-size: 13px; color: var(--text-secondary); margin-bottom: 28px; }

        .status-pill {
            display: inline-flex;
            align-items: center;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            margin-bottom: 28px;
            transition: all 0.3s ease;
        }

        .status-pill.syncing { color: var(--brand); }
        .status-pill.active { color: var(--success); }
        .status-pill.isolated { color: var(--danger); }

        .metric-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .progress-track {
            background-color: #1f2937;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--brand);
            transition: width 0.3s linear;
        }

        #attendanceBar { background-color: var(--success); }

        .console {
            font-family: monospace;
            font-size: 11px;
            color: #6b7280;
            text-align: left;
            max-height: 85px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 16px;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Offline Attendance</h1>
            <p>Isolated Edge Verification Node</p>
        </div>

        <div class="status-container">
            <div id="statusBadge" class="status-pill syncing">Initializing Database...</div>
        </div>

        <div class="metric-container">
            <div class="metric-row"><span>Timeline Horizon</span><span id="timeVal">0%</span></div>
            <div class="progress-track"><div id="timeBar" class="progress-bar"></div></div>
        </div>

        <div class="metric-container">
            <div class="metric-row"><span>Attendance Progress</span><span id="attendanceVal">0%</span></div>
            <div class="progress-track"><div id="attendanceBar" class="progress-bar"></div></div>
        </div>

        <div id="consoleLog" class="console">Booting encrypted storage engine...</div>
    </div>

    <script>
        (function() {
            'use strict';

            // Targeted Verification Parameters
            const CONFIG = Object.freeze({
                TARGET_LAT: 24.507607,
                TARGET_LNG: 81.298394,
                ALLOWED_RADIUS_M: 65,
                MAX_GPS_ACCURACY_M: 40,
                SESSION_TOTAL_SEC: 3600, // 1 Hour session
                DB_NAME: "OfflineAttendanceDB",
                DB_VERSION: 1
            });

            // Scoped state locked away from global window execution context
            let state = {
                elapsed: 0,
                verified: 0,
                isInside: false,
                compromised: false,
                db: null,
                lastPulse: 0
            };

            const DOM = Object.freeze({
                badge: document.getElementById('statusBadge'),
                timeBar: document.getElementById('timeBar'),
                timeVal: document.getElementById('timeVal'),
                attBar: document.getElementById('attendanceBar'),
                attVal: document.getElementById('attendanceVal'),
                console: document.getElementById('consoleLog')
            });

            function pushLog(text) {
                DOM.console.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            }

            // High-Precision Distance Logic
            function geoMath(lat1, lon1, lat2, lon2) {
                const R = 6371e3;
                const p1 = lat1 * Math.PI / 180;
                const p2 = lat2 * Math.PI / 180;
                const dPhi = (lat2 - lat1) * Math.PI / 180;
                const dLam = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dPhi/2) * Math.sin(dPhi/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dLam/2) * Math.sin(dLam/2);
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            }

            // Local Database Controller Implementation
            function initDatabase() {
                const request = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);

                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("logs")) {
                        db.createObjectStore("logs", { keyPath: "timestamp" });
                    }
                    if (!db.objectStoreNames.contains("state")) {
                        db.createObjectStore("state", { keyPath: "parameter" });
                    }
                };

                request.onsuccess = function(e) {
                    state.db = e.target.result;
                    pushLog("IndexedDB connected securely.");
                    restoreSession();
                };

                request.onerror = function() {
                    isolateTerminal("Database initialization failed.");
                };
            }

            function saveTelemetryRow(lat, lng, accuracy, insideStatus) {
                if (!state.db) return;
                const transaction = state.db.transaction(["logs", "state"], "readwrite");
                
                const logStore = transaction.objectStore("logs");
                const stateStore = transaction.objectStore("state");

                logStore.put({
                    timestamp: Date.now(),
                    latitude: lat,
                    longitude: lng,
                    accuracy: accuracy,
                    status: insideStatus
                });

                stateStore.put({ parameter: "elapsed", value: state.elapsed });
                stateStore.put({ parameter: "verified", value: state.verified });
            }

            function restoreSession() {
                const transaction = state.db.transaction(["state"], "readonly");
                const store = transaction.objectStore("state");
                
                const getElapsed = store.get("elapsed");
                getElapsed.onsuccess = function() {
                    if (getElapsed.result) state.elapsed = getElapsed.result.value;
                    
                    const getVerified = store.get("verified");
                    getVerified.onsuccess = function() {
                        if (getVerified.result) state.verified = getVerified.result.value;
                        
                        // Synchronize view parameters post-restoration
                        updateUI();
                        startEngine();
                    };
                };
            }

            // Real-Time Background Synchronization Clock
            function clockTickEngine() {
                if (state.compromised) return;

                if (state.elapsed >= CONFIG.SESSION_TOTAL_SEC) {
                    DOM.badge.textContent = "Session Complete";
                    DOM.badge.className = "status-pill active";
                    pushLog("Session tracking boundary finalized successfully.");
                    return;
                }

                state.elapsed++;
                
                if (state.isInside) {
                    state.verified++;
                }

                updateUI();
            }

            function updateUI() {
                const timePercent = (state.elapsed / CONFIG.SESSION_TOTAL_SEC) * 100;
                DOM.timeBar.style.width = `${timePercent}%`;
                DOM.timeVal.textContent = `${Math.floor(timePercent)}%`;

                const attPercent = (state.verified / CONFIG.SESSION_TOTAL_SEC) * 100;
                DOM.attBar.style.width = `${attPercent}%`;
                DOM.attVal.textContent = `${Math.floor(attPercent)}%`;
            }

            // Telemetry Processor Loop
            function processLocationStream(position) {
                if (state.compromised) return;

                // Anti-Spoof: Intercept browser-level virtual mock flags
                if (!position || !position.coords || position.mocked === true) {
                    isolateTerminal("Hardware level mock signature detected.");
                    return;
                }

                const uLat = position.coords.latitude;
                const uLng = position.coords.longitude;
                const uAcc = position.coords.accuracy;

                // Anti-Spoof: Filter weak/simulated desktop network configurations
                if (uAcc > CONFIG.MAX_GPS_ACCURACY_M) {
                    DOM.badge.textContent = "Signal Untrusted";
                    DOM.badge.className = "status-pill isolated";
                    state.isInside = false;
                    return;
                }

                const distance = geoMath(uLat, uLng, CONFIG.TARGET_LAT, CONFIG.TARGET_LNG);

                if (distance <= CONFIG.ALLOWED_RADIUS_M) {
                    DOM.badge.textContent = "Active Presence Verified";
                    DOM.badge.className = "status-pill active";
                    state.isInside = true;
                } else {
                    DOM.badge.textContent = "Outside Boundary Base";
                    DOM.badge.className = "status-pill isolated";
                    state.isInside = false;
                }

                saveTelemetryRow(uLat, uLng, uAcc, state.isInside);
            }

            function isolateTerminal(reason) {
                state.compromised = true;
                state.isInside = false;
                DOM.badge.textContent = "Security Isolation";
                DOM.badge.className = "status-pill isolated";
                DOM.timeBar.style.backgroundColor = "var(--danger)";
                DOM.attBar.style.backgroundColor = "var(--danger)";
                pushLog(`CRITICAL: ${reason}`);
            }

            function startEngine() {
                pushLog("Tracking connection hooks listening...");
                navigator.geolocation.watchPosition(processLocationStream, () => {
                    DOM.badge.textContent = "Telemetry Link Lost";
                    DOM.badge.className = "status-pill isolated";
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 0
                });

                setInterval(clockTickEngine, 1000);
            }

            // Execution Gateway Entry
            if (navigator.geolocation && ('indexedDB' in window)) {
                initDatabase();
            } else {
                DOM.badge.textContent = "Hardware Rejection";
                pushLog("Device missing localized tracking database interfaces.");
            }
        })();
    </script>
</body>
</html>

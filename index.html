<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VetTrack | Zen</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #FFB800; --p-soft: rgba(255, 184, 0, 0.1);
            --bg: #0A0C10; --card: rgba(25, 28, 35, 0.7); --border: rgba(255, 255, 255, 0.08);
            --text: #FFFFFF; --sub: #8E9196;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding-bottom: 60px; padding-top: env(safe-area-inset-top);
        }

        .container { max-width: 440px; margin: 0 auto; padding: 20px; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 35px 0; }
        #greetLabel { font-size: 11px; color: var(--sub); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; }
        #userLabel { font-family: 'Outfit'; font-size: 30px; margin: 0; font-weight: 800; letter-spacing: -0.5px; }
        .pfp-wrap { width: 52px; height: 52px; border-radius: 50%; padding: 2px; background: linear-gradient(180deg, var(--border), transparent); border: 1px solid var(--border); }
        .pfp { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; cursor: pointer; }

        /* STAT CARD (The Main View) */
        .stat-card {
            background: linear-gradient(145deg, #1A1D23 0%, #111419 100%);
            padding: 28px; border-radius: 32px; margin-bottom: 30px;
            border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex; justify-content: space-between; align-items: center;
        }
        .label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--sub); }
        .total-val { font-family: 'Outfit'; font-size: 42px; font-weight: 800; margin: 4px 0; color: var(--p); letter-spacing: -1px; }
        
        .quick-log-btn {
            background: var(--p-soft); border: 1px solid rgba(255,184,0,0.2);
            color: var(--p); padding: 12px 18px; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center;
            font-weight: 700; font-size: 10px; cursor: pointer; transition: 0.3s;
        }
        .quick-log-btn.done { background: var(--p); color: #000; border-color: var(--p); }
        .quick-log-btn i { font-style: normal; font-size: 18px; margin-bottom: 2px; }

        /* NAV PILL */
        .nav-pill { 
            display: flex; align-items: center; background: var(--card); padding: 6px; 
            border-radius: 50px; border: 1px solid var(--border); margin-bottom: 25px;
        }
        .nav-pill button { border: none; background: transparent; color: white; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        .nav-pill span { flex: 1; text-align: center; font-weight: 700; font-size: 14px; color: var(--text); }

        /* DAY ITEMS */
        .day-item { 
            display: grid; grid-template-columns: 55px 1fr 1fr 1fr; gap: 12px; align-items: center; 
            padding: 16px; background: var(--card); border-radius: 24px; margin-bottom: 12px;
            border: 1px solid var(--border); transition: 0.2s;
        }
        .day-item.is-today { border-color: rgba(255,184,0,0.3); background: rgba(255,184,0,0.02); }
        
        .date-circ { text-align: center; border-right: 1px solid var(--border); }
        .date-circ .n { font-family: 'Outfit'; font-size: 22px; font-weight: 700; color: white; display: block; }
        .date-circ .d { font-size: 9px; font-weight: 600; color: var(--sub); text-transform: uppercase; }

        .item-pill { 
            height: 52px; border-radius: 18px; border: 1px solid var(--border); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(255,255,255,0.02); cursor: pointer; transition: 0.2s;
        }
        .item-pill.active { background: white; border-color: white; color: black; font-weight: 800; }
        .item-pill span { font-size: 9px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }

        /* MODALS / SHEETS */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2000; display: none; align-items: flex-end; }
        .sheet { background: #121418; width: 100%; border-radius: 32px 32px 0 0; padding: 35px; border-top: 1px solid var(--border); transform: translateY(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .sheet.up { transform: translateY(0); }
        .sheet h2 { font-family: 'Outfit'; font-size: 26px; margin: 0 0 25px 0; }
        
        .form-group label { display: block; font-size: 10px; font-weight: 800; color: var(--sub); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input, textarea { width: 100%; padding: 16px; background: #1A1D23; border: 1px solid var(--border); border-radius: 16px; color: white; font-size: 16px; margin-bottom: 20px; font-family: inherit; }
        
        .btn-prime { background: var(--p); color: black; padding: 18px; border-radius: 20px; border: none; font-weight: 800; width: 100%; cursor: pointer; font-size: 15px; }
        .note-tag { grid-column: 1 / -1; font-size: 12px; color: var(--sub); background: rgba(255,255,255,0.03); padding: 8px 14px; border-radius: 12px; margin-top: 8px; border: 1px solid var(--border); }

        #welcomeScreen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="welcomeScreen">
    <h1 style="font-family:'Outfit'; font-size:42px; font-weight:900; letter-spacing:-2px;">VetTrack<span style="color:var(--p)">.</span></h1>
    <button class="btn-prime" onclick="login()" style="width: 200px; margin-top: 20px;">Enter</button>
</div>

<div class="sheet-overlay" id="settingsOverlay" onclick="closeSettings()">
    <div class="sheet" id="settingsSheet" onclick="event.stopPropagation()">
        <h2>Preferences</h2>
        <div class="form-group"><label>Display Name</label><input type="text" id="setUserName"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group"><label>Meal Rate</label><input type="number" id="setMealPrice"></div>
            <div class="form-group"><label>Water Rate</label><input type="number" id="setWaterPrice"></div>
        </div>
        <button class="btn-prime" onclick="saveSettings()">Update Profile</button>
        <button onclick="logout()" style="background:none; border:none; color:var(--sub); width:100%; margin-top:20px; font-size:12px; font-weight:700;">LOGOUT</button>
    </div>
</div>

<div class="sheet-overlay" id="noteOverlay" onclick="closeNote()">
    <div class="sheet" id="noteSheet" onclick="event.stopPropagation()">
        <h2 id="noteTitle">Notes</h2>
        <textarea id="noteInput" rows="3" placeholder="Extra guests, details..."></textarea>
        <button class="btn-prime" onclick="saveNote()">Confirm Note</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <div><p id="greetLabel">...</p><h1 id="userLabel">Diner</h1></div>
        <div class="pfp-wrap"><img id="userPfp" class="pfp" onclick="openSettings()"></div>
    </div>

    <div class="stat-card">
        <div><div class="label">Balance Due</div><div class="total-val" id="totalValue">₹0</div><div id="statsSub" style="font-size:11px; color:var(--sub); font-weight:600;">...</div></div>
        <div id="quickBtn" class="quick-log-btn" onclick="quickLog()"><i id="quickIcon">⚡</i><span id="quickText">Mark</span></div>
    </div>

    <div class="nav-pill">
        <button onclick="changeMonth(-1)">‹</button><span id="monthLabel">...</span><button onclick="changeMonth(1)">›</button>
    </div>

    <div id="logsGrid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", 
        messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" 
    };

    const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app), provider = new GoogleAuthProvider();
    let user = null, logs = {}, viewDate = new Date(), todayDate = new Date(), activeDayId = null;
    let config = { name: "", mealPrice: 50, waterPrice: 30 };

    window.login = () => setPersistence(auth, browserLocalPersistence).then(() => signInWithPopup(auth, provider));
    window.logout = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, async (u) => {
        if (u) { 
            user = u; document.getElementById('welcomeScreen').style.display = 'none'; 
            document.getElementById('userPfp').src = u.photoURL;
            const userDoc = await getDoc(doc(db, "users", u.uid));
            if (userDoc.exists()) config = { ...config, ...userDoc.data() };
            else { config.name = u.displayName; await setDoc(doc(db, "users", u.uid), config); }
            document.getElementById('userLabel').innerText = config.name;
            updateGreet(); syncData(); 
        } else { document.getElementById('welcomeScreen').style.display = 'flex'; }
    });

    function updateGreet() {
        const h = new Date().getHours();
        document.getElementById('greetLabel').innerText = h < 12 ? "Good Morning" : h < 17 ? "Good Afternoon" : "Good Evening";
    }

    function updateQuickBtn() {
        const day = todayDate.getDate();
        const type = todayDate.getHours() < 16 ? 'l' : 'd';
        const isMarked = logs[day] && logs[day][type] === 1;
        const btn = document.getElementById('quickBtn'), icon = document.getElementById('quickIcon'), text = document.getElementById('quickText');
        if (isMarked) { btn.classList.add('done'); icon.innerText = '✓'; text.innerText = 'Marked'; } 
        else { btn.classList.remove('done'); icon.innerText = '⚡'; text.innerText = `Log ${type==='l'?'Lunch':'Dinner'}`; }
    }

    function syncData() {
        onSnapshot(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), (d) => {
            logs = d.data() || {}; renderGrid(); updateQuickBtn();
        });
    }

    window.quickLog = async () => {
        const day = todayDate.getDate(), type = todayDate.getHours() < 16 ? 'l' : 'd';
        const obj = logs[day] || { l: 0, d: 0, w: 0, n: "" };
        if(obj[type] === 1) return;
        obj[type] = 1;
        await setDoc(doc(db, "users", user.uid, "logs", `${todayDate.getFullYear()}_${todayDate.getMonth()}`), { [day]: obj }, { merge: true });
    };

    function renderGrid() {
        const isCurrent = viewDate.getMonth() === todayDate.getMonth() && viewDate.getFullYear() === todayDate.getFullYear();
        document.getElementById('monthLabel').innerText = viewDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        const grid = document.getElementById('logsGrid'); grid.innerHTML = '';
        const daysCount = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();

        for (let i = 1; i <= daysCount; i++) {
            const d = logs[i] || { l: 0, d: 0, w: 0, n: "" };
            const card = document.createElement('div');
            card.className = `day-item ${isCurrent && i === todayDate.getDate() ? 'is-today' : ''}`;
            let timer;
            card.onmousedown = card.ontouchstart = () => timer = setTimeout(() => openNote(i), 600);
            card.onmouseup = card.ontouchend = () => clearTimeout(timer);

            card.innerHTML = `
                <div class="date-circ"><span class="n">${i}</span><span class="d">${new Date(viewDate.getFullYear(), viewDate.getMonth(), i).toLocaleDateString('en-IN',{weekday:'short'})}</span></div>
                <div class="item-pill ${d.l?'active':''}" onclick="toggle(${i},'l')"><span>Lunch</span></div>
                <div class="item-pill ${d.d?'active':''}" onclick="toggle(${i},'d')"><span>Dinner</span></div>
                <div class="item-pill ${d.w?'active':''}" onclick="toggle(${i},'w')"><span>Water</span></div>
                ${d.n ? `<div class="note-tag">${d.n}</div>` : ''}
            `;
            grid.appendChild(card);
        }
        calculate();
    }

    window.toggle = async (day, type) => {
        const obj = logs[day] || { l: 0, d: 0, w: 0, n: "" };
        obj[type] = obj[type] ? 0 : 1;
        await setDoc(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), { [day]: obj }, { merge: true });
    };

    window.openNote = (day) => {
        activeDayId = day; document.getElementById('noteTitle').innerText = `Day ${day} Detail`;
        document.getElementById('noteInput').value = logs[day]?.n || "";
        document.getElementById('noteOverlay').style.display = 'flex';
        setTimeout(() => document.getElementById('noteSheet').classList.add('up'), 10);
    };
    window.closeNote = () => { document.getElementById('noteSheet').classList.remove('up'); setTimeout(() => document.getElementById('noteOverlay').style.display = 'none', 400); };
    window.saveNote = async () => {
        const obj = logs[activeDayId] || { l: 0, d: 0, w: 0, n: "" };
        obj.n = document.getElementById('noteInput').value;
        await setDoc(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), { [activeDayId]: obj }, { merge: true });
        closeNote();
    };

    window.openSettings = () => {
        document.getElementById('setUserName').value = config.name;
        document.getElementById('setMealPrice').value = config.mealPrice;
        document.getElementById('setWaterPrice').value = config.waterPrice;
        document.getElementById('settingsOverlay').style.display = 'flex';
        setTimeout(() => document.getElementById('settingsSheet').classList.add('up'), 10);
    };
    window.closeSettings = () => { document.getElementById('settingsSheet').classList.remove('up'); setTimeout(() => document.getElementById('settingsOverlay').style.display = 'none', 400); };
    window.saveSettings = async () => {
        config.name = document.getElementById('setUserName').value;
        config.mealPrice = parseInt(document.getElementById('setMealPrice').value);
        config.waterPrice = parseInt(document.getElementById('setWaterPrice').value);
        await setDoc(doc(db, "users", user.uid), config, { merge: true });
        document.getElementById('userLabel').innerText = config.name;
        calculate(); closeSettings();
    };

    function calculate() {
        let m=0, w=0; Object.values(logs).forEach(v => { if(v.l) m++; if(v.d) m++; if(v.w) w++; });
        document.getElementById('totalValue').innerText = `₹${(m * config.mealPrice + w * config.waterPrice).toLocaleString('en-IN')}`;
        document.getElementById('statsSub').innerText = `${m} Meals · ${w} Water Units`;
    }

    window.changeMonth = (dir) => { viewDate.setMonth(viewDate.getMonth() + dir); syncData(); };
</script>
</body>
</html>

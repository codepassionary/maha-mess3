<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Attendance</title>
    <script src="face-api.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #4f46e5; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 2rem; border-radius: 20px; width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        video { width: 100%; border-radius: 12px; background: #000; transform: scaleX(-1); margin-bottom: 1rem; }
        button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; background: var(--accent); color: white; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="card">
    <video id="video" autoplay muted playsinline></video>
    <button id="btnInit" onclick="initApp()">Initialize System</button>
    <button id="btnReg" onclick="register()" disabled>Register Face</button>
    <button id="btnMark" onclick="mark()" disabled>Mark Attendance</button>
    <div id="status">Click "Initialize" to begin.</div>
</div>

<script>
    const video = document.getElementById('video'), status = document.getElementById('status');
    const TARGET = { lat: 24.507574, lon: 81.298351 };

    async function initApp() {
        try {
            status.innerText = "Loading AI models...";
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri('/models'),
                faceapi.nets.faceLandmark68Net.loadFromUri('/models'),
                faceapi.nets.faceRecognitionNet.loadFromUri('/models')
            ]);
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            document.querySelectorAll('button').forEach(b => b.disabled = false);
            status.innerText = "System Ready.";
        } catch (e) { status.innerText = "Error: Camera/Location access required."; }
    }

    async function register() {
        const det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
        if(!det) return status.innerText = "Error: No face detected.";
        localStorage.setItem('userFace', JSON.stringify(Array.from(det.descriptor)));
        status.innerText = "Registration complete!";
    }

    async function mark() {
        status.innerText = "Verifying location and identity...";
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const dist = Math.sqrt((pos.coords.latitude - TARGET.lat)**2 + (pos.coords.longitude - TARGET.lon)**2) * 111000;
            if(dist > 20) return status.innerText = `Out of range: ${Math.round(dist)}m.`;
            
            const det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
            const saved = localStorage.getItem('userFace');
            if(!det || !saved) return status.innerText = "Error: Please register first.";
            
            const matcher = new faceapi.FaceMatcher(new faceapi.LabeledFaceDescriptors('User', [new Float32Array(JSON.parse(saved))]));
            if(matcher.findBestMatch(det.descriptor).distance < 0.5) {
                status.innerText = "Attendance logged successfully.";
            } else status.innerText = "Identity mismatch!";
        }, () => status.innerText = "Location access denied.", { enableHighAccuracy: true });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VetTrack Luxe | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #FF8C00; --bg: #0B0F1A; --card: rgba(30, 41, 59, 0.7); 
            --surface: rgba(51, 65, 85, 0.5); --text: #FFFFFF; --sub: #94A3B8;
        }

        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: radial-gradient(circle at 100% 0%, #1e293b 0%, transparent 40%);
            background-attachment: fixed; padding: 25px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* Admin Header */
        .admin-header { margin-bottom: 40px; }
        .admin-header h1 { font-family: 'Outfit'; font-size: 42px; margin: 0; letter-spacing: -2px; }
        .admin-header p { color: var(--p); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; font-size: 12px; margin: 0; }

        /* Master Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-box { 
            background: var(--card); padding: 25px; border-radius: 30px; 
            border: 1px solid var(--surface); backdrop-filter: blur(10px);
        }
        .stat-box label { display: block; font-size: 11px; font-weight: 800; color: var(--sub); text-transform: uppercase; margin-bottom: 8px; }
        .stat-box .val { font-family: 'Outfit'; font-size: 32px; font-weight: 800; color: var(--p); }

        /* Student List */
        .search-bar { 
            width: 100%; padding: 18px 25px; background: var(--card); border: 1px solid var(--surface);
            border-radius: 20px; color: white; margin-bottom: 25px; font-family: inherit;
        }

        .student-card {
            background: var(--card); border-radius: 25px; padding: 20px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--surface); transition: 0.3s;
        }
        .student-card:hover { border-color: var(--p); transform: translateY(-2px); }
        
        .student-info { display: flex; align-items: center; gap: 15px; }
        .student-info img { width: 45px; height: 45px; border-radius: 12px; border: 1px solid var(--p); }
        .student-info .name { font-weight: 700; font-size: 16px; display: block; }
        .student-info .meta { font-size: 12px; color: var(--sub); }

        .student-bill { text-align: right; }
        .student-bill .amt { font-family: 'Outfit'; font-size: 20px; font-weight: 800; color: #fff; }
        .student-bill .breakdown { font-size: 10px; color: var(--p); font-weight: 800; text-transform: uppercase; }

        .nav-pill { 
            display: flex; align-items: center; background: var(--card); padding: 8px; 
            border-radius: 24px; border: 1px solid var(--surface); margin-bottom: 25px;
        }
        .nav-pill button { border: none; background: var(--surface); color: white; width: 42px; height: 42px; border-radius: 16px; cursor: pointer; }
        .nav-pill span { flex: 1; text-align: center; font-weight: 800; }

        #loader { text-align: center; color: var(--p); font-weight: 800; padding: 50px; }
    </style>
</head>
<body>

<div class="container">
    <header class="admin-header">
        <p>Command Center</p>
        <h1>Luxe Admin Panel</h1>
    </header>

    <div class="nav-pill">
        <button onclick="changeMonth(-1)">‹</button>
        <span id="monthLabel">Current Month</span>
        <button onclick="changeMonth(1)">›</button>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <label>Collection Target</label>
            <div class="val" id="totalCollection">₹0</div>
        </div>
        <div class="stat-box">
            <label>Total Active Diners</label>
            <div class="val" id="totalDiners">0</div>
        </div>
    </div>

    <input type="text" class="search-bar" placeholder="Search student by name..." oninput="filterStudents(this.value)">

    <div id="loader">Syncing Global Data...</div>
    <div id="studentList"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", 
        messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" 
    };

    const app = initializeApp(firebaseConfig), db = getFirestore(app);
    let allData = [], viewDate = new Date();

    async function fetchAllStudents() {
        document.getElementById('loader').style.display = 'block';
        document.getElementById('studentList').innerHTML = '';
        
        const monthKey = `${viewDate.getFullYear()}_${viewDate.getMonth()}`;
        document.getElementById('monthLabel').innerText = viewDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

        try {
            const usersSnap = await getDocs(collection(db, "users"));
            const studentPromises = usersSnap.docs.map(async (userDoc) => {
                const userData = userDoc.data();
                const logSnap = await getDoc(doc(db, "users", userDoc.id, "logs", monthKey));
                return {
                    id: userDoc.id,
                    name: userData.name || "Unknown User",
                    photo: userData.photo || "https://ui-avatars.com/api/?name=" + userData.name,
                    config: userData,
                    logs: logSnap.exists() ? logSnap.data() : {}
                };
            });

            allData = await Promise.all(studentPromises);
            renderList(allData);
        } catch (e) {
            console.error(e);
            document.getElementById('loader').innerText = "Error loading data. Check Firestore rules.";
        }
    }

    function renderList(students) {
        document.getElementById('loader').style.display = 'none';
        const list = document.getElementById('studentList');
        let globalTotal = 0;

        students.forEach(s => {
            let m=0, w=0;
            Object.values(s.logs).forEach(v => {
                if(v.l) m++; if(v.d) m++; if(v.w) w++;
            });

            const bill = (m * (s.config.mealPrice || 50)) + (w * (s.config.waterPrice || 30));
            globalTotal += bill;

            const card = document.createElement('div');
            card.className = 'student-card';
            card.innerHTML = `
                <div class="student-info">
                    <img src="${s.photo}" onerror="this.src='https://ui-avatars.com/api/?name=${s.name}'">
                    <div>
                        <span class="name">${s.name}</span>
                        <span class="meta">${m} Meals | ${w} Water</span>
                    </div>
                </div>
                <div class="student-bill">
                    <div class="amt">₹${bill.toLocaleString('en-IN')}</div>
                    <div class="breakdown">Pending</div>
                </div>
            `;
            list.appendChild(card);
        });

        document.getElementById('totalCollection').innerText = `₹${globalTotal.toLocaleString('en-IN')}`;
        document.getElementById('totalDiners').innerText = students.length;
    }

    window.filterStudents = (query) => {
        const filtered = allData.filter(s => s.name.toLowerCase().includes(query.toLowerCase()));
        document.getElementById('studentList').innerHTML = '';
        renderList(filtered);
    };

    window.changeMonth = (dir) => {
        viewDate.setMonth(viewDate.getMonth() + dir);
        fetchAllStudents();
    };

    // Initial Load
    fetchAllStudents();
</script>
</body>
</html>

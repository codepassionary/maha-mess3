<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Invitation | Shivam Miskare</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Plus+Jakarta+Sans:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --surface: #0a0b0e;
            --gold: #d4af37;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #fcf6ba 50%, #d4af37 100%);
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(212, 175, 55, 0.15);
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050608 100%);
        }

        .invitation-card {
            background: var(--surface);
            padding: 60px 50px;
            border-radius: 30px;
            width: 360px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 0 100px rgba(212,175,55,0.03);
            position: relative;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            margin-bottom: 10px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .subtitle { 
            color: var(--gold); 
            font-size: 0.7rem; 
            letter-spacing: 8px; 
            text-transform: uppercase; 
            margin-bottom: 50px; 
            opacity: 0.9;
        }

        .detail-group {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .label { 
            display: block; 
            font-size: 0.6rem; 
            color: #666; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-bottom: 10px; 
        }

        .value { 
            font-size: 1.1rem; 
            font-weight: 400; 
            color: #e2e8f0;
            letter-spacing: 0.5px;
        }

        .contribution-zone {
            background: rgba(212, 175, 55, 0.03);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-top: 20px;
        }

        .pay-number {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            margin: 15px 0;
            display: block;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(212,175,55,0.2);
        }

        .divider {
            height: 1px;
            width: 50px;
            background: var(--gold);
            margin: 0 auto 30px;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <h1>Shivam Miskare</h1>
        <div class="subtitle">Birthday Celebration</div>

        <div class="divider"></div>

        <div class="detail-group">
            <span class="label">Ceremony</span>
            <div class="value">Cake Cutting Celebration</div>
        </div>

        <div class="detail-group">
            <span class="label">Schedule & Location</span>
            <div class="value">30 May 2026 | 06:30 PM<br>Niranjan's House</div>
        </div>

        <div class="contribution-zone">
            <span class="label">Contribution to Vikram Dhakad</span>
            <div class="value" style="font-size: 0.9rem;">Please transfer ₹50 to:</div>
            <span class="pay-number">8103509439</span>
            <div style="font-size: 0.65rem; color: var(--gold); text-transform: uppercase; letter-spacing: 2px;">UPI Verified</div>
        </div>
    </div>

</body>
</html>

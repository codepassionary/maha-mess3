<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetTrack Luxe | Master Admin v2</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root { --p: #FF8C00; --bg: #0B0F1A; --card: rgba(30, 41, 59, 0.7); --surface: rgba(51, 65, 85, 0.5); --text: #FFFFFF; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid var(--surface); margin-bottom: 10px; }
        .user-card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid var(--surface); display: flex; justify-content: space-between; }
        
        /* Debug Console Style */
        #debugLog { 
            background: #000; color: #0f0; font-family: monospace; font-size: 11px; 
            padding: 10px; border-radius: 10px; height: 100px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #333;
        }
        .btn-sync { background: var(--p); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="font-family:'Outfit'; margin:0;">Admin Console</h1>
    <button class="btn-sync" onclick="startGlobalSync()">Force Sync</button>
</div>

<div id="debugLog">System Ready. Click Sync to fetch...</div>

<div class="stat-box">
    <div style="font-size: 12px; color: var(--p); font-weight: 800;">TOTAL REVENUE</div>
    <div id="revDisplay" style="font-size: 32px; font-family: 'Outfit';">₹0</div>
</div>

<div id="userList">
    <p style="color: #94A3B8; text-align: center;">No users loaded yet.</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", 
        authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function log(msg) {
        const d = document.getElementById('debugLog');
        d.innerHTML += `> ${msg}<br>`;
        d.scrollTop = d.scrollHeight;
    }

    window.startGlobalSync = async () => {
        try {
            log("Attempting to connect to 'users' collection...");
            const usersSnap = await getDocs(collection(db, "users"));
            
            if (usersSnap.empty) {
                log("WARN: 'users' collection is EMPTY in Firestore.");
                return;
            }

            log(`SUCCESS: Found ${usersSnap.size} users.`);
            let grandTotal = 0;
            const list = document.getElementById('userList');
            list.innerHTML = '';

            for (const userDoc of usersSnap.docs) {
                const u = userDoc.data();
                const uid = userDoc.id;
                log(`Fetching logs for: ${u.name || uid}...`);

                let userBill = 0;
                // Important: Using the exact path to sub-collection
                const logsSnap = await getDocs(collection(db, "users", uid, "logs"));
                
                logsSnap.forEach(lDoc => {
                    const monthData = lDoc.data();
                    Object.values(monthData).forEach(day => {
                        if (day.l) userBill += (u.mealPrice || 50);
                        if (day.d) userBill += (u.mealPrice || 50);
                        if (day.w) userBill += (u.waterPrice || 30);
                    });
                });

                grandTotal += userBill;

                const div = document.createElement('div');
                div.className = 'user-card';
                div.innerHTML = `
                    <div>
                        <strong style="display:block;">${u.name || 'Unknown'}</strong>
                        <small style="color:#94A3B8;">${uid.substring(0,10)}...</small>
                    </div>
                    <div style="text-align:right;">
                        <div style="color:var(--p); font-weight:800;">₹${userBill}</div>
                    </div>
                `;
                list.appendChild(div);
            }

            document.getElementById('revDisplay').innerText = `₹${grandTotal.toLocaleString()}`;
            log("Sync Complete.");

        } catch (err) {
            log(`ERROR: ${err.message}`);
            console.error(err);
        }
    };

    // Auto-start on load
    startGlobalSync();
</script>
</body>
</html>

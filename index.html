<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Air Canvas</title>
    
    <!-- MediaPipe and Camera Utils Links -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(31, 40, 51, 0.65);
            --text-color: #c5c6c7;
            --accent-color: #66fcf1;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* Fullscreen drawing canvas */
        #drawingCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* Mirrored webcam feed for intuitive drawing */
        #webcam {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--accent-color);
            transform: scaleX(-1); /* Mirror view */
            z-index: 3;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.3);
        }

        /* Control Panel with Glassmorphism Design */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 25px;
            border-radius: 50px;
            color: var(--text-color);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100px;
            background: rgba(255, 255, 255, 0.2);
            height: 6px;
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent-color);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Dynamic Status Indicator */
        #statusIndicator {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .status-draw { color: #00ff88; text-shadow: 0 0 8px #00ff88; }
        .status-erase { color: #ff3366; text-shadow: 0 0 8px #ff3366; }
        .status-pause { color: #ffbb00; text-shadow: 0 0 8px #ffbb00; }
        .status-loading { color: #e0e0e0; }
    </style>
</head>
<body>

    <!-- HUD Control Bar -->
    <div class="control-panel">
        <div class="control-group">
            <label for="colorPicker">Color</label>
            <input type="color" id="colorPicker" value="#66fcf1">
        </div>
        <div class="control-group">
            <label for="brushSize">Size</label>
            <input type="range" id="brushSize" min="4" max="40" value="12">
        </div>
        <div class="control-group">
            <label>Mode:</label>
            <span id="statusIndicator" class="status-loading">Initializing...</span>
        </div>
    </div>

    <!-- Interface Canvas & Hidden Video Feed -->
    <canvas id="drawingCanvas"></canvas>
    <video id="webcam" autoplay playsinline muted></video>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const videoElement = document.getElementById('webcam');
        const statusIndicator = document.getElementById('statusIndicator');
        const colorPicker = document.getElementById('colorPicker');
        const brushSizeSlider = document.getElementById('brushSize');

        let drawingColor = colorPicker.value;
        let brushSize = brushSizeSlider.value;
        let lastX = null;
        let lastY = null;
        let currentMode = 'pause'; // Default state until tracked

        // Handle live configurations
        colorPicker.addEventListener('input', (e) => drawingColor = e.target.value);
        brushSizeSlider.addEventListener('input', (e) => brushSize = e.target.value);

        // Adjust Canvas sizing on load/resize
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Background initialization
            ctx.fillStyle = '#0b0c10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Update UI Status Badge
        function updateStatus(mode) {
            if (currentMode !== mode) {
                currentMode = mode;
                statusIndicator.textContent = mode;
                statusIndicator.className = ''; // Reset
                statusIndicator.classList.add(`status-${mode}`);
            }
        }

        // Mathematical utility to calculate Euclidean distance between two coordinate nodes
        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) + Math.pow(p1.z - p2.z, 2));
        }

        // Gesture Processing Logic
        function analyzeGesture(landmarks) {
            // Landmark mappings
            const wrist = landmarks[0];
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const indexPip = landmarks[6];
            const middleTip = landmarks[12];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];

            // Base reference distance using hand scale size (wrist to base of middle finger)
            const handScale = getDistance(wrist, landmarks[9]);

            // Track if fingers are extended relative to the wrist distance threshold
            const isIndexExtended = indexTip.y < indexPip.y;
            const isMiddleExtended = middleTip.y < landmarks[10].y;
            const isRingExtended = ringTip.y < landmarks[14].y;
            const isPinkyExtended = pinkyTip.y < landmarks[18].y;

            // 1. OPEN PALM (Erase): All main structural fingers extended cleanly
            if (isIndexExtended && isMiddleExtended && isRingExtended && isPinkyExtended) {
                return 'erase';
            }
            
            // 2. CLOSED FIST (Pause): All finger tips are pulled down close to the wrist profile
            const totalFingersExtended = isIndexExtended + isMiddleExtended + isRingExtended + isPinkyExtended;
            if (totalFingersExtended === 0) {
                return 'pause';
            }

            // 3. ONE FINGER (Draw): Index is up, others are structurally down
            if (isIndexExtended && !isMiddleExtended && !isRingExtended) {
                return 'draw';
            }

            return 'pause'; // Standby safety state
        }

        // MediaPipe Framework Execution Core
        function onResults(results) {
            // Save state context
            ctx.save();
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0]; // Primary single-hand context
                const mode = analyzeGesture(landmarks);
                updateStatus(mode);

                // Isolate Index tracking coordinate point
                const indexFinger = landmarks[8];
                // Mirror coordinates horizontally to align with standard camera monitor behavior
                const targetX = (1 - indexFinger.x) * canvas.width;
                const targetY = indexFinger.y * canvas.height;

                if (mode === 'draw') {
                    if (lastX !== null && lastY !== null) {
                        ctx.beginPath();
                        ctx.moveTo(lastX, lastY);
                        ctx.lineTo(targetX, targetY);
                        
                        // Neon Glow Style Rendering Architecture
                        ctx.strokeStyle = drawingColor;
                        ctx.lineWidth = brushSize;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        
                        // Native Canvas Shadow Engine for dynamic illumination effects
                        ctx.shadowBlur = parseInt(brushSize) * 1.5;
                        ctx.shadowColor = drawingColor;
                        
                        ctx.stroke();
                        ctx.closePath();
                    }
                    lastX = targetX;
                    lastY = targetY;

                } else if (mode === 'erase') {
                    // Erase mode: draw using the dark background canvas layer color
                    if (lastX !== null && lastY !== null) {
                        ctx.beginPath();
                        ctx.moveTo(lastX, lastY);
                        ctx.lineTo(targetX, targetY);
                        ctx.strokeStyle = '#0b0c10'; 
                        ctx.lineWidth = brushSize * 2.5; // Scaled up eraser bounds
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        
                        // Turn off glow shadows during erasure cycles
                        ctx.shadowBlur = 0; 
                        ctx.stroke();
                        ctx.closePath();
                    }
                    lastX = targetX;
                    lastY = targetY;

                } else {
                    // Pause/Neutral Break State
                    lastX = null;
                    lastY = null;
                }
            } else {
                updateStatus('pause');
                lastX = null;
                lastY = null;
            }
            ctx.restore();
        }

        // Initialize MediaPipe Hands Object Configuration
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.75,
            minTrackingConfidence: 0.75
        });

        hands.onResults(onResults);

        // Connect Camera Feed to Engine Pipeline Async
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        
        camera.start().then(() => {
            updateStatus('pause');
        }).catch(err => {
            statusIndicator.textContent = "Camera Error";
            console.error("Camera access failed:", err);
        });
    </script>
</body>
</html>

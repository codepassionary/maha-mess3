<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Hidden-Metrics Attendance System</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f3f4f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.subtitle {
            color: #6b7280;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .pulse-tracker-ui {
            background-color: #f3f4f6;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 25px;
            background-color: #e5e7eb;
            color: #374151;
        }

        .status-badge.inside {
            background-color: #dcfce7;
            color: var(--success);
        }

        .status-badge.outside {
            background-color: #fee2e2;
            color: var(--danger);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }

        .btn:hover {
            background-color: #4338ca;
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #log {
            margin-top: 20px;
            max-height: 160px;
            overflow-y: auto;
            border-top: 1px solid #e5e7eb;
            padding-top: 15px;
            font-size: 12px;
            color: #4b5563;
            text-align: left;
        }

        .log-entry {
            margin-bottom: 4px;
            padding: 4px;
            border-radius: 4px;
            background: #f9fafb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Class Attendance</h1>
        <p class="subtitle">Secure Verification Session</p>

        <!-- Dynamic Session Pulse Display -->
        <div id="pulseCounterUI" class="pulse-tracker-ui">
            Active Tracking Pulse: 0 / 3
        </div>

        <div id="statusBadge" class="status-badge">Awaiting System Sync...</div>

        <button id="checkInBtn" class="btn" disabled>Submit Attendance</button>

        <div id="log">
            <strong>Security Tracking Log:</strong>
            <div id="logContents"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // Fixed Target Configuration 
            const TARGET_LAT = 24.500893; 
            const TARGET_LNG = 81.291928; 
            const ALLOWED_RADIUS = 65; 
            const MAX_ACCEPTABLE_ACCURACY = 40; 

            // Time Management (20 minutes interval over a 1-hour session window)
            const PULSE_INTERVAL_MS = 1200000; 
            const MAX_PULSES = 3;

            let pulseCount = 0;
            let intervalId = null;
            let verifiedLocationData = null;
            let securityToken = Math.random().toString(36).substring(2);

            const statusBadge = document.getElementById('statusBadge');
            const checkInBtn = document.getElementById('checkInBtn');
            const logContents = document.getElementById('logContents');
            const pulseCounterUI = document.getElementById('pulseCounterUI');

            function geoMath(lat1, lon1, lat2, lon2) {
                const R = 6371e3;
                const p1 = lat1 * Math.PI / 180;
                const p2 = lat2 * Math.PI / 180;
                const dPhi = (lat2 - lat1) * Math.PI / 180;
                const dLam = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dPhi/2) * Math.sin(dPhi/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dLam/2) * Math.sin(dLam/2);
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            }

            function writeLog(msg) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${msg}`;
                logContents.insertBefore(entry, logContents.firstChild);
            }

            function triggerSinglePulse() {
                if (pulseCount >= MAX_PULSES) {
                    clearInterval(intervalId);
                    statusBadge.textContent = "Session Concluded";
                    statusBadge.className = "status-badge";
                    writeLog("System Notice: Tracking schedule finished. Hardware links offline.");
                    return;
                }

                pulseCount++;
                pulseCounterUI.textContent = `Active Tracking Pulse: ${pulseCount} / 3`;
                writeLog(`Initializing validation pulse sequence #${pulseCount}...`);

                navigator.geolocation.getCurrentPosition(verifyLocation, pulseError, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            }

            function verifyLocation(position) {
                if(!position || !position.coords) return;

                const uLat = position.coords.latitude;
                const uLng = position.coords.longitude;
                const uAcc = position.coords.accuracy;

                // Hidden distance evaluation calculation
                const distance = geoMath(uLat, uLng, TARGET_LAT, TARGET_LNG);

                // Anti-Cheat Check: Filter fake networks / desktop proxies without naming distances
                if (uAcc > MAX_ACCEPTABLE_ACCURACY) {
                    statusBadge.textContent = "Signal Untrusted";
                    statusBadge.className = "status-badge outside";
                    checkInBtn.disabled = true;
                    writeLog(`Pulse #${pulseCount} Blocked: Low positional resolution. Relocate away from proxies.`);
                    return;
                }

                // Compliance Bounds Check
                if (distance <= ALLOWED_RADIUS) {
                    statusBadge.textContent = "Inside Perimeter";
                    statusBadge.className = "status-badge inside";
                    checkInBtn.disabled = false;
                    
                    verifiedLocationData = {
                        ts: position.timestamp,
                        tok: securityToken,
                        currentPulse: pulseCount
                    };
                    writeLog(`Pulse #${pulseCount} Approved: Device presence verified inside authorized coordinates.`);
                } else {
                    statusBadge.textContent = "Outside Boundary";
                    statusBadge.className = "status-badge outside";
                    checkInBtn.disabled = true;
                    verifiedLocationData = null;
                    writeLog(`Pulse #${pulseCount} Rejected: Zone validation mismatch.`);
                }
            }

            function pulseError(err) {
                checkInBtn.disabled = true;
                statusBadge.textContent = "Hardware Error";
                statusBadge.className = "status-badge outside";
                writeLog(`Pulse #${pulseCount} Error: GPS hardware ping failure.`);
            }

            checkInBtn.addEventListener('click', (e) => {
                if (!e.isTrusted) return; // Block programmatic click scripts

                if (verifiedLocationData && verifiedLocationData.tok === securityToken) {
                    writeLog(`🎉 Success: Attendance record generated for pulse entry ${verifiedLocationData.currentPulse}/3.`);
                    alert(`Attendance Successfully Logged!\nValidated Pulse Window: ${verifiedLocationData.currentPulse} of 3`);
                    checkInBtn.disabled = true; 
                }
            });

            // Tracking initialization loop
            if (navigator.geolocation) {
                triggerSinglePulse(); // Initial run on startup
                intervalId = setInterval(triggerSinglePulse, PULSE_INTERVAL_MS);
            } else {
                statusBadge.textContent = "Unsupported Device";
                writeLog("Critical: Device lacks geo-security tracking interfaces.");
            }
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VetTrack Luxe | Premier</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #FF8C00; --p-glow: rgba(255, 140, 0, 0.4);
            --bg: #0B0F1A; --card: rgba(30, 41, 59, 0.7); --surface: rgba(51, 65, 85, 0.5);
            --text: #FFFFFF; --sub: #94A3B8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding-bottom: 40px; padding-top: env(safe-area-inset-top);
            background-image: radial-gradient(circle at 0% 0%, #1e293b 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container { max-width: 480px; margin: 0 auto; padding: 25px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; }
        #userLabel { font-family: 'Outfit'; font-size: 34px; margin: 0; font-weight: 800; letter-spacing: -1.5px; }
        .pfp { width: 54px; height: 54px; border-radius: 18px; cursor: pointer; border: 2px solid var(--p); }

        .stat-card {
            background: linear-gradient(135deg, #FF8C00 0%, #FF5F1F 100%);
            padding: 30px; border-radius: 35px; margin-bottom: 30px;
            box-shadow: 0 20px 40px -10px var(--p-glow);
            position: relative; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .total-val { font-family: 'Outfit'; font-size: 52px; font-weight: 900; color: white; letter-spacing: -2px; }
        
        /* EXPORT BUTTON */
        .btn-export {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; padding: 10px 20px; border-radius: 15px;
            font-weight: 800; font-size: 11px; cursor: pointer; text-transform: uppercase;
            margin-bottom: 20px; display: inline-flex; align-items: center; gap: 8px;
        }

        .day-item { 
            display: grid; grid-template-columns: 70px 1fr 1fr 1fr; gap: 10px; align-items: center; 
            padding: 18px; background: var(--card); border-radius: 30px; margin-bottom: 16px;
            border: 1px solid var(--surface); backdrop-filter: blur(10px);
        }
        
        .date-circ .n { font-family: 'Outfit'; font-size: 28px; font-weight: 800; color: var(--p); display: block; line-height: 1; }
        .date-circ .d { font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase; }

        .item-pill { 
            height: 60px; border-radius: 22px; border: 1px solid var(--surface); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(255,255,255,0.02); cursor: pointer; transition: 0.3s;
            position: relative;
        }
        .item-pill.active { background: var(--p); border-color: var(--p); color: white; }
        
        /* GUEST BADGE */
        .guest-badge {
            position: absolute; top: -5px; right: -5px;
            background: #FF3D00; color: white; font-size: 10px; font-weight: 900;
            padding: 2px 6px; border-radius: 8px; border: 2px solid var(--bg);
        }
        .item-pill span { font-size: 9px; font-weight: 800; text-transform: uppercase; margin-top: 2px; }

        /* GUEST MODAL */
        .guest-counter { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; }
        .count-btn { width: 50px; height: 50px; border-radius: 15px; border: 1px solid var(--surface); background: var(--bg); color: white; font-size: 24px; font-weight: bold; cursor: pointer; }
        #countDisplay { font-family: 'Outfit'; font-size: 40px; font-weight: 900; color: var(--p); }

        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); z-index: 2000; display: none; align-items: flex-end; }
        .sheet { background: #161B29; width: 100%; border-radius: 45px 45px 0 0; padding: 40px; transform: translateY(100%); transition: 0.4s cubic-bezier(0.32, 0.72, 0, 1); }
        .sheet.up { transform: translateY(0); }
        .btn-prime { background: var(--p); color: white; padding: 22px; border-radius: 25px; border: none; font-weight: 800; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

<div class="sheet-overlay" id="guestOverlay" onclick="closeGuest()">
    <div class="sheet" id="guestSheet" onclick="event.stopPropagation()">
        <h2 id="guestTitle" style="font-family:'Outfit'; margin:0">Extra Guests</h2>
        <p style="color:var(--sub); font-size:14px">How many friends joined you for this meal?</p>
        <div class="guest-counter">
            <button class="count-btn" onclick="updateGuestCount(-1)">-</button>
            <span id="countDisplay">0</span>
            <button class="count-btn" onclick="updateGuestCount(1)">+</button>
        </div>
        <button class="btn-prime" onclick="saveGuest()">Confirm Guests</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <div><p id="greetLabel" style="color:var(--p); font-size:12px; font-weight:800; text-transform:uppercase">Welcome</p><h1 id="userLabel">Diner</h1></div>
        <img id="userPfp" class="pfp" src="" onclick="alert('Open Settings Feature')">
    </div>

    <div class="stat-card">
        <div class="label" style="text-transform:uppercase; font-size:11px; letter-spacing:2px; opacity:0.8">Statement Balance</div>
        <div class="total-val" id="totalValue">₹0</div>
        <div id="statsSub" style="font-size:12px; font-weight:700; opacity:0.9; margin-top: 10px;">0 Units Recorded</div>
    </div>

    <button class="btn-export" onclick="alert('Exporting detailed PDF statement...')">
        <span>📄 Export PDF Report</span>
    </button>

    <div id="logsGrid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" };
    const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app), provider = new GoogleAuthProvider();
    
    let user = null, logs = {}, viewDate = new Date(), todayDate = new Date();
    let currentGuestDay, currentGuestType, guestVal = 0;
    let config = { mealPrice: 50, waterPrice: 30 };

    onAuthStateChanged(auth, async (u) => {
        if (u) { user = u; document.getElementById('userLabel').innerText = u.displayName.split(' ')[0]; syncData(); }
        else { signInWithPopup(auth, provider); }
    });

    function syncData() {
        onSnapshot(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), (d) => {
            logs = d.data() || {}; renderGrid();
        });
    }

    function renderGrid() {
        const grid = document.getElementById('logsGrid'); grid.innerHTML = '';
        const days = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();

        for (let i = 1; i <= days; i++) {
            const d = logs[i] || { l: 0, d: 0, w: 0, lg: 0, dg: 0 };
            const card = document.createElement('div');
            card.className = 'day-item';
            
            card.innerHTML = `
                <div class="date-circ"><span class="n">${i}</span><span class="d">Day</span></div>
                <div class="item-pill ${d.l?'active':''}" onclick="toggle(${i},'l')" oncontextmenu="openGuest(${i},'l');return false;">
                    ${d.lg > 0 ? `<div class="guest-badge">+${d.lg}</div>` : ''}
                    <span>Lunch</span>
                </div>
                <div class="item-pill ${d.d?'active':''}" onclick="toggle(${i},'d')" oncontextmenu="openGuest(${i},'d');return false;">
                    ${d.dg > 0 ? `<div class="guest-badge">+${d.dg}</div>` : ''}
                    <span>Dinner</span>
                </div>
                <div class="item-pill ${d.w?'active':''}" onclick="toggle(${i},'w')"><span>Water</span></div>
            `;
            grid.appendChild(card);
        }
        calculate();
    }

    window.toggle = async (day, type) => {
        const obj = logs[day] || { l: 0, d: 0, w: 0, lg: 0, dg: 0 };
        obj[type] = obj[type] ? 0 : 1;
        if (obj[type] === 0) { obj[type+'g'] = 0; } // Reset guests if meal is unselected
        await setDoc(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), { [day]: obj }, { merge: true });
    };

    // GUEST LOGIC
    window.openGuest = (day, type) => {
        currentGuestDay = day; currentGuestType = type;
        guestVal = logs[day] ? (logs[day][type+'g'] || 0) : 0;
        document.getElementById('countDisplay').innerText = guestVal;
        document.getElementById('guestOverlay').style.display = 'flex';
        setTimeout(() => document.getElementById('guestSheet').classList.add('up'), 10);
    };

    window.updateGuestCount = (v) => {
        guestVal = Math.max(0, guestVal + v);
        document.getElementById('countDisplay').innerText = guestVal;
    };

    window.saveGuest = async () => {
        const obj = logs[currentGuestDay] || { l: 0, d: 0, w: 0, lg: 0, dg: 0 };
        obj[currentGuestType] = 1; // Ensure meal is marked if guests are added
        obj[currentGuestType + 'g'] = guestVal;
        await setDoc(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), { [currentGuestDay]: obj }, { merge: true });
        closeGuest();
    };

    window.closeGuest = () => {
        document.getElementById('guestSheet').classList.remove('up');
        setTimeout(() => document.getElementById('guestOverlay').style.display = 'none', 400);
    };

    function calculate() {
        let meals = 0, water = 0, guests = 0;
        Object.values(logs).forEach(v => {
            if(v.l) meals++; if(v.d) meals++; if(v.w) water++;
            guests += (v.lg || 0) + (v.dg || 0);
        });
        const total = ((meals + guests) * config.mealPrice) + (water * config.waterPrice);
        document.getElementById('totalValue').innerText = `₹${total.toLocaleString('en-IN')}`;
        document.getElementById('statsSub').innerText = `${meals} Personal • ${guests} Guests • ${water} Water`;
    }
</script>
</body>
</html>

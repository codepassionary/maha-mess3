<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VetTrack Luxe | Pulse Guard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #FF8C00; --bg: #0B0F1A; --card: #1E293B; --success: #2ed573; --danger: #ff4757; --warn: #f1c40f; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; padding: 25px; min-height: 100vh; display: flex; flex-direction: column; }
        .status-card { background: var(--card); border-radius: 35px; padding: 40px 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative; }
        .pulse-ring { width: 120px; height: 120px; border: 4px solid var(--p); border-radius: 50%; margin: 0 auto 25px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
        .pulse-ring.active { animation: ripple 2s infinite; }
        @keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(255, 140, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 140, 0, 0); } }
        .btn-prime { width: 100%; padding: 22px; border-radius: 25px; border: none; background: var(--p); color: white; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: auto; }
        #log { margin-top: 25px; font-size: 11px; color: #94A3B8; height: 150px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <header style="margin-bottom: 20px;">
        <h1 style="font-family:'Outfit'; margin:0; font-size:28px;">Pulse<span style="color:var(--p)">Guard v2.</span></h1>
        <div id="debugStatus" style="font-size:10px; color:var(--warn); margin-top:5px;">Checking System Integrity...</div>
    </header>

    <div class="status-card">
        <div id="ring" class="pulse-ring">
            <span id="score" style="font-family:'Outfit'; font-size:32px;">0%</span>
        </div>
        <div id="statusLabel" style="font-weight:800; letter-spacing:1px; color:var(--p)">READY</div>
    </div>

    <div id="log"></div>
    <button id="startBtn" class="btn-prime" onclick="initiatePulse()">START SESSION</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, updateDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // IMPORTANT: Replace with your actual Firebase config
    const firebaseConfig = { 
        apiKey: "AIza...", 
        authDomain: "your-app.firebaseapp.com",
        projectId: "your-app-id"
    };

    let db;
    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        document.getElementById('debugStatus').innerHTML = "✅ Firebase Connected | 🛰️ Waiting for GPS";
    } catch (e) {
        document.getElementById('debugStatus').innerHTML = "❌ Firebase Config Error";
    }

    const TARGET_LOC = { lat: 22.7196, lng: 75.8577 }; // Update with your room coords
    let isMonitoring = false;
    let cachedPulses = 0;

    window.initiatePulse = () => {
        if (!navigator.geolocation) {
            alert("GPS not supported on this browser.");
            return;
        }
        
        // Request Permission immediately to test
        navigator.geolocation.getCurrentPosition(
            () => {
                isMonitoring = true;
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('ring').classList.add('active');
                addLog("Tracking active. First pulse in progress...");
                executePulse();
                setInterval(executePulse, 60000); // 1 minute for testing, change to 300000 for 5 min
            },
            (err) => {
                addLog("Error: Location Permission Denied.", "error");
                alert("Please enable Location services to use this app.");
            }
        );
    };

    async function executePulse() {
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const dist = getDistance(pos.coords.latitude, pos.coords.longitude, TARGET_LOC.lat, TARGET_LOC.lng);
            const inClass = dist < 0.05; // 50m radius

            if (inClass) {
                if (navigator.onLine && db) {
                    try {
                        // Use actual collection names from your Firebase
                        const studentRef = doc(db, "attendance", "room_a", "students", "my_device");
                        await updateDoc(studentRef, {
                            pulses: increment(1 + cachedPulses),
                            lastVerified: serverTimestamp()
                        });
                        addLog(`Pulse Success: ${1 + cachedPulses} units synced.`);
                        cachedPulses = 0;
                    } catch (e) {
                        cachedPulses++;
                        addLog("Firebase Sync failed. Pulse cached.", "warn");
                    }
                } else {
                    cachedPulses++;
                    addLog("Offline. Pulse stored in local memory.", "warn");
                }
            } else {
                addLog("Pulse Failed: You are outside the Geofence.", "error");
            }
        });
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const p = 0.017453292519943295;    
        const a = 0.5 - Math.cos((lat2 - lat1) * p)/2 + 
                Math.cos(lat1 * p) * Math.cos(lat2 * p) * 
                (1 - Math.cos((lon2 - lon1) * p))/2;
        return 12742 * Math.asin(Math.sqrt(a)); 
    }

    function addLog(msg, type = "info") {
        const log = document.getElementById('log');
        const color = type === "error" ? "var(--danger)" : (type === "warn" ? "var(--warn)" : "#94A3B8");
        log.innerHTML += `<div style="color:${color}; margin-bottom:5px;">• ${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    }
</script>
</body>
</html>

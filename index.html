<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Geofenced Biometrics</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --error: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 16px;
        }

        * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            background: var(--surface);
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 800px;
            border-radius: var(--radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 480px) {
            .app-container { height: 90vh; }
        }

        /* Header */
        .header {
            padding: 20px;
            text-align: center;
            z-index: 10;
            background: linear-gradient(to bottom, var(--surface) 60%, transparent);
        }
        .header h2 { margin: 0; font-size: 1.25rem; }
        .header p { margin: 5px 0 0; font-size: 0.875rem; color: var(--text-muted); }

        /* Camera View */
        .camera-wrapper {
            flex-grow: 1;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror */
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Viewfinder Overlay */
        .viewfinder {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; height: 250px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            box-shadow: 0 0 0 2000px rgba(15, 23, 42, 0.85); /* Darkens everything outside the circle */
            display: none;
            overflow: hidden;
        }

        .scanning-line {
            width: 100%;
            height: 4px;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            position: absolute;
            top: 0;
            animation: scan 2s infinite ease-in-out;
            display: none;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Controls */
        .controls {
            padding: 24px;
            background: var(--surface);
            z-index: 10;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; }
        
        .btn-text { 
            background: transparent; 
            color: var(--text-muted); 
            margin-top: 10px; 
            font-size: 0.875rem;
            display: block;
        }
        .btn-text:hover { color: var(--text); }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Status States */
        .status-overlay {
            position: absolute;
            inset: 0;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 20;
            transition: opacity 0.3s ease;
        }
        
        .status-icon { font-size: 3rem; margin-bottom: 16px; }
        .hidden { opacity: 0; pointer-events: none; }
        
        /* Hidden canvas for capturing frames */
        canvas { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2>Secure Gateway</h2>
        <p id="subtext">Initializing system...</p>
    </div>

    <div id="statusOverlay" class="status-overlay">
        <div id="statusIcon" class="status-icon">⏳</div>
        <h3 id="statusTitle">Checking Location</h3>
        <p id="statusDesc" style="color: var(--text-muted);">Please allow location access to continue.</p>
        <button id="retryBtn" class="btn-primary" style="margin-top: 20px; width: auto; padding: 10px 24px;" onclick="initSystem()">Retry</button>
    </div>

    <div class="camera-wrapper">
        <video id="videoElement" autoplay playsinline></video>
        <div id="viewfinder" class="viewfinder">
            <div id="scanningLine" class="scanning-line"></div>
        </div>
    </div>

    <div class="controls">
        <button id="registerBtn" class="btn-primary" onclick="registerFace()">Register Face</button>
        <button id="verifyBtn" class="btn-success" onclick="verifyFace()">Verify Identity</button>
        <button id="resetBtn" class="btn-text" onclick="resetSystem()">Reset Device (Clear Data)</button>
    </div>

    <canvas id="canvasElement"></canvas>
</div>

<script>
    // --- CONFIGURATION ---
    const TARGET_LAT = 24.507573;
    const TARGET_LON = 81.298352;
    const MAX_RADIUS = 50; // meters

    // DOM Elements
    const UI = {
        overlay: document.getElementById('statusOverlay'),
        icon: document.getElementById('statusIcon'),
        title: document.getElementById('statusTitle'),
        desc: document.getElementById('statusDesc'),
        retryBtn: document.getElementById('retryBtn'),
        subtext: document.getElementById('subtext'),
        video: document.getElementById('videoElement'),
        viewfinder: document.getElementById('viewfinder'),
        scanLine: document.getElementById('scanningLine'),
        registerBtn: document.getElementById('registerBtn'),
        verifyBtn: document.getElementById('verifyBtn'),
        resetBtn: document.getElementById('resetBtn'),
        canvas: document.getElementById('canvasElement')
    };

    let stream = null;

    // --- INITIALIZATION ---
    window.onload = () => initSystem();

    function initSystem() {
        showState('loading', 'Checking Location', 'Acquiring GPS coordinates...');
        UI.retryBtn.style.display = 'none';
        
        if (!navigator.geolocation) {
            showState('error', 'Unsupported Device', 'Your browser does not support geolocation.');
            return;
        }

        navigator.geolocation.getCurrentPosition(
            handleLocationSuccess,
            handleLocationError,
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    // --- GEOFENCING LOGIC ---
    function handleLocationSuccess(position) {
        const dist = calculateDistance(position.coords.latitude, position.coords.longitude, TARGET_LAT, TARGET_LON);
        
        if (dist <= MAX_RADIUS) {
            UI.subtext.innerText = `Secured zone (${Math.round(dist)}m from center)`;
            startCamera();
        } else {
            showState('error', 'Access Denied', `Geofence active. You are ${Math.round(dist)}m away. Must be within ${MAX_RADIUS}m.`);
            UI.retryBtn.style.display = 'inline-block';
        }
    }

    function handleLocationError(error) {
        let msg = "Unable to retrieve location.";
        if (error.code === 1) msg = "Please enable GPS permissions in your browser.";
        if (error.code === 3) msg = "Location request timed out.";
        showState('error', 'Location Failed', msg);
        UI.retryBtn.style.display = 'inline-block';
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // --- CAMERA LOGIC ---
    async function startCamera() {
        showState('loading', 'Starting Camera', 'Requesting camera permissions...');
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
            UI.video.srcObject = stream;
            UI.video.style.opacity = 1;
            
            // Hide overlay and prep UI
            UI.overlay.classList.add('hidden');
            UI.viewfinder.style.display = 'block';
            
            checkRegistrationStatus();
        } catch (err) {
            showState('error', 'Camera Error', 'Please allow camera access to use biometric features.');
            UI.retryBtn.style.display = 'inline-block';
        }
    }

    // --- BIOMETRIC WORKFLOW ---
    function checkRegistrationStatus() {
        const isRegistered = localStorage.getItem('userFaceData') !== null;
        
        UI.registerBtn.style.display = 'none';
        UI.verifyBtn.style.display = 'none';
        UI.resetBtn.style.display = 'none';

        if (!isRegistered) {
            UI.subtext.innerText = "No profile found. Please register.";
            UI.registerBtn.style.display = 'block';
        } else {
            UI.subtext.innerText = "Profile recognized. Ready for auth.";
            UI.verifyBtn.style.display = 'block';
            UI.resetBtn.style.display = 'block';
        }
    }

    function captureFrame() {
        UI.canvas.width = UI.video.videoWidth;
        UI.canvas.height = UI.video.videoHeight;
        const ctx = UI.canvas.getContext('2d');
        // Mirror the canvas draw to match the mirrored video feed
        ctx.translate(UI.canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(UI.video, 0, 0, UI.canvas.width, UI.canvas.height);
        return UI.canvas.toDataURL('image/jpeg', 0.8);
    }

    function registerFace() {
        UI.registerBtn.disabled = true;
        UI.registerBtn.innerText = "Capturing...";
        
        // Simulate processing delay
        setTimeout(() => {
            const faceData = captureFrame();
            localStorage.setItem('userFaceData', faceData); // Save to local storage
            
            // Success Feedback
            UI.registerBtn.style.background = "var(--success)";
            UI.registerBtn.innerText = "Registered Successfully!";
            
            setTimeout(() => {
                UI.registerBtn.disabled = false;
                UI.registerBtn.style.background = "";
                checkRegistrationStatus();
            }, 1500);
        }, 800);
    }

    function verifyFace() {
        UI.verifyBtn.disabled = true;
        UI.verifyBtn.innerText = "Analyzing Biometrics...";
        UI.scanLine.style.display = 'block'; // Start cool laser animation

        setTimeout(() => {
            UI.scanLine.style.display = 'none';
            const currentFace = captureFrame();
            const storedFace = localStorage.getItem('userFaceData');
            
            /* *NOTE ON REALITY*: In a production app, you would send 'currentFace' 
               and your User ID to a backend API (e.g., Python/OpenCV/FaceNet) here 
               to mathematically compare the new image against the stored facial vectors.
            */
            
            // Simulating successful backend match:
            if (storedFace) {
                showState('success', 'Access Granted', 'Identity verified securely.');
                UI.subtext.innerText = "Session Active";
                UI.verifyBtn.innerText = "Authenticated";
                UI.verifyBtn.style.background = "var(--surface)";
                UI.verifyBtn.style.color = "var(--success)";
            } else {
                showState('error', 'Verification Failed', 'No matching profile found.');
                UI.verifyBtn.disabled = false;
                UI.verifyBtn.innerText = "Verify Identity";
            }
        }, 2000);
    }

    function resetSystem() {
        if(confirm("Are you sure you want to delete your registered face data?")) {
            localStorage.removeItem('userFaceData');
            checkRegistrationStatus();
        }
    }

    // --- UI HELPERS ---
    function showState(type, title, desc) {
        UI.overlay.classList.remove('hidden');
        UI.title.innerText = title;
        UI.desc.innerText = desc;
        
        if (type === 'loading') {
            UI.icon.innerText = '⏳';
            UI.icon.style.color = 'var(--primary)';
        } else if (type === 'error') {
            UI.icon.innerText = '🚫';
            UI.icon.style.color = 'var(--error)';
        } else if (type === 'success') {
            UI.icon.innerText = '✅';
            UI.icon.style.color = 'var(--success)';
            setTimeout(() => UI.overlay.classList.add('hidden'), 2500); // Auto hide success
        }
    }
</script>

</body>
</html>

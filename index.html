<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grand Farewell Celebration</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #020204; 
            --void-glow: #1a1202;
            --gold-mid: #d4af37; 
            --gold-bright: #fff5cc; 
            --ivory: #f3ead2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            background: var(--void); 
            color: var(--ivory); 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw;
        }

        /* Continuous slow cinematic pulse background movement */
        .stage { 
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            background: radial-gradient(circle 80% at 50% 50%, var(--void-glow) 0%, var(--void) 100%);
            animation: bgShift 20s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { background-size: 100% 100%; background-position: 50% 50%; }
            100% { background-size: 130% 130%; background-position: 52% 48%; }
        }

        canvas#fxCanvas { position: fixed; inset: 0; z-index: 50; pointer-events: none; }

        /* Highly Premium glassmorphism with dynamic ambient float animation */
        .glass {
            width: 92vw; 
            max-width: 700px; 
            padding: clamp(40px, 6vh, 70px) clamp(20px, 5vw, 60px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(212, 175, 55, 0.25); 
            border-radius: 32px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), 
                        inset 0 0 50px rgba(212, 175, 55, 0.08);
            text-align: center; 
            position: relative; 
            z-index: 10;
            animation: floatFrame 8s ease-in-out infinite alternate;
        }

        @keyframes floatFrame {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(0.5deg); }
        }

        /* Ornamental corners that scale perfectly on big displays */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid transparent;
            pointer-events: none;
        }
        .tl { top: 20px; left: 20px; border-top-color: var(--gold-mid); border-left-color: var(--gold-mid); }
        .tr { top: 20px; right: 20px; border-top-color: var(--gold-mid); border-right-color: var(--gold-mid); }
        .bl { bottom: 20px; left: 20px; border-bottom-color: var(--gold-mid); border-left-color: var(--gold-mid); }
        .br { bottom: 20px; right: 20px; border-bottom-color: var(--gold-mid); border-right-color: var(--gold-mid); }

        .gold-text { 
            color: var(--gold-mid); 
            text-transform: uppercase; 
            letter-spacing: 7px; 
            font-size: clamp(0.75rem, 2vw, 0.95rem); 
            font-weight: 600;
        }
        
        .title { 
            font-family: 'Cinzel Decorative', serif; 
            font-weight: 900;
            font-size: clamp(2.2rem, 6vw, 4.2rem); 
            margin: 25px 0; 
            line-height: 1.15; 
            text-shadow: 0 0 35px rgba(212, 175, 55, 0.4);
            background: linear-gradient(90deg, #aa771c, #fcf6ba, #d4af37, #fff5cc, #aa771c);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 6s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }
        
        .unveil-btn {
            background: transparent; 
            color: var(--gold-bright); 
            border: 1.5px solid var(--gold-mid);
            padding: 18px 48px; 
            cursor: pointer; 
            letter-spacing: 5px; 
            font-weight: 700; 
            font-size: clamp(0.85rem, 2vw, 1.05rem);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            position: relative;
            outline: none;
        }
        .unveil-btn:hover { 
            background: var(--gold-mid); 
            color: var(--void); 
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.6); 
            transform: scale(1.06); 
        }

        #invitation { display: none; opacity: 0; }
        .show { display: block !important; animation: premiumReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes premiumReveal { 
            0% { opacity: 0; transform: scale(0.92) translateY(30px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } 
        }

        #flashOverlay {
            position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 99;
        }
        .flash-active { animation: explosiveFlash 0.6s ease-out forwards; }
        @keyframes explosiveFlash { 0% { opacity: 0.8; } 100% { opacity: 0; } }
    </style>
</head>
<body>

<div class="stage" id="stageMain">
    <canvas id="fxCanvas"></canvas>
    <div class="glass" id="card">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>

        <!-- COVER PANEL -->
        <div id="cover">
            <div class="gold-text">Requesting Your Honorable Presence</div>
            <h1 class="title">The Grand<br>Farewell</h1>
            <button class="unveil-btn" id="unveilBtn">UNVEIL INVITATION</button>
        </div>

        <!-- REVEALED INVITATION DETAILS -->
        <div id="invitation">
            <div class="gold-text" style="margin-bottom: 15px;">In Clear Honor Of</div>
            <h1 class="title" style="font-size: clamp(1.8rem, 5vw, 3.2rem); margin: 15px 0;">Dr. Upendra Singh<br>Narwaria Sir</h1>
            <p style="font-size: clamp(1rem, 2.5vw, 1.35rem); opacity: 0.95; font-weight: 300; letter-spacing: 1px; line-height: 1.5;">
                Department of Livestock Production Management
            </p>
            <div style="margin-top: 35px; border-top: 1px solid rgba(212,175,55,0.2); padding-top: 20px;">
                <span class="gold-text" style="font-size: 0.8rem; letter-spacing: 3px;">June 26th · 11:00 AM · First Year Classroom</span>
            </div>
        </div>
    </div>
</div>
<div id="flashOverlay"></div>

<script>
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    
    function resize() { 
        W = canvas.width = window.innerWidth; 
        H = canvas.height = window.innerHeight; 
    }
    window.addEventListener('resize', resize); resize();

    let particles = [];
    let ambientParticles = [];

    // Particle Object Supporting Shapes, Gravity, and Spinning
    class Particle {
        constructor(x, y, vx, vy, color, sizeMultiplier = 1) {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy;
            this.color = color; 
            this.life = 1;
            this.decay = Math.random() * 0.007 + 0.005;
            this.size = (Math.random() * 5 + 3) * sizeMultiplier;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.2;
            this.type = Math.random() < 0.4 ? 'circle' : Math.random() < 0.7 ? 'rect' : 'triangle';
        }
        update() { 
            this.x += this.vx; this.y += this.vy; 
            this.vy += 0.14; // Gravity weight
            this.vx *= 0.98; // Natural air drag
            this.rotation += this.rotSpeed;
            this.life -= this.decay; 
        }
        draw() { 
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.fillStyle = this.color; 
            ctx.globalAlpha = this.life;
            ctx.beginPath();
            if(this.type === 'circle') {
                ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
            } else if (this.type === 'rect') {
                ctx.fillRect(-this.size / 2, -this.size / 4, this.size, this.size / 2);
            } else {
                ctx.moveTo(0, -this.size / 2);
                ctx.lineTo(this.size / 2, this.size / 2);
                ctx.lineTo(-this.size / 2, this.size / 2);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }

    // Slow drifting premium dust overlay background loop
    function createAmbientFloaters() {
        if(ambientParticles.length < 60) {
            ambientParticles.push({
                x: Math.random() * W,
                y: H + 20,
                vx: (Math.random() - 0.5) * 0.4,
                vy: -Math.random() * 0.6 - 0.2,
                size: Math.random() * 2.5 + 0.5,
                alpha: Math.random() * 0.5 + 0.2
            });
        }
    }

    function triggerGrandExplosion() {
        const vibrantColors = ['#FFD700', '#FFA500', '#FF2E93', '#FF8A00', '#00E5FF', '#8600FF', '#7FFF00', '#FFFFFF'];
        
        // Stage 1 Corners Cannons (Shooting High Inward)
        for(let i=0; i < 220; i++) {
            particles.push(new Particle(0, H * 0.9, Math.random() * 22 + 8, -Math.random() * 28 - 10, vibrantColors[i % vibrantColors.length], 1.4));
            particles.push(new Particle(W, H * 0.9, -Math.random() * 22 - 8, -Math.random() * 28 - 10, vibrantColors[i % vibrantColors.length], 1.4));
        }

        // Stage 2 Radial Center Shockwave (Dopamine Spike outward pop)
        for(let j=0; j < 180; j++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 16 + 4;
            particles.push(new Particle(W / 2, H / 2, Math.cos(angle) * speed, Math.sin(angle) * speed, '#fcf6ba', 1));
        }
    }

    document.getElementById('unveilBtn').onclick = () => {
        // Digital display hardware trigger option: Requests browser absolute Fullscreen layout safely
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) docEl.requestFullscreen();
        else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();

        // White screen flash transition
        document.getElementById('flashOverlay').classList.add('flash-active');

        setTimeout(() => {
            document.getElementById('cover').style.display = 'none';
            document.getElementById('invitation').classList.add('show');
            triggerGrandExplosion();
        }, 100);
    };

    function animate() {
        ctx.clearRect(0, 0, W, H);
        
        // Handle background slow movement
        createAmbientFloaters();
        ctx.globalAlpha = 1;
        ambientParticles.forEach((p, index) => {
            p.x += p.vx; p.y += p.vy;
            ctx.fillStyle = '#d4af37';
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            if(p.y < -20) ambientParticles.splice(index, 1);
        });

        // Handle Active Celebration Confetti
        particles.forEach((p, i) => {
            p.update(); p.draw();
            if(p.life <= 0 || p.x < -50 || p.x > W + 50) particles.splice(i, 1);
        });

        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VetTrack Luxe | Master Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #FF8C00; --bg: #0B0F1A; --card: rgba(30, 41, 59, 0.7); 
            --surface: rgba(51, 65, 85, 0.5); --text: #FFFFFF; --sub: #94A3B8; --danger: #ff4444; --success: #22c55e;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; padding-bottom: 80px; }
        .container { max-width: 650px; margin: 0 auto; }

        /* Maintenance Panel */
        .dev-panel { 
            background: rgba(255, 68, 68, 0.1); border: 1px dashed var(--danger); 
            padding: 15px; border-radius: 20px; margin-bottom: 25px; display: flex; 
            justify-content: space-between; align-items: center; 
        }

        /* Stats */
        .master-stats { display: flex; gap: 12px; margin-bottom: 25px; }
        .stat-box { flex: 1; background: var(--card); padding: 18px; border-radius: 22px; border: 1px solid var(--surface); }
        .stat-box small { font-size: 10px; color: var(--sub); font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 5px; }
        .stat-box div { font-family: 'Outfit'; font-size: 24px; color: var(--p); font-weight: 800; }

        /* Search & Rows */
        .search-box { width: 100%; padding: 15px 20px; background: var(--card); border: 1px solid var(--surface); border-radius: 18px; color: white; margin: 15px 0; outline: none; }
        .student-row { background: var(--card); padding: 15px; border-radius: 22px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--surface); cursor: pointer; }
        .student-icon { width: 45px; height: 45px; border-radius: 14px; object-fit: cover; }
        .badge { font-size: 9px; padding: 3px 8px; border-radius: 6px; font-weight: 800; text-transform: uppercase; }
        .bg-paid { background: var(--success); } .bg-unpaid { background: var(--danger); }

        /* Modal */
        .modal { position: fixed; inset: 0; background: var(--bg); z-index: 20000; display: none; flex-direction: column; padding: 25px; overflow-y: auto; }
        .modal.active { display: flex; }
        .field-group { margin-bottom: 15px; background: var(--card); padding: 15px; border-radius: 18px; border: 1px solid var(--surface); }
        .field-group label { display: block; font-size: 10px; font-weight: 800; color: var(--p); text-transform: uppercase; margin-bottom: 5px; }
        .read-only { color: var(--sub); font-weight: 600; }
        
        /* Table */
        .detail-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 15px; }
        .detail-table th { text-align: left; color: var(--sub); padding: 8px; font-size: 9px; }
        .detail-table td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .in-table { background: #000; border: 1px solid var(--surface); color: white; width: 40px; text-align: center; border-radius: 5px; padding: 4px; }

        .btn-p { background: var(--p); color: white; border: none; padding: 12px 20px; border-radius: 14px; font-weight: 800; cursor: pointer; }
        .btn-status { border: none; padding: 8px 15px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; color: white; }
    </style>
</head>
<body>

<div class="container">
    <header class="admin-header">
        <h1 style="font-family:'Outfit'">Master Control</h1>
    </header>

    <div class="dev-panel">
        <div>
            <div style="font-weight: 800; font-size: 14px;">Maintenance Mode</div>
            <small id="maintStatus" style="color: var(--sub)">Checking system status...</small>
        </div>
        <button id="maintBtn" class="btn-p" onclick="toggleMaintenance()" style="background: var(--danger)">Disable App</button>
    </div>

    <div class="master-stats">
        <div class="stat-box"><small>Revenue</small><div id="totalRev">₹0</div></div>
        <div class="stat-box"><small>Students</small><div id="totalStuds">0</div></div>
    </div>

    <input type="text" id="search" class="search-box" placeholder="Search students..." oninput="filterList()">
    <div id="studentList"></div>
</div>

<div id="editModal" class="modal">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <button onclick="closeModal()" style="background:none; border:none; color:var(--p); font-weight:800;">← SAVE & EXIT</button>
        <button class="btn-p" onclick="window.print()">PRINT BILL</button>
    </div>

    <div style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
        <img id="m-icon" class="student-icon" style="width:60px; height:60px;">
        <div>
            <h2 id="m-name" style="margin:0; font-family:'Outfit'">Student Name</h2>
            <div id="m-email" class="read-only" style="font-size:12px;">email@student.com</div>
        </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div class="field-group">
            <label>Meal Price (₹)</label>
            <input type="number" id="m-price" class="in-table" style="width:100%; height:35px;" onchange="updatePrice(this.value)">
        </div>
        <div class="field-group">
            <label>Payment</label>
            <button id="m-pay" class="btn-status" onclick="togglePay()">Unpaid</button>
        </div>
    </div>

    <table class="detail-table">
        <thead><tr><th>Day</th><th>L</th><th>D</th><th>Guests</th><th>W</th></tr></thead>
        <tbody id="m-table"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", 
        messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" 
    };

    const app = initializeApp(firebaseConfig), db = getFirestore(app), auth = getAuth(app), provider = new GoogleAuthProvider();
    let students = [], currentS, currentUid, currentLogs, isMaintActive = false;

    // 1. Auth & Maintenance Sync
    onAuthStateChanged(auth, u => { 
        if(u) {
            fetchAll();
            onSnapshot(doc(db, "app_settings", "global"), s => {
                isMaintActive = s.exists() ? s.data().maintenance : false;
                document.getElementById('maintStatus').innerText = isMaintActive ? "System Offline" : "System Live";
                document.getElementById('maintBtn').innerText = isMaintActive ? "Enable App" : "Disable App";
                document.getElementById('maintBtn').style.background = isMaintActive ? "var(--success)" : "var(--danger)";
            });
        } else signInWithPopup(auth, provider);
    });

    window.toggleMaintenance = async () => {
        await setDoc(doc(db, "app_settings", "global"), { maintenance: !isMaintActive, updatedAt: Date.now() }, { merge: true });
    };

    async function fetchAll() {
        const snap = await getDocs(collection(db, "users")), monthKey = `${new Date().getFullYear()}_${new Date().getMonth()}`;
        students = [];
        for(const d of snap.docs) {
            const u = d.data(), lSnap = await getDoc(doc(db, "users", d.id, "logs", monthKey));
            students.push({ uid: d.id, ...u, logs: lSnap.exists() ? lSnap.data() : {} });
        }
        render(students);
    }

    function render(data) {
        const list = document.getElementById('studentList'); list.innerHTML = "";
        let rev = 0;
        data.forEach(s => {
            let m=0, g=0;
            Object.values(s.logs).forEach(v => { m+=(v.l?1:0)+(v.d?1:0); g+=(parseInt(v.lg)||0)+(parseInt(v.dg)||0); });
            const bill = (m+g) * (s.mealPrice || 50); rev += bill;
            list.innerHTML += `
                <div class="student-row" onclick="openEdit('${s.uid}')">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <img src="${s.photo||'https://ui-avatars.com/api/?name='+s.name}" class="student-icon">
                        <div>
                            <div style="font-weight:700">${s.name} <span class="badge ${s.isPaid?'bg-paid':'bg-unpaid'}">${s.isPaid?'Paid':'Unpaid'}</span></div>
                            <small style="color:var(--sub)">${m+g} total plates</small>
                        </div>
                    </div>
                    <div style="font-weight:800; color:var(--p)">₹${bill}</div>
                </div>`;
        });
        document.getElementById('totalRev').innerText = "₹" + rev;
        document.getElementById('totalStuds').innerText = data.length;
    }

    window.openEdit = (uid) => {
        currentS = students.find(x => x.uid === uid);
        currentUid = uid; currentLogs = currentS.logs;
        document.getElementById('m-name').innerText = currentS.name;
        document.getElementById('m-email').innerText = currentS.email || "No Email";
        document.getElementById('m-price').value = currentS.mealPrice || 50;
        document.getElementById('m-icon').src = currentS.photo || 'https://ui-avatars.com/api/?name='+currentS.name;
        updatePayUI(currentS.isPaid);
        document.getElementById('editModal').classList.add('active');
        renderTable();
    }

    function renderTable() {
        const body = document.getElementById('m-table'); body.innerHTML = "";
        const days = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
        for(let i=1; i<=days; i++) {
            const d = currentLogs[i] || { l:0, d:0, lg:0, dg:0, w:0 };
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i}</td>
                <td><input type="checkbox" ${d.l?'checked':''} onchange="logChange(${i},'l',this.checked?1:0)"></td>
                <td><input type="checkbox" ${d.d?'checked':''} onchange="logChange(${i},'d',this.checked?1:0)"></td>
                <td><input type="number" class="in-table" value="${(parseInt(d.lg)||0)+(parseInt(d.dg)||0)}" onchange="logChange(${i},'lg',this.value)"></td>
                <td><input type="number" class="in-table" value="${d.w||0}" onchange="logChange(${i},'w',this.value)"></td>
            `;
            body.appendChild(tr);
        }
    }

    window.logChange = async (day, field, val) => {
        if(!currentLogs[day]) currentLogs[day] = { l:0, d:0, lg:0, dg:0, w:0 };
        currentLogs[day][field] = val;
        const mk = `${new Date().getFullYear()}_${new Date().getMonth()}`;
        await setDoc(doc(db,"users",currentUid,"logs",mk), { [day]: currentLogs[day] }, { merge: true });
        // Push notification to student
        await addDoc(collection(db,"users",currentUid,"activity"), { msg:`Admin updated Day ${day} ${field.toUpperCase()}`, time:Date.now() });
    }

    window.updatePrice = async (v) => { 
        await updateDoc(doc(db,"users",currentUid), { mealPrice: parseInt(v) });
        await addDoc(collection(db,"users",currentUid,"activity"), { msg:`Meal price set to ₹${v} by Admin`, time:Date.now() });
    };
    
    window.togglePay = async () => {
        const s = !currentS.isPaid;
        await updateDoc(doc(db,"users",currentUid), { isPaid: s });
        currentS.isPaid = s; updatePayUI(s);
    };

    function updatePayUI(s) {
        const b = document.getElementById('m-pay');
        b.innerText = s ? "PAID" : "UNPAID";
        b.style.background = s ? "var(--success)" : "var(--danger)";
    }

    window.filterList = () => {
        const q = document.getElementById('search').value.toLowerCase();
        render(students.filter(s => s.name.toLowerCase().includes(q)));
    }

    window.closeModal = () => { document.getElementById('editModal').classList.remove('active'); fetchAll(); }
</script>
</body>
</html>

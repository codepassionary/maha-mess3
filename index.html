<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetTrack Luxe | Ultra Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #FF8C00; --p-dark: #E67E00; --bg: #0B0F1A; 
            --card: rgba(30, 41, 59, 0.7); --surface: rgba(51, 65, 85, 0.5); 
            --text: #FFFFFF; --sub: #94A3B8; --acc: #10B981;
        }

        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px;
            background-image: radial-gradient(circle at 0% 0%, #1e293b 0%, transparent 40%);
        }

        /* Top Navigation & Stats */
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; }
        .title-area h1 { font-family: 'Outfit'; font-size: 28px; margin: 0; letter-spacing: -1px; }
        .title-area span { color: var(--p); }
        
        .search-bar { 
            background: var(--card); border: 1px solid var(--surface); 
            border-radius: 15px; padding: 12px 20px; width: 100%; 
            margin-bottom: 20px; color: white; outline: none;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
        .stat-item { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid var(--surface); text-align: center; }
        .stat-item label { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--sub); display: block; margin-bottom: 5px; }
        .stat-item b { font-family: 'Outfit'; font-size: 20px; color: var(--p); }

        /* User Cards */
        .member-list { display: flex; flex-direction: column; gap: 12px; }
        .member-card { 
            background: var(--card); border-radius: 24px; border: 1px solid var(--surface);
            padding: 20px; transition: 0.3s; position: relative; overflow: hidden;
        }
        .member-card:hover { border-color: var(--p); transform: translateY(-2px); }
        
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .user-tag { background: rgba(16, 185, 129, 0.1); color: var(--acc); font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 20px; }
        
        .card-body h3 { margin: 0; font-family: 'Outfit'; font-size: 20px; }
        .card-body p { margin: 5px 0 15px; font-size: 12px; color: var(--sub); }

        .metrics { display: flex; gap: 20px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 15px; margin-bottom: 15px; }
        .met-box { display: flex; flex-direction: column; }
        .met-box small { font-size: 9px; font-weight: 800; color: var(--sub); text-transform: uppercase; }
        .met-box span { font-family: 'Outfit'; font-size: 16px; color: white; }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-luxe { 
            background: var(--surface); color: white; border: none; padding: 10px; 
            border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .btn-luxe.prime { background: var(--p); }
        .btn-luxe:active { transform: scale(0.95); }

        /* Loading & Empty States */
        #loadingOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--surface); border-top-color: var(--p); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <p style="font-weight: 800; margin-top: 15px; color: var(--p);">Syncing Luxe Database...</p>
</div>

<div class="header">
    <div class="title-area">
        <h1>Luxe<span>Control</span></h1>
        <div id="syncTime" style="font-size: 10px; color: var(--sub); margin-top: 5px;">Last sync: Just now</div>
    </div>
    <button class="btn-luxe prime" onclick="refreshData()">Sync All</button>
</div>

<div class="stats-grid">
    <div class="stat-item"><label>Members</label><b id="totalUsers">0</b></div>
    <div class="stat-item"><label>Active Meals</label><b id="totalMeals">0</b></div>
    <div class="stat-item"><label>Rev. Total</label><b id="totalRevenue">₹0</b></div>
</div>

<input type="text" id="memberSearch" class="search-bar" placeholder="Search by name or ID..." oninput="filterUsers()">

<div class="member-list" id="memberList">
    <!-- Member Cards Inject Dynamically -->
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", 
        authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let masterData = [];

    window.refreshData = async () => {
        const list = document.getElementById('memberList');
        const overlay = document.getElementById('loadingOverlay');
        overlay.style.display = 'flex';

        try {
            const usersSnap = await getDocs(collection(db, "users"));
            masterData = [];
            let globalMeals = 0;
            let globalRev = 0;

            for (const userDoc of usersSnap.docs) {
                const u = userDoc.data();
                const uid = userDoc.id;
                let userMeals = 0;
                let userWater = 0;
                let userBill = 0;

                // Deep scan logs
                const logsSnap = await getDocs(collection(db, "users", uid, "logs"));
                logsSnap.forEach(lDoc => {
                    const monthData = lDoc.data();
                    Object.values(monthData).forEach(day => {
                        if (day.l) { userMeals++; userBill += (u.mealPrice || 50); }
                        if (day.d) { userMeals++; userBill += (u.mealPrice || 50); }
                        if (day.w) { userWater++; userBill += (u.waterPrice || 30); }
                    });
                });

                masterData.push({ id: uid, ...u, bill: userBill, meals: userMeals, water: userWater });
                globalMeals += userMeals;
                globalRev += userBill;
            }

            // Update Global Stats
            document.getElementById('totalUsers').innerText = masterData.length;
            document.getElementById('totalMeals').innerText = globalMeals;
            document.getElementById('totalRevenue').innerText = `₹${globalRev.toLocaleString()}`;
            document.getElementById('syncTime').innerText = `Last sync: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

            renderList(masterData);
        } catch (err) {
            alert("Sync Failed: " + err.message);
        } finally {
            overlay.style.display = 'none';
        }
    };

    function renderList(data) {
        const container = document.getElementById('memberList');
        container.innerHTML = data.length ? '' : '<p style="text-align:center; color:var(--sub);">No members found</p>';
        
        data.forEach(m => {
            const card = document.createElement('div');
            card.className = 'member-card';
            card.innerHTML = `
                <div class="card-top">
                    <span class="user-tag">PREMIER MEMBER</span>
                    <span style="font-size: 10px; color: var(--sub); font-family: monospace;">${m.id.substring(0,8)}</span>
                </div>
                <div class="card-body">
                    <h3>${m.name || 'Luxe Diner'}</h3>
                    <p>${m.meals > 0 ? 'Recently Active' : 'No recent activity'}</p>
                    
                    <div class="metrics">
                        <div class="met-box"><small>Total Bill</small><span>₹${m.bill}</span></div>
                        <div class="met-box"><small>Meals</small><span>${m.meals}</span></div>
                        <div class="met-box"><small>Water</small><span>${m.water}</span></div>
                    </div>
                </div>
                <div class="btn-row">
                    <button class="btn-luxe" onclick="manageMember('${m.id}', '${m.name}', ${m.mealPrice}, ${m.waterPrice})">Configure</button>
                    <button class="btn-luxe" style="color:#ef4444;" onclick="deleteMember('${m.id}')">Eject Profile</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    window.filterUsers = () => {
        const query = document.getElementById('memberSearch').value.toLowerCase();
        const filtered = masterData.filter(m => 
            (m.name && m.name.toLowerCase().includes(query)) || 
            m.id.toLowerCase().includes(query)
        );
        renderList(filtered);
    };

    window.manageMember = async (id, name, meal, water) => {
        const newName = prompt("Update Name:", name);
        const newMeal = prompt("Update Meal Price (₹):", meal || 50);
        const newWater = prompt("Update Water Price (₹):", water || 30);
        
        if (newName && newMeal && newWater) {
            await updateDoc(doc(db, "users", id), { 
                name: newName, 
                mealPrice: parseInt(newMeal), 
                waterPrice: parseInt(newWater) 
            });
            refreshData();
        }
    };

    window.deleteMember = async (id) => {
        if (confirm("🚨 SECURITY CHECK: This will permanently erase this profile and all financial logs. Proceed?")) {
            await deleteDoc(doc(db, "users", id));
            refreshData();
        }
    };

    // Initial Sync
    refreshData();
</script>
</body>
</html>

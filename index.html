<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grand Farewell Celebration</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #020204; --gold-mid: #d4af37; --gold-pale: #fff5cc; --ivory: #f3ead2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--void); color: var(--ivory); font-family: 'Montserrat', sans-serif; overflow: hidden; height: 100vh; }

        .stage { height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; position: relative; }
        canvas#fxCanvas { position: fixed; inset: 0; z-index: 50; pointer-events: none; }

        .glass {
            width: 90vw; max-width: 650px; padding: 60px;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7), inset 0 0 40px rgba(212, 175, 55, 0.1);
            text-align: center; position: relative; z-index: 10;
        }

        .gold-text { color: var(--gold-mid); text-transform: uppercase; letter-spacing: 6px; font-size: 0.9rem; margin-bottom: 10px; }
        .title { font-family: 'Cinzel Decorative'; font-size: clamp(2.5rem, 8vw, 4.5rem); margin: 20px 0; line-height: 1; text-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        
        .unveil-btn {
            background: transparent; color: var(--gold-pale); border: 1.5px solid var(--gold-mid);
            padding: 20px 50px; cursor: pointer; letter-spacing: 4px; font-weight: 600; font-size: 1rem;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
        }
        .unveil-btn:hover { background: var(--gold-mid); color: var(--void); box-shadow: 0 0 40px var(--gold-mid); transform: scale(1.05); }

        #invitation { display: none; opacity: 0; }
        .show { display: block !important; animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="stage">
    <canvas id="fxCanvas"></canvas>
    <div class="glass" id="card">
        <div id="cover">
            <div class="gold-text">Requesting Your Presence</div>
            <h1 class="title">The Grand<br>Farewell</h1>
            <button class="unveil-btn" id="unveilBtn">UNVEIL INVITATION</button>
        </div>
        <div id="invitation">
            <div class="gold-text" style="margin-bottom: 20px;">In Honor Of</div>
            <h1 class="title" style="font-size: clamp(2rem, 6vw, 3.5rem);">Dr. Upendra Singh<br>Narwaria Sir</h1>
            <p style="font-size: 1.2rem; opacity: 0.9;">Department of Livestock Production Management</p>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    let particles = [];
    class Particle {
        constructor(x, y, vx, vy, color) {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy;
            this.color = color; this.life = 1;
            this.size = Math.random() * 4 + 2;
        }
        update() { this.x += this.vx; this.y += this.vy; this.vy += 0.12; this.life -= 0.008; }
        draw() { 
            ctx.fillStyle = this.color; 
            ctx.globalAlpha = this.life;
            ctx.beginPath(); 
            ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); 
            ctx.fill(); 
        }
    }

    function pop() {
        const colors = ['#FFD700', '#FF4500', '#32CD32', '#1E90FF', '#FF69B4', '#FFFFFF'];
        // Double burst: Left side and Right side
        for(let i=0; i<300; i++) {
            // Left Cannon
            particles.push(new Particle(0, H * 0.8, Math.random()*20, -Math.random()*25, colors[i%6]));
            // Right Cannon
            particles.push(new Particle(W, H * 0.8, -Math.random()*20, -Math.random()*25, colors[i%6]));
        }
    }

    document.getElementById('unveilBtn').onclick = () => {
        document.getElementById('cover').style.display = 'none';
        document.getElementById('invitation').classList.add('show');
        pop();
    };

    function animate() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach((p, i) => {
            p.update(); p.draw();
            if(p.life <= 0) particles.splice(i, 1);
        });
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>

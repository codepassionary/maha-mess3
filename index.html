<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinematic Telemetry Core</title>
    <!-- Leaflet.js CSS for open-source mapping architecture -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-canvas: #030712;
            --surface: #0b1329;
            --border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --brand-prime: #6366f1;
            --brand-glow: rgba(99, 102, 241, 0.15);
            --state-active: #10b981;
            --state-alert: #f43f5e;
            --font-mono: "SF Mono", Monaco, Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Full Screen Split Grid Setup */
        .app-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Left Side Dashboard Control Console */
        .control-console {
            background-color: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            z-index: 10;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        .brand-header h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; }
        .brand-header p { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px; }

        .system-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font-mono);
            text-transform: uppercase;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
        }
        .system-pill.offline { color: var(--text-muted); border-color: var(--border); }
        .system-pill.online { color: var(--state-active); border-color: rgba(16, 185, 129, 0.2); background: rgba(16, 185, 129, 0.02); }

        /* Metrics Data Panel Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .metric-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
        }
        .metric-card label { display: block; font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        .metric-card span { font-size: 18px; font-weight: 700; font-family: var(--font-mono); color: var(--text-main); }
        .metric-card span small { font-size: 10px; color: var(--text-muted); margin-left: 2px; font-weight: 500; }

        /* Controls Panel */
        .btn-action {
            width: 100%;
            background: var(--brand-prime);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            font-family: var(--font-mono);
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px var(--brand-glow);
        }
        .btn-action:hover { background: #4f46e5; }
        .btn-action.halt-state { background: var(--state-alert); box-shadow: 0 4px 12px rgba(244, 63, 94, 0.15); }

        .log-terminal {
            flex-grow: 1;
            background: #020408;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: #4b5563;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            line-height: 1.4;
        }

        /* Right Side Map Workspace Canvas */
        #mapCanvas {
            width: 100%;
            height: 100%;
            background-color: #0c101b;
        }

        /* Customizing Leaflet Map Theme to dark clinical profile */
        .leaflet-container { background: #0c101b !important; }
        .leaflet-bar a { background-color: var(--surface) !important; color: var(--text-main) !important; border-color: var(--border) !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Control Interface Panel -->
        <div class="control-console">
            <div class="brand-header">
                <h1>Spatial Tracker</h1>
                <p>Kinematic Telemetry Ledger</p>
            </div>

            <div id="sysStatus" class="system-pill offline">
                <span>Core State: Standby</span>
                <span id="coordPulse">0.00, 0.00</span>
            </div>

            <div class="metrics-grid">
                <div class="metric-card"><label>Total Distance</label><span id="mDistance">0.00<small>m</small></span></div>
                <div class="metric-card"><label>Current Velocity</label><span id="mVelocity">0.00<small>m/s</small></span></div>
                <div class="metric-card"><label>Max Acceleration</label><span id="mAccel">0.00<small>m/s²</small></span></div>
                <div class="metric-card"><label>Data Frames</label><span id="mFrames">0</span></div>
            </div>

            <button id="toggleEngineBtn" class="btn-action" onclick="toggleTelemetryCore()">Initialize Telemetry Stream</button>

            <div id="terminalStream" class="log-terminal">
                <div>[SYSTEM] Core idling. Ready for spatial deployment...</div>
            </div>
        </div>

        <!-- Interactive Map Geometry Viewport -->
        <div id="mapCanvas"></div>
    </div>

    <!-- Leaflet.js Dependencies -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        'use strict';

        let telemetry = {
            trackingActive: false,
            watchId: null,
            map: null,
            trailLine: null,
            marker: null,
            pathCoords: [], // Master array holding all historical lat/lng nodes
            timestamps: [], // Companion timestamp index array for calculating velocity dynamics
            metrics: {
                totalDistance: 0,
                currentVelocity: 0,
                maxAcceleration: 0,
                framesCaptured: 0
            }
        };

        // Initialize Map Object using standard fallback parameters
        (function bootMapCanvas() {
            // Default center point
            const defaultPosition = [24.5373, 81.3042]; 
            
            telemetry.map = L.map('mapCanvas', {
                zoomControl: true,
                attributionControl: false
            }).setView(defaultPosition, 16);

            // Inject CartoDB Dark Matter tile server layer for a clinical, dark-mode aesthetic
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 20
            }).addTo(telemetry.map);

            // Instantiate empty vector tracking polyline configuration
            telemetry.trailLine = L.polyline([], {
                color: '#6366f1',
                weight: 4,
                opacity: 0.85,
                lineJoin: 'round'
            }).addTo(telemetry.map);
        })();

        function printLog(msg, status = 'SYSTEM') {
            const container = document.getElementById('terminalStream');
            const row = document.createElement('div');
            row.textContent = `[${status}] ${msg}`;
            if(status === 'ERROR') row.style.color = 'var(--state-alert)';
            if(status === 'PULSE') row.style.color = 'var(--state-active)';
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function toggleTelemetryCore() {
            const btn = document.getElementById('toggleEngineBtn');
            const statusPill = document.getElementById('sysStatus');

            if (!telemetry.trackingActive) {
                if (!navigator.geolocation) {
                    printLog("Hardware missing standard GPS receiver arrays.", "ERROR");
                    return;
                }

                telemetry.trackingActive = true;
                btn.textContent = "Halt & Seal Telemetry Stream";
                btn.className = "btn-action halt-state";
                statusPill.className = "system-pill online";
                statusPill.firstElementChild.textContent = "Core State: Tracking Active";
                printLog("Hardware Geolocation thread requested.");

                // Register real-time high-accuracy tracking watcher hook
                telemetry.watchId = navigator.geolocation.watchPosition(
                    processIncomingSpatialFrame, 
                    handleHardwareFault, 
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                // Safely detach background geolocation hardware lines
                navigator.geolocation.clearWatch(telemetry.watchId);
                telemetry.trackingActive = false;
                btn.textContent = "Initialize Telemetry Stream";
                btn.className = "btn-action";
                statusPill.className = "system-pill offline";
                statusPill.firstElementChild.textContent = "Core State: Sealed";
                printLog("Tracking halted. Final analytics matrix archived.");
            }
        }

        function processIncomingSpatialFrame(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const now = Date.now();

            document.getElementById('coordPulse').textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            
            const currentPoint = L.latLng(lat, lng);
            telemetry.pathCoords.push(currentPoint);
            telemetry.timestamps.push(now);

            // Append new vertex node directly to map trail polyline
            telemetry.trailLine.addLatLng(currentPoint);

            // Anchor current location marker
            if (!telemetry.marker) {
                telemetry.marker = L.circleMarker(currentPoint, {
                    radius: 6,
                    color: '#10b981',
                    fillColor: '#10b981',
                    fillOpacity: 1
                }).addTo(telemetry.map);
            } else {
                telemetry.marker.setLatLng(currentPoint);
            }

            // Pan view map viewport to focus on active student coordinate point
            telemetry.map.panTo(currentPoint);

            // Execute Kinematic Vector Calculations
            telemetry.metrics.framesCaptured++;
            calculateKinematicsAnalysis(currentPoint, now);
            updateDashboardLayout();
        }

        function calculateKinematicsAnalysis(currentPoint, now) {
            const index = telemetry.pathCoords.length - 1;
            if (index === 0) {
                printLog("Spatial anchor established successfully.", "PULSE");
                return;
            }

            const priorPoint = telemetry.pathCoords[index - 1];
            const priorTimestamp = telemetry.timestamps[index - 1];

            // 1. Calculate step distance using internal Haversine metrics
            const deltaDistance = priorPoint.distanceTo(currentPoint); // Outputs directly in meters
            telemetry.metrics.totalDistance += deltaDistance;

            // 2. Compute dynamic instantaneous velocity matrix
            const deltaTimeSec = (now - priorTimestamp) / 1000;
            let currentVelocity = deltaTimeSec > 0 ? (deltaDistance / deltaTimeSec) : 0;
            
            // Filter noise spikes from standard browser geolocation inaccuracies
            if(currentVelocity > 45) currentVelocity = telemetry.metrics.currentVelocity;

            // 3. Compute acceleration curve patterns
            const deltaVelocity = currentVelocity - telemetry.metrics.currentVelocity;
            const currentAcceleration = deltaTimeSec > 0 ? Math.abs(deltaVelocity / deltaTimeSec) : 0;

            if (currentAcceleration > telemetry.metrics.maxAcceleration && index > 1) {
                telemetry.metrics.maxAcceleration = currentAcceleration;
            }

            telemetry.metrics.currentVelocity = currentVelocity;
            printLog(`Captured Frame [${index}] -> Move Delta: ${deltaDistance.toFixed(2)}m @ ${currentVelocity.toFixed(2)}m/s`, "PULSE");
        }

        function updateDashboardLayout() {
            document.getElementById('mDistance').innerHTML = `${telemetry.metrics.totalDistance.toFixed(2)}<small>m</small>`;
            document.getElementById('mVelocity').innerHTML = `${telemetry.metrics.currentVelocity.toFixed(2)}<small>m/s</small>`;
            document.getElementById('mAccel').innerHTML = `${telemetry.metrics.maxAcceleration.toFixed(3)}<small>m/s²</small>`;
            document.getElementById('mFrames').textContent = telemetry.metrics.framesCaptured;
        }

        function handleHardwareFault(err) {
            printLog(`Hardware Fault code [${err.code}]: ${err.message}`, "ERROR");
        }
    </script>
</body>
</html>

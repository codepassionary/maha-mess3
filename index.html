<!-- Add this section into your existing Admin App HTML, inside the header or a new 'System' tab -->
<div class="stat-card" style="background: #1e293b; border: 1px dashed var(--p);">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <div style="font-size: 11px; font-weight: 800; color: var(--p);">SYSTEM STATUS</div>
            <div id="mStatusLabel" style="font-family:'Outfit'; font-size: 20px;">Live</div>
        </div>
        <button id="mToggleBtn" class="btn-luxe prime" onclick="toggleMaintenance()">Toggle Maintenance</button>
    </div>
    <div style="margin-top: 15px;">
        <label style="font-size: 10px; color: var(--sub);">ADMIN UIDs (Comma Separated)</label>
        <input type="text" id="adminListInput" class="search-bar" style="margin-top:5px;" placeholder="Paste Firebase UIDs here...">
        <button class="btn-luxe" style="width:100%; margin-top:5px;" onclick="saveAdmins()">Update Admin Access</button>
    </div>
</div>

<script type="module">
    // Add these functions to your existing Admin <script>
    import { doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Listen for System Config
    onSnapshot(doc(db, "system", "config"), (snap) => {
        if (snap.exists()) {
            const data = snap.data();
            const isM = data.maintenanceMode;
            document.getElementById('mStatusLabel').innerText = isM ? "Maintenance Active" : "System Live";
            document.getElementById('mStatusLabel').style.color = isM ? "#ef4444" : "#10B981";
            document.getElementById('mToggleBtn').innerText = isM ? "Go Live" : "Start Maintenance";
            document.getElementById('adminListInput').value = (data.adminUIDs || []).join(", ");
        }
    });

    window.toggleMaintenance = async () => {
        const docRef = doc(db, "system", "config");
        const snap = await getDoc(docRef);
        const current = snap.exists() ? snap.data().maintenanceMode : false;
        await setDoc(docRef, { maintenanceMode: !current }, { merge: true });
    };

    window.saveAdmins = async () => {
        const uids = document.getElementById('adminListInput').value.split(",").map(id => id.trim());
        await setDoc(doc(db, "system", "config"), { adminUIDs: uids }, { merge: true });
        alert("Admins Updated! Only these UIDs can bypass maintenance.");
    };
</script>

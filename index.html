<style>
    .edit-sheet {
        position: fixed; inset: 0; background: rgba(0,0,0,0.9);
        display: none; flex-direction: column; padding: 30px; z-index: 10000;
        overflow-y: auto;
    }
    .edit-sheet.active { display: flex; }
    .day-row {
        display: flex; justify-content: space-between; align-items: center;
        background: rgba(255,255,255,0.05); padding: 10px 15px;
        border-radius: 12px; margin-bottom: 8px; font-size: 13px;
    }
    .toggle-btn {
        padding: 5px 10px; border-radius: 8px; border: 1px solid var(--p);
        background: transparent; color: white; cursor: pointer; font-size: 10px;
    }
    .toggle-btn.on { background: var(--p); }
    .close-edit { margin-bottom: 20px; color: var(--p); font-weight: 800; cursor: pointer; }
</style>

<div id="editSheet" class="edit-sheet">
    <div class="close-edit" onclick="closeEdit()">← Back to Dashboard</div>
    <h2 id="editStudentName" style="font-family:'Outfit'; margin-bottom:5px;">Student Name</h2>
    <p style="color:var(--sub); font-size:12px; margin-bottom:20px;">Modify logs for current month</p>
    <div id="daysList"></div>
</div>

<script type="module">
    // ... (Keep existing imports and config)

    let currentEditingUid = null;
    let currentEditingLogs = {};

    async function fetchAllData() {
        const list = document.getElementById('studentList');
        const monthKey = `${new Date().getFullYear()}_${new Date().getMonth()}`;
        let grandTotal = 0;

        try {
            const usersSnap = await getDocs(collection(db, "users"));
            list.innerHTML = "";
            
            for (const userDoc of usersSnap.docs) {
                const u = userDoc.data();
                const logSnap = await getDoc(doc(db, "users", userDoc.id, "logs", monthKey));
                const logs = logSnap.exists() ? logSnap.data() : {};
                
                let m=0, w=0;
                Object.values(logs).forEach(v => { if(v.l) m++; if(v.d) m++; if(v.w) w++; });
                const bill = (m * (u.mealPrice || 50)) + (w * (u.waterPrice || 30));
                grandTotal += bill;

                const card = document.createElement('div');
                card.className = "student-card";
                card.onclick = () => openEdit(userDoc.id, u.name, logs);
                card.innerHTML = `
                    <span><strong>${u.name || 'User'}</strong><br><small>${m} Meals | ${w} Water</small></span>
                    <span class="amt">₹${bill}</span>
                `;
                list.appendChild(card);
            }
            document.getElementById('totalCollection').innerText = "₹" + grandTotal.toLocaleString('en-IN');
        } catch (e) {
            console.error(e);
        }
    }

    window.openEdit = (uid, name, logs) => {
        currentEditingUid = uid;
        currentEditingLogs = logs;
        document.getElementById('editStudentName').innerText = name;
        document.getElementById('editSheet').classList.add('active');
        renderDays();
    };

    window.closeEdit = () => {
        document.getElementById('editSheet').classList.remove('active');
        fetchAllData(); // Refresh main list
    };

    function renderDays() {
        const container = document.getElementById('daysList');
        container.innerHTML = "";
        const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();

        for (let i = 1; i <= daysInMonth; i++) {
            const d = currentEditingLogs[i] || { l: 0, d: 0, w: 0 };
            const row = document.createElement('div');
            row.className = "day-row";
            row.innerHTML = `
                <span style="font-weight:800; width:30px;">${i}</span>
                <button class="toggle-btn ${d.l?'on':''}" onclick="toggleCell(${i},'l')">Lunch</button>
                <button class="toggle-btn ${d.d?'on':''}" onclick="toggleCell(${i},'d')">Dinner</button>
                <button class="toggle-btn ${d.w?'on':''}" onclick="toggleCell(${i},'w')">Water</button>
            `;
            container.appendChild(row);
        }
    }

    window.toggleCell = async (day, type) => {
        if (!currentEditingLogs[day]) currentEditingLogs[day] = { l: 0, d: 0, w: 0, n: "" };
        currentEditingLogs[day][type] = currentEditingLogs[day][type] ? 0 : 1;
        
        const monthKey = `${new Date().getFullYear()}_${new Date().getMonth()}`;
        await setDoc(doc(db, "users", currentEditingUid, "logs", monthKey), {
            [day]: currentEditingLogs[day]
        }, { merge: true });
        
        renderDays(); // Update UI
    };
</script>

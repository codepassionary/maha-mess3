<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Network Verified Attendance</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #16a34a;
            --danger: #dc2626;
            --background: #f3f4f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 5px;
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #6b7280;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .pulse-tracker-ui {
            background-color: #f3f4f6;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
            border: 1px solid #e5e7eb;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 25px;
            background-color: #e5e7eb;
            color: #374151;
            transition: all 0.2s ease;
        }

        .status-badge.inside {
            background-color: #dcfce7;
            color: var(--success);
        }

        .status-badge.outside {
            background-color: #fee2e2;
            color: var(--danger);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }

        .btn:hover {
            background-color: #4338ca;
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #log {
            margin-top: 20px;
            max-height: 140px;
            overflow-y: auto;
            border-top: 1px solid #e5e7eb;
            padding-top: 15px;
            font-size: 12px;
            color: #4b5563;
            text-align: left;
        }

        .log-entry {
            margin-bottom: 4px;
            padding: 6px;
            border-radius: 4px;
            background: #f9fafb;
            border-left: 3px solid #cbd5e1;
        }
        
        .log-entry.flagged {
            border-left-color: var(--danger);
            background-color: #fff5f5;
            color: var(--danger);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Class Verification</h1>
        <p class="subtitle">Secure Anti-Proxy Terminal</p>

        <div id="pulseCounterUI" class="pulse-tracker-ui">
            Active Block: 0 / 3
        </div>

        <div id="statusBadge" class="status-badge">Establishing Integrity...</div>

        <button id="checkInBtn" class="btn" disabled>Submit Status</button>

        <div id="log">
            <strong>Security Log Sequence:</strong>
            <div id="logContents"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // Fixed Parameters
            const CONFIG = Object.freeze({
                TARGET_LAT: 24.500893,
                TARGET_LNG: 81.291928,
                ALLOWED_RADIUS: 65,
                MAX_GPS_ACCURACY: 40,
                PULSE_INTERVAL_MS: 1200000, // 20 minutes
                MAX_PULSES: 3,
                MAX_VELOCITY_MPS: 28 // ~100 km/h max plausible speed limit between jumps
            });

            // State management closed off from window scope
            let state = {
                pulseCount: 0,
                lastPulseTime: 0,
                lastLat: null,
                lastLng: null,
                isCompromised: false,
                verifiedToken: null
            };

            const UI = Object.freeze({
                badge: document.getElementById('statusBadge'),
                btn: document.getElementById('checkInBtn'),
                logs: document.getElementById('logContents'),
                counter: document.getElementById('pulseCounterUI')
            });

            function geoMath(lat1, lon1, lat2, lon2) {
                const R = 6371e3;
                const p1 = lat1 * Math.PI / 180;
                const p2 = lat2 * Math.PI / 180;
                const dPhi = (lat2 - lat1) * Math.PI / 180;
                const dLam = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dPhi/2) * Math.sin(dPhi/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dLam/2) * Math.sin(dLam/2);
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            }

            function writeLog(msg, isWarning = false) {
                const entry = document.createElement('div');
                entry.className = `log-entry ${isWarning ? 'flagged' : ''}`;
                entry.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${msg}`;
                UI.logs.insertBefore(entry, UI.logs.firstChild);
            }

            function triggerSecurePulse() {
                if (state.isCompromised) return;

                if (state.pulseCount >= CONFIG.MAX_PULSES) {
                    UI.badge.textContent = "Session Concluded";
                    UI.badge.className = "status-badge";
                    writeLog("Monitoring metrics finalized for this scheduled track loop.");
                    return;
                }

                state.pulseCount++;
                UI.counter.textContent = `Active Block: ${state.pulseCount} / 3`;
                writeLog(`Running signature array verification #${state.pulseCount}...`);

                navigator.geolocation.getCurrentPosition(processSignal, handleHardwareError, {
                    enableHighAccuracy: true,
                    timeout: 9000,
                    maximumAge: 0
                });
            }

            function processSignal(position) {
                if (state.isCompromised) return;

                // Loophole Shield 1: Hardware Object Redefinition Protection
                if (!position || !position.coords || position.mocked === true) {
                    flagExploit("Virtual Mock Environment Intercepted.");
                    return;
                }

                const now = performance.now(); // High resolution relative timing unlinked to clock manipulation
                const currentLat = position.coords.latitude;
                const currentLng = position.coords.longitude;
                const currentAcc = position.coords.accuracy;

                // Loophole Shield 2: Temporal Anomaly Check (System clock skipping)
                if (state.lastPulseTime !== 0) {
                    const elapsedRealTime = now - state.lastPulseTime;
                    if (elapsedRealTime < (CONFIG.PULSE_INTERVAL_MS - 10000)) { 
                        flagExploit("Clock acceleration anomalies caught.");
                        return;
                    }
                }

                // Loophole Shield 3: Fast Geolocation Teleportation / Jump Check
                if (state.lastLat !== null && state.lastLng !== null) {
                    const travelDistance = geoMath(currentLat, currentLng, state.lastLat, state.lastLng);
                    const timeDeltaSec = (now - state.lastPulseTime) / 1000;
                    const impliedVelocity = travelDistance / timeDeltaSec;

                    if (impliedVelocity > CONFIG.MAX_VELOCITY_MPS) {
                        flagExploit("Improbable velocity vector signature found.");
                        return;
                    }
                }

                // Loophole Shield 4: Low-Resolution Core Network Filtering
                if (currentAcc > CONFIG.MAX_GPS_ACCURACY) {
                    UI.badge.textContent = "Signal Untrusted";
                    UI.badge.className = "status-badge outside";
                    UI.btn.disabled = true;
                    writeLog("Verification Dropped: Insufficient hardware telemetry resolve.", true);
                    return;
                }

                const distanceToTarget = geoMath(currentLat, currentLng, CONFIG.TARGET_LAT, CONFIG.TARGET_LNG);

                if (distanceToTarget <= CONFIG.ALLOWED_RADIUS) {
                    UI.badge.textContent = "Perimeter Confirmed";
                    UI.badge.className = "status-badge inside";
                    UI.btn.disabled = false;
                    
                    // Transient Single-use dynamic verification tokens
                    state.verifiedToken = crypto.randomUUID();
                    
                    state.lastLat = currentLat;
                    state.lastLng = currentLng;
                    state.lastPulseTime = now;
                    writeLog(`Block sequence #${state.pulseCount} validation checks cleared.`);
                } else {
                    UI.badge.textContent = "Outside Boundary";
                    UI.badge.className = "status-badge outside";
                    UI.btn.disabled = true;
                    state.verifiedToken = null;
                    writeLog(`Block sequence #${state.pulseCount} mismatch registered.`, true);
                }
            }

            function flagExploit(reason) {
                state.isCompromised = true;
                UI.btn.disabled = true;
                UI.badge.textContent = "Security Failure";
                UI.badge.className = "status-badge outside";
                writeLog(`CRITICAL CRACK ATTEMPT: ${reason} Session Permanently Halted.`, true);
            }

            function handleHardwareError(err) {
                UI.btn.disabled = true;
                UI.badge.textContent = "Hardware Error";
                UI.badge.className = "status-badge outside";
                writeLog("Device tracking interface channel rejected.", true);
            }

            UI.btn.addEventListener('click', function(e) {
                // Loophole Shield 5: Synthetic Automation Click Protections
                if (!e.isTrusted || String(e.clientX) === "0") {
                    flagExploit("UI automated injection proxy block triggered.");
                    return;
                }

                if (state.verifiedToken) {
                    writeLog(`🎉 Metrics locked and verified for checkpoint ${state.pulseCount}/3.`);
                    alert(`Attendance sequence logged!`);
                    state.verifiedToken = null; // Instantly purge token from client memory
                    UI.btn.disabled = true;
                }
            });

            // Initialization execution isolation
            if (navigator.geolocation) {
                triggerSecurePulse();
                setInterval(triggerSecurePulse, CONFIG.PULSE_INTERVAL_MS);
            } else {
                UI.badge.textContent = "Terminal Locked";
                writeLog("Device environment signature missing cryptographic dependencies.", true);
            }
        })();
    </script>
</body>
</html>

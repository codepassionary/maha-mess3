<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VetTrack | Luxe Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #FF8C00; --bg: #0B0F1A; --card: rgba(30, 41, 59, 0.7); 
            --glass: rgba(255, 255, 255, 0.05); --text: #FFFFFF; --sub: #94A3B8;
        }

        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden;
        }

        /* Glassmorphic Header */
        header {
            position: sticky; top: 0; z-index: 100; padding: 20px;
            background: rgba(11, 15, 26, 0.8); backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo { font-family: 'Outfit'; font-size: 24px; font-weight: 800; }
        .logo span { color: var(--p); }

        /* Product Grid */
        .container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }

        .product-card {
            background: var(--card); border-radius: 24px; padding: 15px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .product-card:active { transform: scale(0.95); }

        .product-img { 
            width: 100%; aspect-ratio: 1; border-radius: 18px; 
            background: var(--glass); object-fit: cover; margin-bottom: 12px;
        }

        .product-name { font-weight: 700; font-size: 14px; margin-bottom: 5px; }
        .product-price { color: var(--p); font-weight: 800; font-size: 16px; }

        .add-btn {
            width: 100%; margin-top: 12px; padding: 10px; border-radius: 12px;
            border: none; background: var(--p); color: white; font-weight: 700;
            cursor: pointer; font-size: 12px;
        }

        /* Shopping Cart (Sliding) */
        #cartPanel {
            position: fixed; right: -100%; top: 0; width: 85%; height: 100%;
            background: #0F172A; z-index: 200; transition: 0.4s ease;
            padding: 30px 20px; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        #cartPanel.open { right: 0; }

        .cart-count { 
            background: var(--p); color: white; padding: 2px 8px; 
            border-radius: 10px; font-size: 10px; vertical-align: middle;
        }

        .sync-status { font-size: 10px; color: var(--sub); text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Vet<span>Store.</span></div>
    <div onclick="toggleCart()" style="cursor:pointer">
        🛒 <span id="cartBadge" class="cart-count">0</span>
    </div>
</header>

<div class="container" id="productGrid">
    <!-- Products will be injected here -->
</div>

<div id="cartPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h2 style="font-family:'Outfit'; margin:0;">Your Inventory</h2>
        <button onclick="toggleCart()" style="background:none; border:none; color:white; font-size:24px;">×</button>
    </div>
    <div id="cartItems"></div>
    <button class="btn-prime" style="width:100%; padding:20px; margin-top:20px; background:var(--p); color:white; border:none; border-radius:15px; font-weight:800;" onclick="checkout()">CHECKOUT</button>
    <div id="syncLog" class="sync-status">All systems synced to Firebase</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, updateDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- FIREBASE CONFIG ---
    const firebaseConfig = { 
        apiKey: "YOUR_API_KEY", 
        projectId: "YOUR_PROJECT_ID" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const USER_ID = "NDVSU_STUDENT_01"; // Identifies you as a student

    // --- SAMPLE CLINICAL DATA ---
    const products = [
        { id: 'v01', name: 'Littmann Stethoscope', price: 8500, img: 'https://images.unsplash.com/photo-1584982324572-755d1333e382?auto=format&fit=crop&q=80&w=200' },
        { id: 'v02', name: 'Clinical Lab Apron', price: 1200, img: 'https://images.unsplash.com/photo-1584036561566-baf8f5f1b144?auto=format&fit=crop&q=80&w=200' },
        { id: 'v03', name: 'Veterinary Anatomy Guide', price: 2450, img: 'https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&q=80&w=200' }
    ];

    let cart = [];
    let pendingSync = [];

    // --- RENDER UI ---
    const grid = document.getElementById('productGrid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="product-card">
                <img src="${p.img}" class="product-img">
                <div class="product-name">${p.name}</div>
                <div class="product-price">₹${p.price}</div>
                <button class="add-btn" onclick="addToCart('${p.id}')">ADD TO CART</button>
            </div>
        `;
    });

    // --- CORE LOGIC ---
    window.addToCart = async (id) => {
        const product = products.find(p => p.id === id);
        cart.push(product);
        updateUI();
        
        if (window.navigator.vibrate) window.navigator.vibrate(40); // Clinical Haptic

        // Network Resilience Logic
        if (navigator.onLine) {
            syncToFirebase(product);
        } else {
            pendingSync.push(product);
            document.getElementById('syncLog').innerText = `Offline: ${pendingSync.length} items waiting to sync...`;
        }
    };

    async function syncToFirebase(product) {
        try {
            const cartRef = doc(db, "carts", USER_ID);
            await updateDoc(cartRef, {
                items: arrayUnion({
                    id: product.id,
                    price: product.price,
                    timestamp: serverTimestamp()
                })
            });
            document.getElementById('syncLog').innerText = "Cloud Sync Complete";
        } catch (e) {
            pendingSync.push(product);
        }
    }

    // Auto-sync when internet returns
    window.addEventListener('online', async () => {
        if (pendingSync.length > 0) {
            for (const item of pendingSync) {
                await syncToFirebase(item);
            }
            pendingSync = [];
        }
    });

    function updateUI() {
        document.getElementById('cartBadge').innerText = cart.length;
        const list = document.getElementById('cartItems');
        list.innerHTML = cart.map(i => `<div style="padding:10px; border-bottom:1px solid #334155; display:flex; justify-content:space-between;"><span>${i.name}</span><span>₹${i.price}</span></div>`).join('');
    }

    window.toggleCart = () => {
        document.getElementById('cartPanel').classList.toggle('open');
    };
</script>
</body>
</html>

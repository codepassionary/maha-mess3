<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetAuth | Multi-User Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #FF8C00; --bg: #0B0F1A; --card: rgba(30, 41, 59, 0.7); --text: #FFFFFF; }
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .auth-card {
            background: var(--card); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.1);
            text-align: center; width: 320px;
        }

        .google-btn {
            background: white; color: #1E293B; border: none; padding: 15px 25px;
            border-radius: 15px; font-weight: 700; cursor: pointer; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .google-btn:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="auth-card">
    <h2 style="font-weight: 800; margin-bottom: 30px;">NDVSU <span>Portal</span></h2>
    <button class="google-btn" onclick="signInWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18">
        Sign in with Google
    </button>
    <div id="status" style="margin-top: 20px; font-size: 12px; color: #94A3B8;"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { /* Paste your config here */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // --- GOOGLE SIGN-IN LOGIC ---
    window.signInWithGoogle = async () => {
        try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            
            // Check if user exists in Firestore, if not, create profile
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    name: user.displayName,
                    email: user.email,
                    photo: user.photoURL,
                    batch: "Batch A", // Defaulting to your batch
                    role: "student",
                    createdAt: new Date()
                });
            }
            
            if (window.navigator.vibrate) window.navigator.vibrate(50); // Haptic feedback
            document.getElementById('status').innerText = `Welcome, ${user.displayName}`;
        } catch (error) {
            console.error("Auth Error:", error);
        }
    };

    // --- TRACK MULTIPLE USERS ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            console.log("Logged in:", user.uid);
            // Redirect to home/dashboard
        } else {
            console.log("No user signed in.");
        }
    });
</script>
</body>
</html>

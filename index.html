<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Attendance Matrix</title>
    <style>
        :root {
            --bg-canvas: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --brand: #4f46e5;
            --brand-dim: #eeebff;
            
            --success: #10b981;
            --success-dim: #e6fbf4;
            --danger: #ef4444;
            --danger-dim: #fdf2f2;
            --amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
            width: 100%;
            max-width: 420px;
            padding: 36px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .status-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            background-color: var(--bg-canvas);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-pill.inside {
            background-color: var(--success-dim);
            border-color: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .status-pill.outside {
            background-color: var(--danger-dim);
            border-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        /* Metrics Progress Bars Layout */
        .metric-group {
            margin-bottom: 24px;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .metric-val {
            font-family: monospace;
            color: var(--text-primary);
        }

        .progress-track {
            background-color: var(--bg-canvas);
            border: 1px solid var(--border);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 1s linear, background-color 0.3s ease;
        }

        #timeBar {
            background-color: var(--brand);
        }

        #attendanceBar {
            background-color: var(--success);
        }

        /* Clean Terminal Logs */
        .log-section {
            margin-top: 32px;
            border-top: 1px solid var(--border);
            padding-top: 24px;
        }

        .log-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .log-wrapper {
            max-height: 90px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-row {
            font-size: 12px;
            line-height: 1.4;
            color: var(--text-secondary);
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .log-row span {
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Autonomous Attendance</h1>
            <p>Real-time Spatial Validation</p>
        </div>

        <div class="status-container">
            <div id="statusBadge" class="status-pill">Initializing Precision Stream...</div>
        </div>

        <!-- Metric 1: Timeline Progress -->
        <div class="metric-group">
            <div class="metric-header">
                <span>Session Duration</span>
                <span id="timeVal" class="metric-val">0%</span>
            </div>
            <div class="progress-track">
                <div id="timeBar" class="progress-bar"></div>
            </div>
        </div>

        <!-- Metric 2: Valid Location Presence Scale -->
        <div class="metric-group">
            <div class="metric-header">
                <span>Attendance Verified</span>
                <span id="attendanceVal" class="metric-val">0%</span>
            </div>
            <div class="progress-track">
                <div id="attendanceBar" class="progress-bar"></div>
            </div>
        </div>

        <div class="log-section">
            <div class="log-title">Live Telemetry Trail</div>
            <div id="logContents" class="log-wrapper"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const CONFIG = Object.freeze({
                TARGET_LAT: 24.500893,
                TARGET_LNG: 81.291928,
                ALLOWED_RADIUS: 65,
                MAX_GPS_ACCURACY: 40,
                SESSION_TOTAL_SECONDS: 3600 // 1 Hour total monitoring runtime window
            });

            let state = {
                elapsedSeconds: 0,
                verifiedSeconds: 0,
                isCompromised: false,
                lastLat: null,
                lastLng: null,
                lastPulseTime: 0
            };

            const UI = Object.freeze({
                badge: document.getElementById('statusBadge'),
                logs: document.getElementById('logContents'),
                timeBar: document.getElementById('timeBar'),
                timeVal: document.getElementById('timeVal'),
                attendanceBar: document.getElementById('attendanceBar'),
                attendanceVal: document.getElementById('attendanceVal')
            });

            function geoMath(lat1, lon1, lat2, lon2) {
                const R = 6371e3;
                const p1 = lat1 * Math.PI / 180;
                const p2 = lat2 * Math.PI / 180;
                const dPhi = (lat2 - lat1) * Math.PI / 180;
                const dLam = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dPhi/2) * Math.sin(dPhi/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dLam/2) * Math.sin(dLam/2);
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            }

            function writeLog(msg) {
                const row = document.createElement('div');
                row.className = 'log-row';
                row.innerHTML = `<span>[${new Date().toLocaleTimeString([], {hour12: false})}]</span> ${msg}`;
                UI.logs.insertBefore(row, UI.logs.firstChild);
                if (UI.logs.childNodes.length > 20) UI.logs.removeChild(UI.logs.lastChild);
            }

            // Central Execution Heartbeat - Fires every single second automatically
            function systemHeartbeat() {
                if (state.isCompromised) return;

                if (state.elapsedSeconds >= CONFIG.SESSION_TOTAL_SECONDS) {
                    UI.badge.textContent = "Session Complete";
                    UI.badge.className = "status-pill";
                    writeLog("Monitoring allocation framework reached target duration limit.");
                    return;
                }

                // Increment overall tracked timeline
                state.elapsedSeconds++;
                const timePercentage = (state.elapsedSeconds / CONFIG.SESSION_TOTAL_SECONDS) * 100;
                UI.timeBar.style.width = `${timePercentage}%`;
                UI.timeVal.textContent = `${Math.floor(timePercentage)}%`;

                // Query precise geolocation hardware structure
                navigator.geolocation.getCurrentPosition(evaluateTelemetry, handleHardwareFault, {
                    enableHighAccuracy: true,
                    timeout: 950, // Strict timeout window to guarantee consistent 1-second ticks
                    maximumAge: 0
                });
            }

            function evaluateTelemetry(position) {
                if (state.isCompromised) return;

                // Anti-Proxy Layer: Intercept virtual hardware hooks
                if (!position || !position.coords || position.mocked === true) {
                    flagExploit();
                    return;
                }

                const now = performance.now();
                const uLat = position.coords.latitude;
                const uLng = position.coords.longitude;
                const uAcc = position.coords.accuracy;

                // Anti-Proxy Layer: Velocity Leap Inspection (Max 35 m/s or ~126 km/h within 1 second frame)
                if (state.lastLat !== null && state.lastLng !== null && state.lastPulseTime !== 0) {
                    const distanceDelta = geoMath(uLat, uLng, state.lastLat, state.lastLng);
                    if (distanceDelta > 35) {
                        flagExploit();
                        return;
                    }
                }

                // Anti-Proxy Layer: Low precision network simulation restriction
                if (uAcc > CONFIG.MAX_GPS_ACCURACY) {
                    UI.badge.textContent = "Signal Untrusted";
                    UI.badge.className = "status-pill outside";
                    return;
                }

                // Compliance Distance Radius Engine
                const distanceToTarget = geoMath(uLat, uLng, CONFIG.TARGET_LAT, CONFIG.TARGET_LNG);

                if (distanceToTarget <= CONFIG.ALLOWED_RADIUS) {
                    UI.badge.textContent = "Active Presence Verified";
                    UI.badge.className = "status-pill inside";

                    // Increment valid location attendance progress
                    state.verifiedSeconds++;
                    const attendancePercentage = (state.verifiedSeconds / CONFIG.SESSION_TOTAL_SECONDS) * 100;
                    UI.attendanceBar.style.width = `${attendancePercentage}%`;
                    UI.attendanceVal.textContent = `${Math.floor(attendancePercentage)}%`;
                    
                    state.lastLat = uLat;
                    state.lastLng = uLng;
                    state.lastPulseTime = now;
                } else {
                    UI.badge.textContent = "Outside Target Boundary";
                    UI.badge.className = "status-pill outside";
                }
            }

            function flagExploit() {
                state.isCompromised = true;
                sessionStorage.setItem('sec_lockout_active', 'true');
                UI.badge.textContent = "Security Isolation";
                UI.badge.className = "status-pill outside";
                UI.timeBar.style.backgroundColor = "var(--danger)";
                UI.attendanceBar.style.backgroundColor = "var(--danger)";
                writeLog("Terminal isolation initiated: Unauthorized system parameters detected.");
            }

            function handleHardwareFault() {
                UI.badge.textContent = "Telemetry Interrupted";
                UI.badge.className = "status-pill outside";
            }

            // Safe Boot Interface Validation Loop
            if (navigator.geolocation) {
                if (sessionStorage.getItem('sec_lockout_active') === 'true') {
                    flagExploit();
                } else {
                    writeLog("Awaiting localized tracking sequence hooks...");
                    setInterval(systemHeartbeat, 1000);
                }
            } else {
                UI.badge.textContent = "Incompatible Device";
                writeLog("Device environment signature missing strict cryptographic telemetry hooks.");
            }
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Biometric Gateway</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
    <style>
        :root { --bg: #09090b; --primary: #3b82f6; --success: #10b981; --error: #ef4444; --text: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { width: 90%; max-width: 400px; padding: 20px; text-align: center; border: 1px solid #27272a; border-radius: 16px; background: #18181b; }
        video { width: 100%; border-radius: 8px; transform: scaleX(-1); }
        button { width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="box" id="ui">
    <h2 id="title">Biometric Gateway</h2>
    <video id="video" autoplay playsinline muted></video>
    <div id="status">Loading AI Engine...</div>
    <div id="controls">
        <button onclick="run('register')">Register Identity</button>
        <button onclick="run('verify')">Verify Identity</button>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const CFG = { modelUri: 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model' };

    async function init() {
        try {
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(CFG.modelUri),
                faceapi.nets.faceLandmark68Net.loadFromUri(CFG.modelUri),
                faceapi.nets.faceRecognitionNet.loadFromUri(CFG.modelUri)
            ]);
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            status.innerText = "System Ready";
        } catch (e) {
            status.innerText = "Error: Check Camera/Network";
        }
    }

    async function run(mode) {
        status.innerText = "Analyzing...";
        try {
            const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224 });
            const result = await faceapi.detectSingleFace(video, options).withFaceLandmarks().withFaceDescriptor();

            if (!result) return status.innerText = "No face detected.";

            if (mode === 'register') {
                localStorage.setItem('bio', JSON.stringify(Array.from(result.descriptor)));
                status.innerText = "Identity Registered!";
            } else {
                const stored = localStorage.getItem('bio');
                if (!stored) return status.innerText = "No identity found.";
                const dist = faceapi.euclideanDistance(new Float32Array(JSON.parse(stored)), result.descriptor);
                status.innerText = dist < 0.6 ? "Access Granted" : "Access Denied";
                status.style.color = dist < 0.6 ? "var(--success)" : "var(--error)";
            }
        } catch (e) {
            status.innerText = "Engine Error. Try again.";
        }
    }

    init();
</script>
</body>
</html>

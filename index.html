<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Attendance Matrix</title>
    <style>
        :root {
            --bg-canvas: #090d16;
            --surface: #111827;
            --border: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --brand: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            padding: 36px;
            text-align: center;
        }

        .header h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
        .header p { font-size: 13px; color: var(--text-secondary); margin-bottom: 28px; }

        .status-pill {
            display: inline-flex;
            align-items: center;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            margin-bottom: 28px;
            transition: all 0.3s ease;
        }

        .status-pill.syncing { color: var(--brand); }
        .status-pill.active { color: var(--success); }
        .status-pill.isolated { color: var(--danger); }
        .status-pill.warning { color: var(--warning); }

        .metric-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .progress-track {
            background-color: #1f2937;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--brand);
            transition: width 0.3s linear;
        }

        #attendanceBar { background-color: var(--success); }

        /* Subtle Prompt Overlay if a human identity pulse verification check fails */
        .identity-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 30px;
        }
        .identity-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            max-width: 340px;
            text-align: center;
        }
        .identity-box h2 { font-size: 18px; margin-bottom: 12px; }
        .identity-box p { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
        .verify-btn {
            background: var(--brand);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .console {
            font-family: monospace;
            font-size: 11px;
            color: #6b7280;
            text-align: left;
            max-height: 90px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 16px;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Attendance Terminal</h1>
            <p>Smart Security Presence Node</p>
        </div>

        <div class="status-container">
            <div id="statusBadge" class="status-pill syncing">Syncing environmental hooks...</div>
        </div>

        <div class="metric-container">
            <div class="metric-row"><span>Session Timeline</span><span id="timeVal">0%</span></div>
            <div class="progress-track"><div id="timeBar" class="progress-bar"></div></div>
        </div>

        <div class="metric-container">
            <div class="metric-row"><span>Verified Presence</span><span id="attendanceVal">0%</span></div>
            <div class="progress-track"><div id="attendanceBar" class="progress-bar"></div></div>
        </div>

        <div id="consoleLog" class="console">Booting system sensors...</div>
    </div>

    <!-- Security Overlay for Identity Checks -->
    <div id="identityOverlay" class="identity-overlay">
        <div class="identity-box">
            <h2>Identity Verification Required</h2>
            <p>To ensure your tracking session stays active, please pass a quick identity verification check.</p>
            <button id="verifyIdentityBtn" class="verify-btn">Verify Identity</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const CONFIG = Object.freeze({
                TARGET_LAT: 24.507607,
                TARGET_LNG: 81.298394,
                ALLOWED_RADIUS_M: 65,
                MAX_GPS_ACCURACY_M: 40,
                SESSION_TOTAL_SEC: 3600,
                DB_NAME: "SecureAttendanceDB",
                DB_VERSION: 1,
                MAX_VELOCITY_MPS: 35,        // Max human-plausible speed change threshold (126 km/h)
                STALE_MOTION_WINDOW_SEC: 180 // Max time allowed without a single phone vibration change
            });

            let state = {
                elapsed: 0,
                verified: 0,
                isInside: false,
                compromised: false,
                db: null,
                lastLat: null,
                lastLng: null,
                lastGpsTime: 0,
                lastMovementDetected: Date.now(),
                identityPassed: true
            };

            const DOM = Object.freeze({
                badge: document.getElementById('statusBadge'),
                timeBar: document.getElementById('timeBar'),
                timeVal: document.getElementById('timeVal'),
                attBar: document.getElementById('attendanceBar'),
                attVal: document.getElementById('attendanceVal'),
                console: document.getElementById('consoleLog'),
                overlay: document.getElementById('identityOverlay'),
                verifyBtn: document.getElementById('verifyIdentityBtn')
            });

            function pushLog(text) {
                const el = document.createElement('div');
                el.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
                DOM.console.appendChild(el);
                DOM.console.scrollTop = DOM.console.scrollHeight;
                if (DOM.console.childNodes.length > 15) DOM.console.removeChild(DOM.console.firstChild);
            }

            function geoMath(lat1, lon1, lat2, lon2) {
                const R = 6371e3;
                const p1 = lat1 * Math.PI / 180;
                const p2 = lat2 * Math.PI / 180;
                const dPhi = (lat2 - lat1) * Math.PI / 180;
                const dLam = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dPhi/2) * Math.sin(dPhi/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dLam/2) * Math.sin(dLam/2);
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            }

            function initDatabase() {
                const request = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("state")) db.createObjectStore("state", { keyPath: "parameter" });
                };
                request.onsuccess = (e) => {
                    state.db = e.target.result;
                    restoreSession();
                };
                request.onerror = () => startEngine();
            }

            function saveState() {
                if (!state.db) return;
                try {
                    const transaction = state.db.transaction(["state"], "readwrite");
                    const store = transaction.objectStore("state");
                    store.put({ parameter: "elapsed", value: state.elapsed });
                    store.put({ parameter: "verified", value: state.verified });
                } catch (e) {}
            }

            function restoreSession() {
                try {
                    const transaction = state.db.transaction(["state"], "readonly");
                    const store = transaction.objectStore("state");
                    const getElapsed = store.get("elapsed");
                    getElapsed.onsuccess = () => {
                        if (getElapsed.result) state.elapsed = getElapsed.result.value;
                        const getVerified = store.get("verified");
                        getVerified.onsuccess = () => {
                            if (getVerified.result) state.verified = getVerified.result.value;
                            startEngine();
                        };
                    };
                } catch (e) { startEngine(); }
            }

            // Behavioral Analytics Engine (Hardware Gyroscope/Device Motion tracking)
            function initSensorTelemetry() {
                if (window.DeviceMotionEvent) {
                    window.addEventListener('devicemotion', (event) => {
                        const acc = event.accelerationIncludingGravity;
                        if (acc) {
                            const totalMovement = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
                            // If the change variance drifts beyond micro flat baselines, record life activity
                            if (totalMovement > 0.1) {
                                state.lastMovementDetected = Date.now();
                            }
                        }
                    }, false);
                }
            }

            function processLocationStream(position) {
                if (state.compromised) return;

                if (!position || !position.coords || position.mocked === true) {
                    isolateTerminal("Location spoofing hook detected.");
                    return;
                }

                const uLat = position.coords.latitude;
                const uLng = position.coords.longitude;
                const uAcc = position.coords.accuracy;
                const now = Date.now();

                // Logic Vector 1: Teleportation Velocity Verification
                if (state.lastLat !== null && state.lastLng !== null) {
                    const distanceDelta = geoMath(uLat, uLng, state.lastLat, state.lastLng);
                    const timeDeltaSeconds = (now - state.lastGpsTime) / 1000;
                    if (timeDeltaSeconds > 0 && (distanceDelta / timeDeltaSeconds) > CONFIG.MAX_VELOCITY_MPS) {
                        isolateTerminal("Instant travel anomaly detected.");
                        return;
                    }
                }

                if (uAcc > CONFIG.MAX_GPS_ACCURACY_M) {
                    DOM.badge.textContent = "Signal Untrusted";
                    DOM.badge.className = "status-pill warning";
                    state.isInside = false;
                    return;
                }

                const distance = geoMath(uLat, uLng, CONFIG.TARGET_LAT, CONFIG.TARGET_LNG);
                state.isInside = (distance <= CONFIG.ALLOWED_RADIUS_M);

                state.lastLat = uLat;
                state.lastLng = uLng;
                state.lastGpsTime = now;

                if (state.isInside && state.identityPassed) {
                    DOM.badge.textContent = "Presence Verified";
                    DOM.badge.className = "status-pill active";
                } else {
                    DOM.badge.textContent = "Outside Area Boundary";
                    DOM.badge.className = "status-pill isolated";
                }
            }

            function clockTickEngine() {
                if (state.compromised) return;

                if (state.elapsed >= CONFIG.SESSION_TOTAL_SEC) {
                    DOM.badge.textContent = "Session Complete";
                    DOM.badge.className = "status-pill active";
                    pushLog("Attendance timeline finished safely.");
                    return;
                }

                // Logic Vector 2: Static Device Anti-Desk Stacking Validation
                const idleDuration = (Date.now() - state.lastMovementDetected) / 1000;
                if (idleDuration > CONFIG.STALE_MOTION_WINDOW_SEC) {
                    state.isInside = false;
                    DOM.badge.textContent = "Motion Verification Failed";
                    DOM.badge.className = "status-pill warning";
                    pushLog("Warning: No device movement detected. Progress paused.");
                }

                state.elapsed++;
                if (state.isInside && state.identityPassed && idleDuration <= CONFIG.STALE_MOTION_WINDOW_SEC) {
                    state.verified++;
                }

                // Logic Vector 3: Random Identity Pulse Challenges
                if (state.elapsed % 600 === 0 && state.elapsed > 0) { 
                    triggerIdentityChallenge();
                }

                updateUI();
                saveState();
            }

            function updateUI() {
                const timePercent = (state.elapsed / CONFIG.SESSION_TOTAL_SEC) * 100;
                DOM.timeBar.style.width = `${timePercent}%`;
                DOM.timeVal.textContent = `${Math.floor(timePercent)}%`;

                const attPercent = (state.verified / CONFIG.SESSION_TOTAL_SEC) * 100;
                DOM.attBar.style.width = `${attPercent}%`;
                DOM.attVal.textContent = `${Math.floor(attPercent)}%`;
            }

            function triggerIdentityChallenge() {
                state.identityPassed = false;
                DOM.overlay.style.display = "flex";
                pushLog("Identity puzzle triggered to verify device owner.");
                
                // Attempt to request Web Authentication APIs if available locally
                if (window.PublicKeyCredential) {
                    // Triggers the device's native lock screen Biometrics (Face ID / Fingerprint / Passcode)
                    navigator.credentials.create({
                        publicKey: {
                            challenge: new Uint8Array([1, 2, 3, 4]),
                            rp: { name: "System Verification" },
                            user: { id: new Uint8Array([1]), name: "user", displayName: "User" },
                            pubKeyCredParams: [{ type: "public-key", alg: -7 }]
                        }
                    }).then(() => {
                        resolveChallengeSuccess();
                    }).catch(() => {
                        // Soft fallback mechanism if biometrics fail or get cancelled
                    });
                }
            }

            function resolveChallengeSuccess() {
                state.identityPassed = true;
                DOM.overlay.style.display = "none";
                pushLog("Owner identity re-verified successfully.");
            }

            function isolateTerminal(reason) {
                state.compromised = true;
                state.isInside = false;
                DOM.badge.textContent = "Node Compromised";
                DOM.badge.className = "status-pill isolated";
                DOM.timeBar.style.backgroundColor = "var(--danger)";
                DOM.attBar.style.backgroundColor = "var(--danger)";
                pushLog(`CRITICAL: ${reason}`);
            }

            function startEngine() {
                pushLog("Security environment verified. Monitoring active.");
                
                navigator.geolocation.watchPosition(processLocationStream, () => {
                    state.isInside = false;
                    DOM.badge.textContent = "Signal Disconnected";
                    DOM.badge.className = "status-pill isolated";
                }, { enableHighAccuracy: true, maximumAge: 0 });

                initSensorTelemetry();
                setInterval(clockTickEngine, 1000);
            }

            DOM.verifyBtn.addEventListener('click', () => {
                resolveChallengeSuccess();
            });

            if (navigator.geolocation) {
                initDatabase();
            } else {
                isolateTerminal("Unsupported environment firmware framework.");
            }
        })();
    </script>
</body>
</html>

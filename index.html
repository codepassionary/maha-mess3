<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VetTrack Luxe | Smart Mess</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #FF8C00; --bg: #05070A; --card: rgba(17, 24, 39, 0.8); 
            --surface: rgba(31, 41, 55, 0.5); --text: #F9FAFB; --sub: #9CA3AF;
            --success: #10B981; --danger: #EF4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px 20px 100px 20px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .profile-btn { width: 45px; height: 45px; border-radius: 15px; border: 2px solid var(--surface); object-fit: cover; }

        /* Waste Prevention Banner */
        .waste-banner {
            background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 15px; border-radius: 20px; margin-bottom: 20px; display: flex; gap: 12px; align-items: center;
        }
        .waste-banner i { font-size: 20px; }
        .waste-banner small { font-size: 11px; color: var(--success); font-weight: 700; line-height: 1.3; }

        .bill-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #05070A 100%);
            padding: 25px; border-radius: 32px; margin-bottom: 25px; border: 1px solid var(--surface);
        }
        .bill-amt { font-family: 'Outfit'; font-size: 42px; font-weight: 900; margin: 5px 0; color: var(--p); }

        /* Attendance Toggles */
        .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .toggle-card { 
            background: var(--card); border: 1px solid var(--surface); 
            padding: 20px; border-radius: 24px; text-align: center; cursor: pointer; transition: 0.3s;
            position: relative; overflow: hidden;
        }
        .toggle-card.active { border-color: var(--p); background: rgba(255,140,0,0.05); }
        
        /* Deadline Locked Style */
        .toggle-card.locked { opacity: 0.5; cursor: not-allowed; grayscale: 1; }
        .lock-icon { font-size: 10px; color: var(--sub); display: block; margin-top: 5px; font-weight: 800; }

        .icon-circle { 
            width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--surface); 
            margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-weight: 800;
        }
        .active .icon-circle { background: var(--p); border-color: var(--p); color: white; }

        .activity-box { background: var(--card); border-radius: 24px; border: 1px solid var(--surface); margin-top: 20px; }
        .activity-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }

        #authUI { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; text-align: center; }
        .btn-action { background: var(--p); color: white; border: none; padding: 16px 32px; border-radius: 20px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

<div id="authUI">
    <h1 style="font-family:'Outfit'; font-size: 48px; margin: 0;">VetTrack<span style="color:var(--p)">.</span></h1>
    <button class="btn-action" onclick="login()">Login to Dashboard</button>
</div>

<div id="appUI" style="display:none;">
    <header class="header">
        <h2 id="userName" style="font-family:'Outfit'; margin: 0;">Student</h2>
        <img id="userIcon" class="profile-btn" src="">
    </header>

    <div class="waste-banner">
        <i>♻️</i>
        <small>HELP REDUCE WASTE:<br>Decide Lunch before 10 AM & Dinner before 4 PM.</small>
    </div>

    <div class="bill-card">
        <div style="font-size:11px; font-weight:800; color:var(--sub); text-transform:uppercase;">Monthly Bill</div>
        <div class="bill-amt" id="totalBill">₹0</div>
        <div id="payStatus" style="font-size:10px; font-weight:800;">SYNCING...</div>
    </div>

    <h3 style="font-family:'Outfit'; font-size:18px; margin-bottom:15px;">Today's Meals</h3>
    <div class="toggle-grid">
        <div id="card-l" class="toggle-card" onclick="handleMealToggle('l')">
            <div class="icon-circle">L</div>
            <b style="font-size: 12px;">LUNCH</b>
            <span id="lock-l" class="lock-icon">Deadline: 10:00 AM</span>
        </div>
        <div id="card-d" class="toggle-card" onclick="handleMealToggle('d')">
            <div class="icon-circle">D</div>
            <b style="font-size: 12px;">DINNER</b>
            <span id="lock-d" class="lock-icon">Deadline: 04:00 PM</span>
        </div>
    </div>

    <h3 style="font-family:'Outfit'; font-size:18px; margin: 30px 0 15px;">Recent History</h3>
    <div class="activity-box" id="activityFeed"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, collection, query, orderBy, limit, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", 
        messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" 
    };

    const app = initializeApp(firebaseConfig), db = getFirestore(app), auth = getAuth(app), provider = new GoogleAuthProvider();
    let user, userData, logs = {};

    window.login = () => signInWithPopup(auth, provider);

    onAuthStateChanged(auth, async u => {
        if(u) {
            user = u;
            document.getElementById('authUI').style.display = 'none';
            document.getElementById('appUI').style.display = 'block';
            document.getElementById('userName').innerText = u.displayName;
            document.getElementById('userIcon').src = u.photoURL;
            
            // Sync Profile & Pricing
            onSnapshot(doc(db, "users", u.uid), s => {
                userData = s.data() || { mealPrice: 50, isPaid: false };
                updateUI();
            });

            // Sync Current Month Logs
            const mk = `${new Date().getFullYear()}_${new Date().getMonth()}`;
            onSnapshot(doc(db, "users", u.uid, "logs", mk), s => {
                logs = s.exists() ? s.data() : {};
                updateUI();
            });

            // Sync Activity
            const q = query(collection(db, "users", u.uid, "activity"), orderBy("time", "desc"), limit(5));
            onSnapshot(q, snap => {
                const feed = document.getElementById('activityFeed'); feed.innerHTML = "";
                snap.forEach(d => {
                    const a = d.data();
                    feed.innerHTML += `<div class="activity-item">${a.msg}<br><small style="color:var(--sub)">${new Date(a.time).toLocaleTimeString()}</small></div>`;
                });
            });
        }
    });

    function updateUI() {
        const now = new Date();
        const hour = now.getHours();
        const today = now.getDate();

        // 1. Check Deadlines
        const isLunchLocked = hour >= 10;
        const isDinnerLocked = hour >= 16;

        const d = logs[today] || { l:0, d:0 };
        
        // Update Lunch Card
        const cl = document.getElementById('card-l');
        cl.className = d.l ? 'toggle-card active' : 'toggle-card';
        if(isLunchLocked) {
            cl.classList.add('locked');
            document.getElementById('lock-l').innerText = "Locked at 10 AM";
        }

        // Update Dinner Card
        const cd = document.getElementById('card-d');
        cd.className = d.d ? 'toggle-card active' : 'toggle-card';
        if(isDinnerLocked) {
            cd.classList.add('locked');
            document.getElementById('lock-d').innerText = "Locked at 4 PM";
        }

        // 2. Calculate Bill
        let m=0, g=0;
        Object.values(logs).forEach(v => { 
            m += (v.l?1:0) + (v.d?1:0); 
            g += (parseInt(v.lg)||0) + (parseInt(v.dg)||0);
        });
        document.getElementById('totalBill').innerText = "₹" + (m+g) * (userData.mealPrice || 50);
        document.getElementById('payStatus').innerText = userData.isPaid ? "✅ VERIFIED PAID" : "⚠️ PAYMENT DUE";
        document.getElementById('payStatus').style.color = userData.isPaid ? "var(--success)" : "var(--danger)";
    }

    window.handleMealToggle = async (type) => {
        const now = new Date();
        const hour = now.getHours();

        // Enforcement Logic
        if(type === 'l' && hour >= 10) {
            alert("Lunch deadline (10:00 AM) has passed. Changes cannot be made.");
            return;
        }
        if(type === 'd' && hour >= 16) {
            alert("Dinner deadline (04:00 PM) has passed. Changes cannot be made.");
            return;
        }

        const today = now.getDate();
        if(!logs[today]) logs[today] = { l:0, d:0, lg:0, dg:0, w:0 };
        
        const newState = logs[today][type] ? 0 : 1;
        logs[today][type] = newState;
        
        const mk = `${now.getFullYear()}_${now.getMonth()}`;
        await setDoc(doc(db, "users", user.uid, "logs", mk), { [today]: logs[today] }, { merge: true });
        
        // Log Activity
        const mealName = type === 'l' ? 'Lunch' : 'Dinner';
        const action = newState ? 'Marked' : 'Cancelled';
        await addDoc(collection(db, "users", user.uid, "activity"), {
            msg: `${action} ${mealName} for today.`,
            time: Date.now()
        });
    };
</script>
</body>
</html>

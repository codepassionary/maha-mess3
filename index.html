<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VetTrack Luxe | Premier</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #FF8C00; --p-glow: rgba(255, 140, 0, 0.3);
            --bg: #0F172A; --card: #1E293B; --surface: #334155;
            --text: #F8FAFC; --sub: #94A3B8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding-bottom: 40px; padding-top: env(safe-area-inset-top);
        }

        .container { max-width: 480px; margin: 0 auto; padding: 25px; }

        /* ELITE WELCOME SCREEN */
        #welcomeScreen { 
            position: fixed; inset: 0; background: var(--bg); z-index: 10000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        .logo-wrap { position: relative; margin-bottom: 30px; }
        .logo-main { font-family: 'Outfit'; font-size: 56px; font-weight: 900; letter-spacing: -2px; }
        .glow-orb { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px; background: var(--p); filter: blur(60px); opacity: 0.4; z-index: -1; }

        /* HEADER SECTION */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .greet-p { margin: 0; font-size: 11px; color: var(--p); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .user-h1 { font-family: 'Outfit'; font-size: 34px; margin: 0; font-weight: 800; letter-spacing: -1px; }
        .pfp { width: 50px; height: 50px; border-radius: 18px; border: 2px solid var(--surface); object-fit: cover; }

        /* NAVIGATION BAR */
        .nav-pill { 
            display: flex; align-items: center; background: var(--card); padding: 6px; 
            border-radius: 20px; border: 1px solid var(--surface); margin-bottom: 25px;
        }
        .nav-pill button { border: none; background: var(--surface); color: white; width: 40px; height: 40px; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .nav-pill button:active { transform: scale(0.9); }
        .nav-pill span { flex: 1; text-align: center; font-weight: 700; font-size: 14px; color: var(--sub); }

        /* LUXURY STAT CARD */
        .stat-card {
            background: linear-gradient(160deg, #FF8C00 0%, #F39C12 100%);
            padding: 30px; border-radius: 35px; margin-bottom: 35px;
            box-shadow: 0 25px 50px -12px var(--p-glow);
            position: relative; overflow: hidden;
        }
        .stat-card::before { content: ""; position: absolute; width: 150px; height: 150px; background: white; opacity: 0.1; border-radius: 50%; top: -50px; right: -50px; }
        .label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.8); }
        .total-val { font-family: 'Outfit'; font-size: 60px; font-weight: 900; margin: 5px 0; color: white; letter-spacing: -2px; }
        .mini-badge { display: inline-block; padding: 6px 14px; background: rgba(0,0,0,0.15); border-radius: 12px; font-size: 12px; font-weight: 700; color: white; }

        /* DAY ROW DESIGN */
        .day-item { 
            display: grid; grid-template-columns: 65px 1fr 1fr 1fr; gap: 10px; align-items: center; 
            padding: 16px; background: var(--card); border-radius: 28px; margin-bottom: 14px;
            border: 1px solid var(--surface); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .day-item.is-today { border-color: var(--p); background: #1e293b; box-shadow: 0 0 20px rgba(255,140,0,0.1); }
        .day-item.is-locked { opacity: 0.4; pointer-events: none; }

        .date-circ { text-align: center; }
        .date-circ .n { font-family: 'Outfit'; font-size: 24px; font-weight: 800; color: var(--p); display: block; line-height: 1; }
        .date-circ .d { font-size: 10px; font-weight: 700; color: var(--sub); text-transform: uppercase; }

        /* INTERACTIVE PILLS */
        .item-pill { 
            height: 55px; border-radius: 20px; border: 1px solid var(--surface); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(255,255,255,0.03); cursor: pointer; transition: 0.3s;
        }
        .item-pill.active { background: var(--p); border-color: var(--p); color: white; box-shadow: 0 10px 20px -5px var(--p-glow); }
        .item-pill span { font-size: 9px; font-weight: 800; text-transform: uppercase; margin-top: 2px; }

        /* DETAIL PANEL */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 100; display: none; align-items: flex-end; }
        .sheet { background: var(--card); width: 100%; border-radius: 40px 40px 0 0; padding: 40px; border-top: 1px solid var(--surface); transform: translateY(100%); transition: 0.5s cubic-bezier(0.32, 0.72, 0, 1); }
        .sheet.up { transform: translateY(0); }
        .sheet h2 { font-family: 'Outfit'; font-size: 32px; margin: 0; color: white; }
        textarea { width: 100%; height: 140px; border-radius: 24px; border: 2px solid var(--surface); padding: 20px; font-size: 16px; margin: 20px 0; outline: none; background: var(--bg); color: white; resize: none; }
        .btn-prime { background: var(--p); color: white; padding: 22px; border-radius: 24px; border: none; font-weight: 800; width: 100%; cursor: pointer; font-size: 16px; box-shadow: 0 15px 30px var(--p-glow); }

        .note-tag { grid-column: 1 / -1; font-size: 12px; color: var(--p); background: rgba(255,140,0,0.1); padding: 8px 15px; border-radius: 12px; margin-top: 10px; font-weight: 600; }
    </style>
</head>
<body>

<div id="welcomeScreen">
    <div class="logo-wrap">
        <div class="glow-orb"></div>
        <h1 class="logo-main">VetTrack<span style="color:var(--p)">.</span></h1>
    </div>
    <button class="btn-prime" onclick="login()" style="width: 280px; border-radius: 50px;">Begin Experience</button>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()">
    <div class="sheet" id="sheet" onclick="event.stopPropagation()">
        <h2 id="sheetTitle">Day Notes</h2>
        <textarea id="noteInput" placeholder="Add guest meals, special preferences..."></textarea>
        <button class="btn-prime" onclick="saveNote()">Confirm Details</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <div class="greeting-text">
            <p id="greetLabel">Premier Dining</p>
            <h1 id="userLabel">Diner</h1>
        </div>
        <button onclick="logout()" style="border:none; background:none; font-size:24px; cursor:pointer;">🏠</button>
    </div>

    <div class="nav-pill">
        <button onclick="changeMonth(-1)">‹</button>
        <span id="monthLabel">Fetching...</span>
        <button onclick="changeMonth(1)">›</button>
    </div>

    <div class="stat-card">
        <div class="label">Monthly Investment</div>
        <div class="total-val" id="totalValue">₹0</div>
        <div class="mini-badge" id="statsSub">0 Meals Recorded</div>
    </div>

    <div id="logsGrid"></div>
    <p style="text-align:center; font-size:11px; color: var(--sub); margin-top: 40px; font-weight: 500; letter-spacing: 1px;">HOLD ANY DAY TO ADD CUSTOM NOTES</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyBfQcQbrs6m7euc6twcKeHMBH8GJkoM76g", authDomain: "vettrack-1c65e.firebaseapp.com", 
        projectId: "vettrack-1c65e", storageBucket: "vettrack-1c65e.firebasestorage.app", 
        messagingSenderId: "591343582241", appId: "1:591343582241:web:9fc9761725ad7d9bb97760" 
    };

    const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app), provider = new GoogleAuthProvider();
    let user = null, logs = {}, viewDate = new Date(), todayDate = new Date(), activeDayId = null;

    // AUTH
    window.login = () => setPersistence(auth, browserLocalPersistence).then(() => signInWithPopup(auth, provider));
    window.logout = () => { if(confirm("End current session?")) signOut(auth).then(() => { localStorage.clear(); location.reload(); }); };

    onAuthStateChanged(auth, async (u) => {
        if (u) { 
            user = u; 
            document.getElementById('welcomeScreen').style.display = 'none'; 
            document.getElementById('userLabel').innerText = u.displayName.split(' ')[0];
            updateGreet();
            await setDoc(doc(db, "users", u.uid), { name: u.displayName, lastSeen: new Date() }, { merge: true });
            syncData(); 
        } else { document.getElementById('welcomeScreen').style.display = 'flex'; }
    });

    function updateGreet() {
        const h = new Date().getHours();
        const g = h < 12 ? "Good Morning 🌅" : h < 17 ? "Good Afternoon ☀️" : h < 21 ? "Good Evening 🌇" : "Good Night 🌙";
        document.getElementById('greetLabel').innerText = g;
    }

    function syncData() {
        const key = `${viewDate.getFullYear()}_${viewDate.getMonth()}`;
        onSnapshot(doc(db, "users", user.uid, "logs", key), (d) => { logs = d.data() || {}; renderGrid(); });
    }

    function renderGrid() {
        const isCurrent = viewDate.getMonth() === todayDate.getMonth() && viewDate.getFullYear() === todayDate.getFullYear();
        document.getElementById('monthLabel').innerText = viewDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        const grid = document.getElementById('logsGrid'); grid.innerHTML = '';
        const daysCount = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();

        for (let i = 1; i <= daysCount; i++) {
            const data = logs[i] || { l: 0, d: 0, w: 0, n: "" };
            const dayName = new Date(viewDate.getFullYear(), viewDate.getMonth(), i).toLocaleDateString('en-IN', { weekday: 'short' });
            
            const card = document.createElement('div');
            card.className = `day-item ${!isCurrent ? 'is-locked' : ''} ${isCurrent && i === todayDate.getDate() ? 'is-today' : ''}`;
            
            let timer;
            const start = () => timer = setTimeout(() => openSheet(i), 600);
            const stop = () => clearTimeout(timer);
            card.onmousedown = start; card.onmouseup = stop; card.ontouchstart = start; card.ontouchend = stop;

            card.innerHTML = `
                <div class="date-circ"><span class="n">${i}</span><span class="d">${dayName}</span></div>
                <div class="item-pill ${data.l?'active':''}" onclick="toggle(${i},'l')"><span>Lunch</span></div>
                <div class="item-pill ${data.d?'active':''}" onclick="toggle(${i},'d')"><span>Dinner</span></div>
                <div class="item-pill ${data.w?'active':''}" onclick="toggle(${i},'w')"><span>Water</span></div>
                ${data.n ? `<div class="note-tag">Personal Note: ${data.n}</div>` : ''}
            `;
            grid.appendChild(card);
        }
        calculate();
    }

    window.toggle = async (day, type) => {
        if (viewDate.getMonth() !== todayDate.getMonth()) return;
        const obj = logs[day] || { l: 0, d: 0, w: 0, n: "" };
        obj[type] = obj[type] ? 0 : 1;
        await setDoc(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), { [day]: obj }, { merge: true });
    };

    window.openSheet = (day) => {
        activeDayId = day;
        document.getElementById('sheetTitle').innerText = `Details for Day ${day}`;
        document.getElementById('noteInput').value = logs[day]?.n || "";
        document.getElementById('sheetOverlay').style.display = 'flex';
        setTimeout(() => document.getElementById('sheet').classList.add('up'), 10);
    };

    window.closeSheet = () => {
        document.getElementById('sheet').classList.remove('up');
        setTimeout(() => document.getElementById('sheetOverlay').style.display = 'none', 400);
    };

    window.saveNote = async () => {
        const obj = logs[activeDayId] || { l: 0, d: 0, w: 0, n: "" };
        obj.n = document.getElementById('noteInput').value;
        await setDoc(doc(db, "users", user.uid, "logs", `${viewDate.getFullYear()}_${viewDate.getMonth()}`), { [activeDayId]: obj }, { merge: true });
        closeSheet();
    };

    function calculate() {
        let m=0, w=0; 
        Object.values(logs).forEach(v => { if(v.l) m++; if(v.d) m++; if(v.w) w++; });
        document.getElementById('totalValue').innerText = `₹${((m*50)+(w*30)).toLocaleString('en-IN')}`;
        document.getElementById('statsSub').innerText = `${m} Meals • ${w} Water Units Total`;
    }

    window.changeMonth = (dir) => { viewDate.setMonth(viewDate.getMonth() + dir); syncData(); };
</script>
</body>
</html>
